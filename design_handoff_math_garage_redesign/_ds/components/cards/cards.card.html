<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-app);padding:20px;font-family:var(--font-body)}.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { MenuCard, LevelTile, Badge } = window.TurboMathDesignSystem_fa0890;
function Demo(){
  return <div>
    <div className="row">
      <div style={{width:200}}><MenuCard icon="🏎️" title="Practice" description="Counting & shapes" badge={<Badge variant="primary">PLAY</Badge>}/></div>
      <div style={{width:200}}><MenuCard icon="🚀" title="Explore" description="Hands-on missions" variant="accent" badge={<Badge variant="accent">EXPLORE</Badge>}/></div>
      <div style={{width:200}}><MenuCard icon="🏁" title="Challenge" description="Timed sprints" variant="reward" badge={<Badge variant="reward">HARD</Badge>}/></div>
    </div>
    <div className="row">
      <LevelTile icon="🔧" label="Level 1" stars={3}/>
      <LevelTile icon="⚙️" label="Level 2" stars={1}/>
      <LevelTile icon="🏁" label="Level 3" locked/>
      <LevelTile icon="⚡" label="Level 4" variant="accent" stars={2}/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
