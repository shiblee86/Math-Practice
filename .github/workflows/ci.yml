name: CI/CD

# Runs the full unit/integration/regression suite (tests/run.py) on every push
# and pull request. On a successful push to main, publishes the app (a plain
# static site, no build step) to GitHub Pages — so a broken push never goes
# live; only a commit that passes the suite does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install test runner dependency
        run: pip install websockets

      - name: Run tests/run.py (unit + integration + regression)
        run: python3 tests/run.py

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site (repo root — no build step)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
