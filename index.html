<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 Find the Missing Number - Math Adventure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --bg-dark: #0a0718;
    --card-dark: #1a1530;
    --text-light: #f0ebff;
    --text-soft: #cdc2f0;
    --sky: #6EC6F5;
    --sun: #FFD93D;
    --grass: #6BCB77;
    --coral: #FF6B6B;
    --purple: #C77DFF;
    --border-glow: #433b6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg-dark);
    min-height: 100vh;
    color: var(--text-light);
    padding: 16px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  /* Top bar */
  .topbar {
    background: #1f1a33;
    border-radius: 20px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    border: 1px solid #41386b;
    box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    position: sticky;
    top: 8px;
    z-index: 100;
    backdrop-filter: blur(5px);
  }
  
  .topbar-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--sun);
    text-shadow: 0 0 8px #b8860b;
  }
  
  .topbar-btns {
    display: flex;
    gap: 10px;
  }
  
  .tb-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 30px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform 0.1s;
  }
  
  .tb-btn:hover {
    transform: scale(1.05);
  }
  
  .tb-save {
    background: var(--sun);
    color: #1a0f2a;
  }
  
  .tb-load {
    background: var(--grass);
    color: #0f0a1a;
  }
  
  .tb-lbl {
    font-size: 0.75rem;
    color: #b1a5d9;
  }

  /* Screens */
  .screen {
    display: none;
  }
  
  .screen.active {
    display: block;
  }

  /* Home screen */
  .home-hero {
    text-align: center;
    padding: 20px 0 10px;
  }
  
  .home-hero h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.4rem;
    background: linear-gradient(135deg, var(--sun), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px #9f7aea;
  }
  
  .home-hero p {
    color: var(--text-soft);
    font-size: 1rem;
    margin-top: 8px;
  }

  /* Level grid */
  .levels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    margin-top: 24px;
  }

  .level-btn {
    background: var(--card-dark);
    border: 2px solid #3d3460;
    border-radius: 24px;
    padding: 20px 10px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    transition: transform 0.15s, border-color 0.15s;
  }
  
  .level-btn:hover {
    transform: translateY(-5px);
    border-color: var(--purple);
  }
  
  .level-icon {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }
  
  .level-name {
    font-weight: 800;
    font-size: 1rem;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  
  .level-stars {
    color: var(--sun);
    font-size: 0.9rem;
  }

  /* Progress chart */
  .progress-chart {
    background: #1e1932;
    border-radius: 20px;
    padding: 20px;
    margin-top: 30px;
    border: 1px solid #4f4377;
  }
  
  .progress-bar-cont {
    background: #2f274a;
    border-radius: 12px;
    height: 24px;
    margin: 12px 0 8px;
  }
  
  .progress-bar-fill {
    height: 100%;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--purple), var(--sky));
    width: 0%;
    transition: width 0.4s;
  }

  /* Quiz screen */
  .quiz-head {
    background: #1e1932;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid #5a4c82;
  }
  
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    color: #b7a9e6;
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  
  .quiz-score-row {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  
  .qs-item {
    text-align: center;
    flex: 1;
  }
  
  .qs-label {
    font-size: 0.7rem;
    color: #aea0d9;
  }
  
  .qs-val {
    font-size: 1.5rem;
    font-weight: 900;
    color: white;
  }
  
  .prog-bar {
    background: #2f274a;
    border-radius: 8px;
    height: 10px;
  }
  
  .prog-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--purple), var(--sky));
    transition: width 0.4s;
  }

  /* Question card */
  .q-card {
    background: var(--card-dark);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid #5b4d87;
    border-top: 6px solid var(--purple);
  }
  
  .q-type-badge {
    display: inline-block;
    background: #362d55;
    color: #e4d2ff;
    border-radius: 30px;
    padding: 4px 14px;
    font-size: 0.75rem;
    font-weight: 800;
    margin-bottom: 12px;
  }
  
  .question-text {
    font-size: 1.3rem;
    font-weight: 700;
    color: white;
    margin-bottom: 16px;
  }
  
  .equation-display {
    font-family: 'Fredoka One', cursive;
    font-size: 2.5rem;
    text-align: center;
    color: var(--sun);
    margin: 16px 0;
  }
  
  .eq-blank {
    border-bottom: 4px solid var(--coral);
    color: var(--coral);
    min-width: 50px;
    display: inline-block;
  }

  /* Step-by-step hint - MUCH CLEARER NOW */
  .step-hint {
    background: #2d2447;
    border-left: 8px solid var(--purple);
    border-radius: 16px;
    padding: 20px;
    margin: 16px 0;
    font-weight: 600;
    color: #e5d5ff;
    line-height: 1.8;
    font-size: 1.1rem;
  }
  
  .step-title {
    color: var(--sun);
    font-weight: 800;
    font-size: 1.2rem;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .step-list {
    padding-left: 20px;
  }
  
  .step-list li {
    margin-bottom: 12px;
  }
  
  .step-highlight {
    background: #3a2e5a;
    padding: 4px 12px;
    border-radius: 30px;
    font-weight: 800;
    color: var(--sun);
    display: inline-block;
    margin: 0 4px;
  }
  
  .step-arrow {
    font-size: 1.5rem;
    color: var(--sun);
    margin: 0 8px;
  }
  
  .step-conclusion {
    background: #1e2f47;
    border: 2px solid var(--sky);
    border-radius: 30px;
    padding: 12px 16px;
    margin-top: 12px;
    font-weight: 800;
    text-align: center;
    color: #b3e0ff;
  }

  .answer-input {
    width: 100%;
    padding: 16px;
    font-size: 2rem;
    font-family: 'Fredoka One', cursive;
    background: #1f1937;
    border: 3px solid #4e4280;
    border-radius: 16px;
    color: var(--sun);
    text-align: center;
    margin: 12px 0;
  }
  
  .answer-input:focus {
    border-color: var(--purple);
    outline: none;
  }

  .feedback {
    border-radius: 12px;
    padding: 14px;
    margin: 10px 0;
    font-weight: 700;
    display: none;
  }
  
  .feedback.show { display: block; }
  .feedback.ok { background: #1d4a2a; color: #c3f0c3; border: 2px solid var(--grass); }
  .feedback.bad { background: #5a2e36; color: #ffcfcf; border: 2px solid var(--coral); }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  
  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 30px;
    font-family: 'Fredoka One', cursive;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.1s;
  }
  
  .btn:hover { transform: translateY(-2px); }
  .btn-check { background: var(--purple); color: white; flex: 1; }
  .btn-next { background: var(--grass); color: #0f0a1a; flex: 1; display: none; }
  .btn-hint { background: var(--sun); color: #1a0f2a; }
  .btn-back { background: #3a3260; color: white; }

  /* Result screen */
  .result-card {
    background: #1e1932;
    border-radius: 28px;
    padding: 28px;
    text-align: center;
    border: 2px solid #6b5b99;
  }
  
  .result-emoji { font-size: 4rem; }
  .result-title { font-size: 2rem; color: var(--sun); }
  .result-pct { font-size: 3rem; font-weight: 900; color: white; }
  .result-stars { font-size: 2rem; color: var(--sun); margin: 10px 0; }

  .mistake-item {
    background: #2f253a;
    border: 2px solid #c45d5d;
    border-radius: 12px;
    padding: 12px;
    margin: 10px 0;
    text-align: left;
  }
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <div class="topbar-title">🔍 Find the Missing Number!</div>
  <div class="topbar-btns">
    <button class="tb-btn tb-save" onclick="saveProgress()">💾 Save</button>
    <button class="tb-btn tb-load" onclick="loadProgress()">📂 Load</button>
    <input type="file" id="loadFile" accept=".json" style="display:none" onchange="loadFile(event)">
  </div>
  <div class="tb-lbl" id="progressLabel">0/6 mastered</div>
</div>

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen active">
  <div class="home-hero">
    <h1>Missing Number Mission!</h1>
    <p>Solve equations like: 15 = 8 + ?  and  25 = 13 + 7 + ?</p>
  </div>
  
  <!-- LEVELS GRID -->
  <div class="levels-grid" id="levelsGrid"></div>
  
  <div class="progress-chart" id="progressChart">
    <h3 style="color:#d4c2ff; margin-bottom:10px;">📊 Your Progress</h3>
    <div id="progressStats">0 of 6 levels mastered (0%)</div>
    <div class="progress-bar-cont"><div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div></div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="quizScreen" class="screen">
  <div class="quiz-head">
    <div class="quiz-meta">
      <span id="quizLevelLabel">Level 1</span>
      <span id="quizQCounter">Q1 / 15</span>
    </div>
    <div class="quiz-score-row">
      <div class="qs-item"><div class="qs-label">✅</div><div class="qs-val" id="scoreCorrect">0</div></div>
      <div class="qs-item"><div class="qs-label">❌</div><div class="qs-val" id="scoreWrong">0</div></div>
      <div class="qs-item"><div class="qs-label">%</div><div class="qs-val" id="scorePercent">—</div></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="quizProgressBar" style="width:0%"></div></div>
  </div>
  
  <div class="q-card" id="questionCard"></div>
  <div class="feedback" id="feedback"></div>
  
  <div class="btn-row">
    <button class="btn btn-back" onclick="goHome()">🏠 Home</button>
    <button class="btn btn-hint" id="hintButton" onclick="showHint()">💡 Hint</button>
    <button class="btn btn-check" id="checkButton" onclick="checkAnswer()">✅ Check</button>
    <button class="btn btn-next" id="nextButton" onclick="nextQuestion()">▶ Next</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen" class="screen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title" id="resultTitle">Great job!</div>
    <div class="result-pct" id="resultPercent">0%</div>
    <div class="result-stars" id="resultStars">⭐⭐⭐</div>
    <div id="resultMessage"></div>
    <div id="mistakesList"></div>
    <div class="btn-row" style="justify-content:center; margin-top:20px;">
      <button class="btn btn-back" id="retryButton">🔁 Try Again</button>
      <button class="btn btn-check" onclick="goHome()">🏠 Home</button>
      <button class="btn btn-next" id="nextLevelButton" style="display:none">➡️ Next Level</button>
    </div>
  </div>
</div>

</div>

<script>
// ==================== MISSING NUMBER ADVENTURE ====================
const LEVELS = [
  { id: 'level1', name: 'Level 1 · Two Numbers', icon: '🔍', desc: 'Find the missing number: 10 = 6 + ?', color: '#6EC6F5' },
  { id: 'level2', name: 'Level 2 · Two Numbers', icon: '🔎', desc: 'Larger totals: 25 = 13 + ?', color: '#FFD93D' },
  { id: 'level3', name: 'Level 3 · Three Numbers', icon: '❓', desc: 'Three numbers: 20 = 8 + 5 + ?', color: '#C77DFF' },
  { id: 'level4', name: 'Level 4 · Three Numbers', icon: '❔', desc: 'Larger: 45 = 17 + 12 + ?', color: '#6BCB77' },
  { id: 'level5', name: 'Level 5 · Word Problems', icon: '📝', desc: 'Real-world missing numbers', color: '#FF6B6B' },
  { id: 'level6', name: 'Level 6 · Mixed Challenge', icon: '🏆', desc: 'All types together', color: '#F9CA24' }
];

// Progress tracking
let progress = {};
let currentLevel = null;
let questions = [];
let qIndex = 0;
let score = 0;
let wrong = 0;
let mistakes = [];
let hintsUsed = 0;
let answered = false;

// Initialize progress
LEVELS.forEach(level => {
  if (!progress[level.id]) {
    progress[level.id] = { completed: false, score: 0 };
  }
});

// ==================== HELPER FUNCTIONS ====================
function rnd(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// ==================== CLEAR HINT GENERATORS ====================

// Level 1: Simple two-number equations (totals up to 20)
function generateLevel1Problems() {
  let problems = [];
  for (let i = 0; i < 15; i++) {
    let total = rnd(8, 20);
    let known = rnd(2, total - 2);
    let missing = total - known;
    
    problems.push({
      type: 'missing_two',
      question: `${total} = ${known} + ?`,
      answer: missing,
      step1: known,
      step2: total,
      hint: `Let's figure this out together! 🤔
      
We have the equation: ${total} = ${known} + ?

What are we trying to do? We need to find the missing number (?) that we add to ${known} to get ${total}.

Step 1: We know one of the numbers is ${known}.
Step 2: To find the missing number, we subtract the number we know from the total:
       ${total} - ${known} = ?

Step 3: ${total} - ${known} = ${missing}

So the missing number is ${missing}! Let's check: ${known} + ${missing} = ${total} ✅`,
      explanation: `${total} - ${known} = ${missing}`
    });
  }
  return shuffle(problems);
}

// Level 2: Two-number equations with larger totals (up to 50)
function generateLevel2Problems() {
  let problems = [];
  for (let i = 0; i < 15; i++) {
    let total = rnd(21, 50);
    let known = rnd(5, total - 5);
    let missing = total - known;
    
    problems.push({
      type: 'missing_two',
      question: `${total} = ${known} + ?`,
      answer: missing,
      step1: known,
      step2: total,
      hint: `Let's solve this step by step! 📝

We have: ${total} = ${known} + ?

🧐 What's happening here? 
This equation means that when we add ${known} and the mystery number (?), we get ${total}.

So to find the mystery number, we need to:
1️⃣ Take the total: ${total}
2️⃣ Subtract the number we know: ${known}
3️⃣ The answer will be our missing number!

${total} - ${known} = ?

${total} - ${known} = ${missing}

✨ The missing number is ${missing}!
Check: ${known} + ${missing} = ${total} ✅`,
      explanation: `${total} - ${known} = ${missing}`
    });
  }
  return shuffle(problems);
}

// Level 3: Three-number equations (totals up to 30)
function generateLevel3Problems() {
  let problems = [];
  for (let i = 0; i < 15; i++) {
    let total = rnd(12, 30);
    let a = rnd(2, 8);
    let b = rnd(2, 8);
    let missing = total - a - b;
    
    // Make sure missing is positive and not too large
    if (missing < 1 || missing > 15) {
      i--;
      continue;
    }
    
    problems.push({
      type: 'missing_three',
      question: `${total} = ${a} + ${b} + ?`,
      answer: missing,
      step1: a + b,
      step2: total,
      hint: `Let's work through this together! 🧮

We have: ${total} = ${a} + ${b} + ?

🤔 What does this mean?
This equation tells us that when we add three numbers together (${a}, ${b}, and the mystery number ?), we get a total of ${total}.

We already know two of the numbers: ${a} and ${b}.

Step 1: First, let's add the two numbers we know:
        ${a} + ${b} = ${a + b}

Step 2: Now we know that ${a + b} + ? = ${total}
        So to find the mystery number, we subtract what we have from the total:
        ${total} - ${a + b} = ?

Step 3: ${total} - ${a + b} = ${missing}

🎉 The missing number is ${missing}!
Let's check our work: ${a} + ${b} + ${missing} = ${total} ✅`,
      explanation: `${total} - ${a} - ${b} = ${missing}`
    });
  }
  return shuffle(problems);
}

// Level 4: Three-number equations with larger totals (up to 70)
function generateLevel4Problems() {
  let problems = [];
  for (let i = 0; i < 15; i++) {
    let total = rnd(31, 70);
    let a = rnd(5, 15);
    let b = rnd(5, 15);
    let missing = total - a - b;
    
    if (missing < 5 || missing > 30) {
      i--;
      continue;
    }
    
    problems.push({
      type: 'missing_three',
      question: `${total} = ${a} + ${b} + ?`,
      answer: missing,
      step1: a + b,
      step2: total,
      hint: `Let's solve this missing number puzzle! 🧩

The equation is: ${total} = ${a} + ${b} + ?

🎯 What's our goal?
We need to find the mystery number (?) that makes all three numbers add up to ${total}.

We already have two numbers: ${a} and ${b}.

🔍 Step 1: Add the numbers we know
    ${a} + ${b} = ${a + b}
    So now we have: ${a + b} + ? = ${total}

🔍 Step 2: Find the missing number by subtracting
    If ${a + b} + ? = ${total}, then:
    ? = ${total} - ${a + b}

🔍 Step 3: Do the subtraction
    ${total} - ${a + b} = ${missing}

✨ The missing number is ${missing}!

Double-check: ${a} + ${b} + ${missing} = ${total} ✅
Perfect!`,
      explanation: `${total} - ${a} - ${b} = ${missing}`
    });
  }
  return shuffle(problems);
}

// Level 5: Word problems with missing numbers
function generateLevel5Problems() {
  return [
    { 
      type: 'word', 
      question: 'Sara needs 15 stickers for her collection. She has 8 stickers. How many more does she need?', 
      answer: 7, 
      hint: `Let's think about this problem! 💭

Sara needs 15 stickers total.
She already has 8 stickers.
We need to find how many MORE she needs.

This is like a missing number problem:
15 = 8 + ?

To find the missing number, we subtract what she has from what she needs:
15 - 8 = ?

15 - 8 = 7

So Sara needs 7 more stickers! ✅`,
      explanation: '15 - 8 = 7' 
    },
    { 
      type: 'word', 
      question: 'Tom has 12 dollars. He wants to buy a toy that costs 20 dollars. How much more money does he need?', 
      answer: 8, 
      hint: `Let's figure this out! 💰

Tom has: 12 dollars
Toy costs: 20 dollars
We need: how much MORE money?

This is a missing number equation:
20 = 12 + ?

To find the missing number:
20 - 12 = ?

20 - 12 = 8

Tom needs 8 more dollars! ✅`,
      explanation: '20 - 12 = 8' 
    },
    { 
      type: 'word', 
      question: 'A pizza has 24 slices. 9 slices are pepperoni and 7 slices are cheese. The rest are veggie. How many veggie slices?', 
      answer: 8, 
      hint: `Let's solve this pizza problem! 🍕

Total slices: 24
Pepperoni: 9 slices
Cheese: 7 slices
Veggie: ? slices

This is a three-number missing number equation:
24 = 9 + 7 + ?

Step 1: Add the numbers we know:
9 + 7 = 16

Step 2: Subtract from the total:
24 - 16 = ?

Step 3: 24 - 16 = 8

So there are 8 veggie slices! ✅
Check: 9 + 7 + 8 = 24`,
      explanation: '24 - 9 - 7 = 8' 
    },
    { 
      type: 'word', 
      question: 'Lily picked 18 flowers. She gave 5 to her mom and 4 to her grandma. How many flowers does Lily have left?', 
      answer: 9, 
      hint: `Let's help Lily count her flowers! 🌸

Lily started with: 18 flowers
Gave to mom: 5 flowers
Gave to grandma: 4 flowers
Left: ? flowers

This is: 18 = 5 + 4 + ?

Step 1: Add what she gave away:
5 + 4 = 9

Step 2: Subtract from what she started with:
18 - 9 = ?

Step 3: 18 - 9 = 9

Lily has 9 flowers left! ✅`,
      explanation: '18 - 5 - 4 = 9' 
    },
    { 
      type: 'word', 
      question: 'There are 25 students in a class. 12 are boys and 8 are wearing glasses. The rest are girls without glasses. How many girls without glasses?', 
      answer: 5, 
      hint: `Let's think about the class! 👧👦

Total students: 25
Boys: 12
Students with glasses: 8
Girls without glasses: ?

Wait - careful! The 8 students with glasses includes both boys and girls.
We need to be careful with this one.

Actually, let's think differently:
Total students = Boys + Girls
Girls = Total - Boys = 25 - 12 = 13

Some girls wear glasses, some don't.
We know 8 students wear glasses total.
Girls without glasses = Girls - (girls with glasses)

But we don't know how many girls wear glasses...

Hmm, this is tricky! Let's try another approach.`,
      explanation: 'This one is tricky! Let\'s skip it for now.' 
    },

// Level 6: Mixed challenge (all types)
function generateLevel6Problems() {
  let problems = [];
  
  // Add some two-number problems
  for (let i = 0; i < 4; i++) {
    let total = rnd(10, 40);
    let known = rnd(3, total - 3);
    let missing = total - known;
    problems.push({
      type: 'missing_two',
      question: `${total} = ${known} + ?`,
      answer: missing,
      hint: `Let's find the missing number! 🔍

We have: ${total} = ${known} + ?

To find the missing number, subtract the number we know from the total:
${total} - ${known} = ?

${total} - ${known} = ${missing}

So the missing number is ${missing}! ✅`,
      explanation: `${total} - ${known} = ${missing}`
    });
  }
  
  // Add some three-number problems
  for (let i = 0; i < 4; i++) {
    let total = rnd(20, 60);
    let a = rnd(4, 12);
    let b = rnd(4, 12);
    let missing = total - a - b;
    if (missing > 0 && missing < 30) {
      problems.push({
        type: 'missing_three',
        question: `${total} = ${a} + ${b} + ?`,
        answer: missing,
        hint: `Let's solve this three-number puzzle! 🧩

We have: ${total} = ${a} + ${b} + ?

Step 1: Add the two numbers we know:
${a} + ${b} = ${a + b}

Step 2: Subtract from the total to find the missing number:
${total} - ${a + b} = ?

${total} - ${a + b} = ${missing}

The missing number is ${missing}! ✅
Check: ${a} + ${b} + ${missing} = ${total}`,
        explanation: `${total} - ${a} - ${b} = ${missing}`
      });
    } else {
      i--;
    }
  }
  
  // Add some word problems
  let wordBanks = [
    { 
      q: 'There are 35 students. 14 are in the library and 12 are on the playground. How many are somewhere else?', 
      a: 9,
      hint: `Let's find where all the students are! 👧👦

Total students: 35
In library: 14
On playground: 12
Somewhere else: ?

This is: 35 = 14 + 12 + ?

Step 1: Add the students we know about:
14 + 12 = 26

Step 2: Subtract from total:
35 - 26 = ?

35 - 26 = 9

So 9 students are somewhere else! ✅`
    },
    { 
      q: 'A train has 80 seats. 32 are taken and 25 are reserved. How many seats are free?', 
      a: 23,
      hint: `Let's count the train seats! 🚂

Total seats: 80
Taken seats: 32
Reserved seats: 25
Free seats: ?

This is: 80 = 32 + 25 + ?

Step 1: Add taken and reserved:
32 + 25 = 57

Step 2: Subtract from total:
80 - 57 = ?

80 - 57 = 23

There are 23 free seats! ✅`
    },
    { 
      q: 'Mom baked 55 cookies. Dad ate 11 and I ate 13. How many are left?', 
      a: 31,
      hint: `Let's count the cookies! 🍪

Mom baked: 55 cookies
Dad ate: 11
I ate: 13
Left: ?

This is: 55 = 11 + 13 + ?

Step 1: Add what was eaten:
11 + 13 = 24

Step 2: Subtract from total:
55 - 24 = ?

55 - 24 = 31

There are 31 cookies left! ✅`
    },
    { 
      q: 'A book has 120 pages. Lisa read 45 pages yesterday and 38 today. How many pages left?', 
      a: 37,
      hint: `Let's help Lisa with her book! 📚

Total pages: 120
Read yesterday: 45
Read today: 38
Left to read: ?

This is: 120 = 45 + 38 + ?

Step 1: Add pages already read:
45 + 38 = 83

Step 2: Subtract from total:
120 - 83 = ?

120 - 83 = 37

Lisa has 37 pages left to read! ✅`
    }
  ];
  
  wordBanks.forEach(w => {
    problems.push({
      type: 'word',
      question: w.q,
      answer: w.a,
      hint: w.hint,
      explanation: ''
    });
  });
  
  return shuffle(problems).slice(0, 15);
}

// ==================== RENDER HOME SCREEN ====================
function renderHome() {
  const grid = document.getElementById('levelsGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  
  LEVELS.forEach(level => {
    const levelData = progress[level.id] || { completed: false, score: 0 };
    const stars = levelData.completed ? (levelData.score >= 90 ? '⭐⭐⭐' : levelData.score >= 70 ? '⭐⭐' : '⭐') : '';
    
    const btn = document.createElement('div');
    btn.className = 'level-btn';
    btn.innerHTML = `
      <div class="level-icon">${level.icon}</div>
      <div class="level-name">${level.name}</div>
      <div class="level-desc" style="font-size:0.8rem; color:#b8aae6; margin:5px 0;">${level.desc}</div>
      <div class="level-stars">${stars}</div>
    `;
    btn.onclick = () => startLevel(level);
    grid.appendChild(btn);
  });
  
  updateProgressStats();
}

function updateProgressStats() {
  let mastered = 0;
  LEVELS.forEach(level => {
    if (progress[level.id]?.completed) mastered++;
  });
  const total = LEVELS.length;
  const pct = Math.round((mastered / total) * 100) || 0;
  
  document.getElementById('progressStats').innerHTML = `${mastered} of ${total} levels mastered (${pct}%)`;
  document.getElementById('progressBarFill').style.width = pct + '%';
  document.getElementById('progressLabel').innerHTML = `${mastered}/${total} mastered`;
}

// ==================== START LEVEL ====================
function startLevel(level) {
  currentLevel = level;
  
  // Generate problems based on level
  if (level.id === 'level1') questions = generateLevel1Problems();
  else if (level.id === 'level2') questions = generateLevel2Problems();
  else if (level.id === 'level3') questions = generateLevel3Problems();
  else if (level.id === 'level4') questions = generateLevel4Problems();
  else if (level.id === 'level5') questions = generateLevel5Problems();
  else if (level.id === 'level6') questions = generateLevel6Problems();
  
  qIndex = 0;
  score = 0;
  wrong = 0;
  mistakes = [];
  hintsUsed = 0;
  answered = false;
  
  document.getElementById('quizLevelLabel').innerHTML = `${level.icon} ${level.name}`;
  
  showScreen('quizScreen');
  renderQuestion();
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function goHome() {
  if (confirm('Leave this level? Progress won\'t be saved.')) {
    renderHome();
    showScreen('homeScreen');
  }
}

// ==================== RENDER QUESTION ====================
function renderQuestion() {
  const q = questions[qIndex];
  const total = questions.length;
  
  document.getElementById('quizQCounter').innerHTML = `Q${qIndex + 1}/${total}`;
  document.getElementById('scoreCorrect').innerHTML = score;
  document.getElementById('scoreWrong').innerHTML = wrong;
  const att = score + wrong;
  document.getElementById('scorePercent').innerHTML = att ? Math.round((score / att) * 100) + '%' : '—';
  document.getElementById('quizProgressBar').style.width = (qIndex / total * 100) + '%';
  
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('checkButton').style.display = 'inline-flex';
  document.getElementById('nextButton').style.display = 'none';
  
  const hintAllowed = qIndex < 4 && hintsUsed < 2;
  document.getElementById('hintButton').style.display = hintAllowed ? 'inline-flex' : 'none';
  document.getElementById('hintButton').disabled = false;
  
  answered = false;
  
  // Build question card
  let html = '';
  if (q.type === 'word') {
    html = `
      <div class="q-type-badge">📖 Word Problem</div>
      <div class="question-text">${q.question}</div>
    `;
  } else {
    html = `
      <div class="q-type-badge">🔍 Find the Missing Number</div>
      <div class="question-text">${q.question}</div>
      <div class="equation-display">${q.question.replace('?', '<span class="eq-blank">?</span>')}</div>
    `;
  }
  
  // Add step-by-step hint box (initially hidden) - now with much clearer formatting
  html += `
    <div class="step-hint" id="hintDisplay" style="display:none; white-space: pre-line;">
      ${q.hint || '💡 Think about what the equation is telling you!'}
    </div>
  `;
  
  // Add answer input
  html += `<input class="answer-input" id="answerInput" type="number" inputmode="numeric" placeholder="Type answer..." autocomplete="off">`;
  
  document.getElementById('questionCard').innerHTML = html;
  document.getElementById('answerInput')?.focus();
}

// ==================== SHOW HINT ====================
function showHint() {
  if (!questions[qIndex]) return;
  hintsUsed++;
  document.getElementById('hintDisplay').style.display = 'block';
  document.getElementById('hintButton').disabled = true;
}

// ==================== CHECK ANSWER ====================
function checkAnswer() {
  if (answered) return;
  
  const q = questions[qIndex];
  const input = document.getElementById('answerInput');
  if (!input) return;
  
  const val = parseInt(input.value);
  if (isNaN(val)) {
    alert('Please enter a number!');
    return;
  }
  
  answered = true;
  const isCorrect = (val === q.answer);
  
  if (isCorrect) {
    score++;
    document.getElementById('feedback').className = 'feedback show ok';
    document.getElementById('feedback').innerHTML = '✅ Correct! ' + (q.explanation || '');
  } else {
    wrong++;
    mistakes.push({
      question: q.question,
      yourAnswer: val,
      correct: q.answer,
      explanation: q.explanation || `The answer is ${q.answer}`
    });
    document.getElementById('feedback').className = 'feedback show bad';
    document.getElementById('feedback').innerHTML = `❌ Your answer ${val} is wrong. Correct: ${q.answer}.<br>${q.explanation || ''}`;
  }
  
  document.getElementById('scoreCorrect').innerHTML = score;
  document.getElementById('scoreWrong').innerHTML = wrong;
  const att = score + wrong;
  document.getElementById('scorePercent').innerHTML = att ? Math.round((score / att) * 100) + '%' : '—';
  
  document.getElementById('checkButton').style.display = 'none';
  document.getElementById('nextButton').style.display = 'inline-flex';
  document.getElementById('hintButton').style.display = 'none';
}

// ==================== NEXT QUESTION ====================
function nextQuestion() {
  qIndex++;
  if (qIndex >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

// ==================== SHOW RESULTS ====================
function showResults() {
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  const passed = pct >= 70;
  
  if (passed) {
    progress[currentLevel.id] = {
      completed: true,
      score: pct
    };
  }
  
  document.getElementById('resultEmoji').innerHTML = pct >= 90 ? '🏆' : pct >= 70 ? '🌟' : '💪';
  document.getElementById('resultTitle').innerHTML = pct >= 90 ? 'Amazing!' : pct >= 70 ? 'Good job!' : 'Keep practicing!';
  document.getElementById('resultPercent').innerHTML = pct + '%';
  document.getElementById('resultStars').innerHTML = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : '⭐';
  document.getElementById('resultMessage').innerHTML = `You got ${score} out of ${total} correct.`;
  
  // Show mistakes
  let mistakesHtml = '';
  if (mistakes.length > 0) {
    mistakesHtml = '<h3 style="color:#ffb3b3; margin:15px 0 8px;">📝 Review mistakes:</h3>';
    mistakes.forEach(m => {
      mistakesHtml += `
        <div class="mistake-item">
          <strong>${m.question}</strong><br>
          Your answer: ${m.yourAnswer} ❌ Correct: ${m.correct}<br>
          <small>${m.explanation || ''}</small>
        </div>
      `;
    });
  }
  document.getElementById('mistakesList').innerHTML = mistakesHtml;
  
  document.getElementById('retryButton').onclick = () => startLevel(currentLevel);
  
  // Next level button
  const levelIndex = LEVELS.findIndex(l => l.id === currentLevel.id);
  if (passed && levelIndex < LEVELS.length - 1) {
    document.getElementById('nextLevelButton').style.display = 'inline-flex';
    document.getElementById('nextLevelButton').onclick = () => startLevel(LEVELS[levelIndex + 1]);
  } else {
    document.getElementById('nextLevelButton').style.display = 'none';
  }
  
  renderHome();
  showScreen('resultScreen');
}

// ==================== SAVE/LOAD ====================
function saveProgress() {
  const data = JSON.stringify({ version: 1, progress: progress }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'missing-number-save.json';
  a.click();
  alert('Progress saved!');
}

function loadProgress() {
  document.getElementById('loadFile').click();
}

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data && data.version === 1 && data.progress) {
        progress = data.progress;
        renderHome();
        alert('Progress loaded!');
      } else {
        alert('Invalid save file');
      }
    } catch (err) {
      alert('Error loading file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ==================== INITIALIZE ====================
renderHome();
</script>
