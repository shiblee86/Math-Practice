<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Adventure ⭐</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --sky: #6EC6F5;
    --sun: #FFD93D;
    --grass: #6BCB77;
    --coral: #FF6B6B;
    --purple: #C77DFF;
    --cream: #FFF8EE;
    --dark: #2D3561;
    --card: #ffffff;
    --shadow: 0 8px 32px rgba(45,53,97,0.13);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(160deg, #e0f7fa 0%, #f3e5f5 50%, #fff9c4 100%);
    min-height: 100vh;
    color: var(--dark);
  }

  h1, h2, h3, .big-num {
    font-family: 'Fredoka One', cursive;
    letter-spacing: 1px;
  }

  /* ---- TOP BAR ---- */
  #topbar {
    background: var(--dark);
    color: white;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
  }
  #topbar h1 { font-size: 1.4rem; color: var(--sun); }
  .topbar-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-save, .btn-load {
    padding: 7px 18px;
    border-radius: 20px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-save { background: var(--sun); color: var(--dark); }
  .btn-load { background: var(--grass); color: white; }
  .btn-save:hover, .btn-load:hover { transform: scale(1.05); }
  #progress-label { font-size: 0.8rem; color: #aaa; }

  /* ---- SCREENS ---- */
  .screen { display: none; padding: 24px 16px; max-width: 700px; margin: 0 auto; }
  .screen.active { display: block; }

  /* ---- HOME SCREEN ---- */
  #home-screen { text-align: center; }
  .home-title { font-size: 3rem; color: var(--dark); margin-bottom: 8px; }
  .home-sub { font-size: 1.1rem; color: #666; margin-bottom: 32px; }
  .levels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin-top: 20px;
  }
  .level-btn {
    background: white;
    border: 3px solid transparent;
    border-radius: 20px;
    padding: 18px 10px;
    cursor: pointer;
    text-align: center;
    box-shadow: var(--shadow);
    transition: transform 0.15s, border-color 0.15s;
    font-family: 'Nunito', sans-serif;
    position: relative;
  }
  .level-btn:hover:not(.locked) { transform: translateY(-4px); border-color: var(--sky); }
  .level-btn.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
  .level-btn.completed { border-color: var(--grass); }
  .level-icon { font-size: 2.2rem; }
  .level-name { font-weight: 800; font-size: 0.85rem; margin-top: 6px; color: var(--dark); }
  .level-stars { color: var(--sun); font-size: 0.9rem; margin-top: 4px; }
  .lock-badge {
    position: absolute; top: 8px; right: 8px; font-size: 1rem;
  }

  /* ---- QUIZ SCREEN ---- */
  #quiz-screen { }
  .quiz-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; flex-wrap: wrap; gap: 8px;
  }
  .quiz-level-name { font-size: 1.3rem; color: var(--dark); }
  .quiz-progress { font-size: 0.9rem; color: #666; }
  .quiz-score-badge {
    background: var(--dark); color: white; padding: 5px 14px; border-radius: 20px;
    font-weight: 800;
  }

  .question-card {
    background: white;
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, var(--sky), var(--purple), var(--coral));
  }

  .question-text {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--dark);
    margin-bottom: 20px;
    line-height: 1.4;
  }
  .equation-display {
    font-family: 'Fredoka One', cursive;
    font-size: 2.8rem;
    text-align: center;
    color: var(--dark);
    margin: 16px 0;
    letter-spacing: 3px;
  }
  .eq-part { display: inline-block; }
  .eq-blank {
    display: inline-block;
    min-width: 60px;
    border-bottom: 4px solid var(--coral);
    text-align: center;
    color: var(--coral);
  }

  .answer-input {
    width: 100%;
    padding: 16px;
    font-size: 2rem;
    font-family: 'Fredoka One', cursive;
    border: 3px solid #ddd;
    border-radius: 16px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    color: var(--dark);
  }
  .answer-input:focus { border-color: var(--sky); }
  .answer-input.correct { border-color: var(--grass); background: #f0fff4; }
  .answer-input.wrong { border-color: var(--coral); background: #fff5f5; }

  .multi-choice {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 16px;
  }
  .choice-btn {
    padding: 18px;
    font-size: 1.6rem;
    font-family: 'Fredoka One', cursive;
    border: 3px solid #ddd;
    border-radius: 16px;
    background: white;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--dark);
  }
  .choice-btn:hover { border-color: var(--sky); background: #e8f4fd; transform: scale(1.03); }
  .choice-btn.correct { border-color: var(--grass); background: #f0fff4; }
  .choice-btn.wrong { border-color: var(--coral); background: #fff5f5; }

  .hint-box {
    background: #fff9c4;
    border: 2px dashed var(--sun);
    border-radius: 14px;
    padding: 14px;
    margin-top: 14px;
    font-size: 1rem;
    font-weight: 700;
    color: #7a5c00;
    display: none;
  }
  .hint-box.show { display: block; }

  .feedback-box {
    border-radius: 14px;
    padding: 14px 18px;
    margin-top: 14px;
    font-size: 1rem;
    font-weight: 700;
    display: none;
  }
  .feedback-box.show { display: block; }
  .feedback-box.correct-fb { background: #d4edda; color: #155724; border: 2px solid var(--grass); }
  .feedback-box.wrong-fb { background: #f8d7da; color: #721c24; border: 2px solid var(--coral); }

  .finger-counter {
    display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0;
    justify-content: center;
  }
  .finger {
    width: 36px; height: 36px; border-radius: 50%; background: #ffd3b6;
    border: 2px solid #e88;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .finger.raised { background: var(--coral); border-color: #c0392b; }

  .action-row {
    display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap;
  }
  .btn-primary {
    flex: 1; padding: 14px; font-size: 1.1rem; font-family: 'Fredoka One', cursive;
    background: var(--dark); color: white; border: none; border-radius: 16px;
    cursor: pointer; transition: transform 0.1s, background 0.1s;
    min-width: 120px;
  }
  .btn-primary:hover { background: #3d4a8a; transform: scale(1.02); }
  .btn-hint {
    padding: 14px 20px; font-size: 1rem; font-family: 'Fredoka One', cursive;
    background: var(--sun); color: var(--dark); border: none; border-radius: 16px;
    cursor: pointer; transition: transform 0.1s;
  }
  .btn-hint:hover { transform: scale(1.02); }
  .btn-hint:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-back {
    padding: 14px 20px; font-size: 1rem; font-family: 'Fredoka One', cursive;
    background: #eee; color: var(--dark); border: none; border-radius: 16px;
    cursor: pointer;
  }

  /* ---- RESULT SCREEN ---- */
  #result-screen { text-align: center; }
  .result-emoji { font-size: 5rem; margin: 20px 0; }
  .result-title { font-size: 2.5rem; color: var(--dark); margin-bottom: 10px; }
  .result-score { font-size: 1.4rem; color: #555; margin-bottom: 20px; }
  .result-stars { font-size: 3rem; margin: 10px 0; }
  .result-msg { font-size: 1.1rem; background: white; border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin: 16px 0; }
  .mistakes-list { text-align: left; margin: 16px 0; }
  .mistake-item {
    background: #fff5f5; border: 2px solid #ffcdd2; border-radius: 12px;
    padding: 12px; margin-bottom: 10px; font-size: 0.95rem;
  }
  .mistake-item .mi-q { font-weight: 800; color: var(--coral); }
  .mistake-item .mi-exp { color: #555; margin-top: 4px; }

  /* ---- WORD PROBLEM ---- */
  .word-problem-card {
    background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
    border-radius: 24px;
    padding: 24px;
    box-shadow: var(--shadow);
    border: 3px solid var(--purple);
  }
  .wp-badge {
    display: inline-block; background: var(--purple); color: white;
    border-radius: 20px; padding: 4px 14px; font-size: 0.85rem;
    font-weight: 800; margin-bottom: 10px;
  }

  /* Grouping tens */
  .tens-visual {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; justify-content: center;
  }
  .ten-group {
    display: flex; gap: 3px; background: #e3f2fd; border: 2px solid var(--sky);
    border-radius: 10px; padding: 6px;
  }
  .unit-block {
    width: 22px; height: 22px; background: var(--sky);
    border-radius: 4px;
  }
  .ones-group {
    display: flex; gap: 3px; background: #fff9c4; border: 2px solid var(--sun);
    border-radius: 10px; padding: 6px;
  }
  .unit-block.one { background: var(--sun); }

  /* Carry-over visual */
  .addition-column {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    line-height: 1.6;
    text-align: right;
    display: inline-block;
    background: white;
    padding: 16px 24px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    min-width: 160px;
    margin: 10px auto;
  }
  .carry-digit { color: var(--coral); font-size: 1rem; text-align: right; }
  .division-line { border-top: 3px solid var(--dark); margin: 6px 0; }

  /* Counting dots */
  .counting-line {
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    justify-content: center; margin: 10px 0;
  }
  .count-num {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--sky); color: white;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka One', cursive; font-size: 1.2rem;
    cursor: pointer; transition: background 0.15s;
  }
  .count-num.active { background: var(--coral); }
  .count-num.start { background: var(--grass); }

  /* Animations */
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes pop { 0%{transform:scale(0.5);opacity:0} 100%{transform:scale(1);opacity:1} }
  .pop { animation: pop 0.3s ease; }
  .bounce { animation: bounce 0.5s ease infinite; }

  .star-anim { display: inline-block; animation: pop 0.4s ease; }

  /* Progress bar */
  .prog-bar-wrap { background: #ddd; border-radius: 10px; height: 10px; margin: 8px 0; }
  .prog-bar-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--sky), var(--purple)); transition: width 0.4s; }

  @media (max-width: 480px) {
    .equation-display { font-size: 2rem; }
    .home-title { font-size: 2rem; }
    .levels-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <h1>⭐ Math Adventure</h1>
  <div class="topbar-btns">
    <button class="btn-save" onclick="saveProgress()">💾 Save Progress</button>
    <button class="btn-load" onclick="loadProgress()">📂 Load Progress</button>
  </div>
  <span id="progress-label">No save found</span>
</div>

<!-- HOME SCREEN -->
<div id="home-screen" class="screen active">
  <div style="text-align:center; padding-top:20px;">
    <div class="home-title">🌟 Math Adventure!</div>
    <div class="home-sub">Pick a level and let's learn! 🎉</div>
  </div>
  <div class="levels-grid" id="levels-grid"></div>
</div>

<!-- QUIZ SCREEN -->
<div id="quiz-screen" class="screen">
  <div class="quiz-header">
    <div>
      <div class="quiz-level-name" id="quiz-level-name"></div>
      <div class="quiz-progress" id="quiz-progress-text"></div>
    </div>
    <div class="quiz-score-badge" id="quiz-score-badge">Score: 0</div>
  </div>
  <div class="prog-bar-wrap"><div class="prog-bar-fill" id="quiz-prog-bar" style="width:0%"></div></div>
  <div id="question-area"></div>
  <div class="action-row" id="action-row"></div>
</div>

<!-- RESULT SCREEN -->
<div id="result-screen" class="screen">
  <div class="result-emoji" id="result-emoji"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-score" id="result-score"></div>
  <div class="result-stars" id="result-stars"></div>
  <div class="result-msg" id="result-msg"></div>
  <div id="mistakes-section"></div>
  <div class="action-row" style="margin-top:20px; justify-content:center;">
    <button class="btn-primary" id="result-retry-btn" style="max-width:200px;">🔁 Try Again</button>
    <button class="btn-primary" id="result-home-btn" style="max-width:200px; background:var(--grass);">🏠 Home</button>
    <button class="btn-primary" id="result-next-btn" style="max-width:200px; background:var(--purple); display:none;">➡️ Next Level</button>
  </div>
</div>

<script>
// ============================================================
// DATA & STATE
// ============================================================

const LEVELS = [
  {
    id: 'counting',
    name: 'Counting Up/Down',
    icon: '🔢',
    color: '#6EC6F5',
    description: 'Count up to add, count down to subtract',
    makeProblems: makeCountingProblems,
    wordProblems: countingWordProblems,
  },
  {
    id: 'grouping',
    name: 'Tens & Ones Groups',
    icon: '📦',
    color: '#FFD93D',
    description: 'Groups of tens and ones (e.g. 28 = 2 tens, 8 ones)',
    makeProblems: makeGroupingProblems,
    wordProblems: groupingWordProblems,
  },
  {
    id: 'missing_add',
    name: 'Missing Number',
    icon: '❓',
    color: '#C77DFF',
    description: 'Find the missing number in addition (e.g. 12 = 4 + 5 + ?)',
    makeProblems: makeMissingAddProblems,
    wordProblems: missingAddWordProblems,
  },
  {
    id: 'simple_sub',
    name: 'Quick Subtraction',
    icon: '✂️',
    color: '#FF6B6B',
    description: 'Subtract one number (e.g. 12 - 3)',
    makeProblems: makeSimpleSubProblems,
    wordProblems: simpleSubWordProblems,
  },
  {
    id: 'find_pair',
    name: 'Find the Pair',
    icon: '👫',
    color: '#6BCB77',
    description: 'Find 2 numbers that make a target (e.g. 15 = 7 + ?)',
    makeProblems: makeFindPairProblems,
    wordProblems: findPairWordProblems,
  },
  {
    id: 'take_two',
    name: 'Take Away Two',
    icon: '✌️',
    color: '#FF9F43',
    description: 'Subtract two numbers (e.g. 15 - 2 - 3)',
    makeProblems: makeTakeTwoProblems,
    wordProblems: takeTwoWordProblems,
  },
  {
    id: 'carry_add',
    name: 'Addition with Carry',
    icon: '➕',
    color: '#48dbfb',
    description: 'Add with carrying (sums up to 100)',
    makeProblems: makeCarryAddProblems,
    wordProblems: carryAddWordProblems,
  },
  {
    id: 'borrow_sub',
    name: 'Subtraction with Borrow',
    icon: '➖',
    color: '#ff6b81',
    description: 'Subtract with borrowing (up to 100)',
    makeProblems: makeBorrowSubProblems,
    wordProblems: borrowSubWordProblems,
  },
  {
    id: 'add_three',
    name: 'Add Three Numbers',
    icon: '🔺',
    color: '#A29BFE',
    description: 'Add three numbers (e.g. 19 + 21 + 30)',
    makeProblems: makeAddThreeProblems,
    wordProblems: addThreeWordProblems,
  },
  {
    id: 'sub_two_big',
    name: 'Subtract Two (Big)',
    icon: '🔻',
    color: '#fd79a8',
    description: 'Subtract two numbers from a big one (e.g. 50 - 25 - 15)',
    makeProblems: makeSubTwoBigProblems,
    wordProblems: subTwoBigWordProblems,
  },
  {
    id: 'combo',
    name: 'Grand Finale! 🏆',
    icon: '🏆',
    color: '#F9CA24',
    description: 'Mix of everything! Show what you know!',
    makeProblems: makeComboProblems,
    wordProblems: comboWordProblems,
  },
];

let state = {
  completed: {},   // levelId -> best score (0-100)
  currentLevel: null,
  questions: [],
  qIndex: 0,
  score: 0,
  wrong: 0,
  mistakes: [],
  hintsUsed: 0,
  answered: false,
};

// ============================================================
// SAVE / LOAD - FIXED
// ============================================================
function saveProgress() {
  const data = JSON.stringify({ 
    completed: state.completed, 
    ts: Date.now(),
    version: '1.0' 
  });
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'math-adventure-save.json'; a.click();
  document.getElementById('progress-label').textContent = '✅ Saved!';
  setTimeout(updateProgressLabel, 2000);
}

function loadProgress() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        // Check if it's a valid save file
        if (data && data.completed) {
          // Reset the state with loaded data
          state.completed = data.completed || {};
          
          // Make sure we don't have any undefined values
          LEVELS.forEach(lv => {
            if (state.completed[lv.id] === undefined) {
              state.completed[lv.id] = 0;
            }
          });
          
          // Reset current level to null
          state.currentLevel = null;
          
          // Update UI
          updateProgressLabel();
          renderHome();
          showScreen('home-screen');
          document.getElementById('progress-label').textContent = '✅ Loaded!';
          setTimeout(updateProgressLabel, 2000);
        } else {
          alert('Invalid save file format.');
        }
      } catch (error) {
        alert('Could not load save file. Make sure it\'s a valid save file.');
        console.error('Load error:', error);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function updateProgressLabel() {
  const done = Object.keys(state.completed).filter(id => (state.completed[id] || 0) >= 98).length;
  document.getElementById('progress-label').textContent =
    done > 0 ? `${done}/${LEVELS.length} levels mastered` : 'No saves yet';
}

// ============================================================
// SCREEN MANAGEMENT
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ============================================================
// HOME SCREEN - FIXED: Properly check unlocked levels based on loaded progress
// ============================================================
function renderHome() {
  const grid = document.getElementById('levels-grid');
  grid.innerHTML = '';
  
  // Make sure all levels have a score (default 0)
  LEVELS.forEach(lv => {
    if (state.completed[lv.id] === undefined) {
      state.completed[lv.id] = 0;
    }
  });
  
  LEVELS.forEach((lv, i) => {
    const score = state.completed[lv.id] || 0;
    const done = score >= 98; // Level is mastered if score >= 98
    
    // Check if this level should be unlocked
    // Level 1 is always unlocked
    // Other levels are unlocked if the previous level is mastered (score >= 98)
    let unlocked = false;
    if (i === 0) {
      unlocked = true; // First level always unlocked
    } else {
      const prevScore = state.completed[LEVELS[i-1].id] || 0;
      unlocked = prevScore >= 98;
    }
    
    const stars = score >= 98 ? '⭐⭐⭐' : score >= 80 ? '⭐⭐' : score >= 50 ? '⭐' : '';
    
    const btn = document.createElement('div');
    btn.className = 'level-btn' + (unlocked ? '' : ' locked') + (done ? ' completed' : '');
    btn.style.borderColor = done ? lv.color : 'transparent';
    btn.innerHTML = `
      <div class="level-icon">${lv.icon}</div>
      <div class="level-name">${lv.name}</div>
      <div class="level-stars">${stars}</div>
      ${!unlocked ? '<div class="lock-badge">🔒</div>' : ''}
    `;
    if (unlocked) btn.onclick = () => startLevel(lv);
    grid.appendChild(btn);
  });
}

// ============================================================
// PROBLEM GENERATORS WITH DIFFICULTY PROGRESSION
// ============================================================
function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function makeCountingProblems() {
  const qs = [];
  
  // EASY: First 7 questions - smaller numbers
  for (let i = 0; i < 7; i++) {
    if (Math.random() > 0.5) {
      // Addition - small numbers
      const big = rnd(3, 8);
      const small = rnd(1, 4);
      qs.push({
        type: 'counting_add',
        q: `${big} + ${small} = ?`,
        equation: `${big} + ${small} = ?`,
        answer: big + small,
        hint: `Start at ${big+1} and count up ${small} fingers! 🖐️`,
        countStart: big, countUp: small, countDir: 'up',
        explanation: `Count up from ${big+1}: ` + Array.from({length:small},(_,k)=>big+1+k).join(', ') + ` → ${big+small}`,
      });
    } else {
      // Subtraction - small numbers
      const big = rnd(4, 10);
      const small = rnd(1, 4);
      qs.push({
        type: 'counting_sub',

      answer: a - b,
      hint: `Borrow a ten! Ones: ${a%10+10} - ${b%10} = ${a%10+10-b%10}. Tens: ${Math.floor(a/10)-1} - ${Math.floor(b/10)} = ${Math.floor(a/10)-1-Math.floor(b/10)}`,
      explanation: `Borrow 1 ten: ones = ${a%10+10}-${b%10}=${a%10+10-b%10}, tens = ${Math.floor(a/10)-1}-${Math.floor(b/10)}=${Math.floor(a/10)-1-Math.floor(b/10)}. Answer: ${a-b}`,
      a, b,
    });
  }
  
  // HARD: Last 6 - larger numbers
  for (let i = 0; i < 6; i++) {
    let a, b;
    do {
      a = rnd(70, 99);
      b = rnd(40, 70);
    } while ((a % 10) >= (b % 10));
    qs.push({
      type: 'borrow_sub',
      q: `${a} - ${b} = ?`,
      equation: `${a} - ${b} = ?`,
      answer: a - b,
      hint: `Borrow a ten! Ones: ${a%10+10} - ${b%10} = ${a%10+10-b%10}. Tens: ${Math.floor(a/10)-1} - ${Math.floor(b/10)} = ${Math.floor(a/10)-1-Math.floor(b/10)}`,
      explanation: `Borrow 1 ten: ones = ${a%10+10}-${b%10}=${a%10+10-b%10}, tens = ${Math.floor(a/10)-1}-${Math.floor(b/10)}=${Math.floor(a/10)-1-Math.floor(b/10)}. Answer: ${a-b}`,
      a, b,
    });
  }
  
  return qs;
}

function makeAddThreeProblems() {
  const qs = [];
  
  // EASY: First 7
  for (let i = 0; i < 7; i++) {
    const a = rnd(5, 15);
    const b = rnd(5, 15);
    const c = rnd(5, 15);
    if (a + b + c <= 50) {
      qs.push({
        type: 'add_three',
        q: `${a} + ${b} + ${c} = ?`,
        equation: `${a} + ${b} + ${c} = ?`,
        answer: a + b + c,
        hint: `First: ${a} + ${b} = ${a+b}. Then: ${a+b} + ${c} = ?`,
        explanation: `${a}+${b}=${a+b}, then ${a+b}+${c}=${a+b+c}`,
      });
    } else { i--; }
  }
  
  // MEDIUM: Next 7
  for (let i = 0; i < 7; i++) {
    const a = rnd(12, 25);
    const b = rnd(12, 25);
    const c = rnd(10, 20);
    if (a + b + c <= 75) {
      qs.push({
        type: 'add_three',
        q: `${a} + ${b} + ${c} = ?`,
        equation: `${a} + ${b} + ${c} = ?`,
        answer: a + b + c,
        hint: `First: ${a} + ${b} = ${a+b}. Then: ${a+b} + ${c} = ?`,
        explanation: `${a}+${b}=${a+b}, then ${a+b}+${c}=${a+b+c}`,
      });
    } else { i--; }
  }
  
  // HARD: Last 6
  for (let i = 0; i < 6; i++) {
    const a = rnd(20, 35);
    const b = rnd(20, 35);
    const c = rnd(15, 30);
    if (a + b + c <= 100) {
      qs.push({
        type: 'add_three',
        q: `${a} + ${b} + ${c} = ?`,
        equation: `${a} + ${b} + ${c} = ?`,
        answer: a + b + c,
        hint: `First: ${a} + ${b} = ${a+b}. Then: ${a+b} + ${c} = ?`,
        explanation: `${a}+${b}=${a+b}, then ${a+b}+${c}=${a+b+c}`,
      });
    } else { i--; }
  }
  
  return qs;
}

function makeSubTwoBigProblems() {
  const qs = [];
  
  // EASY: First 7
  for (let i = 0; i < 7; i++) {
    const a = rnd(20, 40);
    const b = rnd(5, 10);
    const c = rnd(5, 10);
    if (a - b - c > 5) {
      qs.push({
        type: 'sub_two_big',
        q: `${a} - ${b} - ${c} = ?`,
        equation: `${a} - ${b} - ${c} = ?`,
        answer: a - b - c,
        hint: `First: ${a} - ${b} = ${a-b}. Then: ${a-b} - ${c} = ?`,
        explanation: `${a}-${b}=${a-b}, then ${a-b}-${c}=${a-b-c}`,
      });
    } else { i--; }
  }
  
  // MEDIUM: Next 7
  for (let i = 0; i < 7; i++) {
    const a = rnd(40, 70);
    const b = rnd(10, 20);
    const c = rnd(10, 20);
    if (a - b - c > 5) {
      qs.push({
        type: 'sub_two_big',
        q: `${a} - ${b} - ${c} = ?`,
        equation: `${a} - ${b} - ${c} = ?`,
        answer: a - b - c,
        hint: `First: ${a} - ${b} = ${a-b}. Then: ${a-b} - ${c} = ?`,
        explanation: `${a}-${b}=${a-b}, then ${a-b}-${c}=${a-b-c}`,
      });
    } else { i--; }
  }
  
  // HARD: Last 6
  for (let i = 0; i < 6; i++) {
    const a = rnd(70, 99);
    const b = rnd(15, 30);
    const c = rnd(15, 30);
    if (a - b - c > 5) {
      qs.push({
        type: 'sub_two_big',
        q: `${a} - ${b} - ${c} = ?`,
        equation: `${a} - ${b} - ${c} = ?`,
        answer: a - b - c,
        hint: `First: ${a} - ${b} = ${a-b}. Then: ${a-b} - ${c} = ?`,
        explanation: `${a}-${b}=${a-b}, then ${a-b}-${c}=${a-b-c}`,
      });
    } else { i--; }
  }
  
  return qs;
}

    { type:'word', q:'A school collected 80 cans of food 🥫. They donated 35 on Monday and 20 on Wednesday. How many are left?', answer:25, explanation:'80 - 35 - 20 = 25' },

function makeComboProblems() {
  const all = [
    ...makeCountingProblems(),
    ...makeMissingAddProblems(),
    ...makeSimpleSubProblems(),
    ...makeFindPairProblems(),
    ...makeTakeTwoProblems(),
    ...makeCarryAddProblems(),
    ...makeBorrowSubProblems(),
    ...makeAddThreeProblems(),
    ...makeSubTwoBigProblems(),
    ...makeGroupingProblems(),
  ];
  return shuffle(all).slice(0, 20);
}

function comboWordProblems() {
  const all = [
    ...countingWordProblems(),
    ...missingAddWordProblems(),
    ...simpleSubWordProblems(),
    ...findPairWordProblems(),
    ...takeTwoWordProblems(),
    ...carryAddWordProblems(),
    ...borrowSubWordProblems(),
    ...addThreeWordProblems(),
    ...subTwoBigWordProblems(),
    ...groupingWordProblems(),
  ];
  return shuffle(all).slice(0, 5);
}

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ============================================================
// QUIZ LOGIC
// ============================================================
function startLevel(lv) {
  state.currentLevel = lv;
  
  // Generate new problems every time - now with difficulty progression!
  const mainQs = lv.makeProblems();
  const wordQs = lv.wordProblems();
  
  // Combine: 20 main + 5 word problems at the end
  state.questions = [...mainQs, ...wordQs];
  
  state.qIndex = 0;
  state.score = 0;
  state.wrong = 0;
  state.mistakes = [];
  state.hintsUsed = 0;
  state.answered = false;
  document.getElementById('quiz-level-name').textContent = lv.icon + ' ' + lv.name;
  showScreen('quiz-screen');
  renderQuestion();
}

function renderQuestion() {
  const q = state.questions[state.qIndex];
  const total = state.questions.length;
  document.getElementById('quiz-progress-text').textContent =
    `Question ${state.qIndex+1} of ${total}`;
  document.getElementById('quiz-score-badge').textContent =
    `✅ ${state.score} | ❌ ${state.wrong}`;
  const pct = (state.qIndex / total) * 100;
  document.getElementById('quiz-prog-bar').style.width = pct + '%';

  const isWord = q.type === 'word';
  const isGrouping = q.type && q.type.startsWith('grouping');
  const isCarry = q.type === 'carry_add';
  const isBorrow = q.type === 'borrow_sub';
  const isCounting = q.type && q.type.startsWith('counting');

  // Hint eligibility: only for first 6 questions, and only 2 hints total
  const hintAllowed = state.qIndex < 6 && state.hintsUsed < 2 && !isWord;

  let html = '';

  if (isWord) {
    html += `<div class="word-problem-card">
      <div class="wp-badge">📖 Word Problem</div>
      <div class="question-text">${q.q}</div>
    </div>`;
  } else {
    html += `<div class="question-card">
      <div class="question-text">${q.q}</div>
      <div class="equation-display">${formatEquation(q)}</div>`;

    if (isGrouping) {
      html += renderGroupingVisual(q);
    }
    if (isCounting) {
      html += renderCountingHelper(q);
    }
    if (isCarry) {
      html += renderCarryHelper(q);
    }
    if (isBorrow) {
      html += renderBorrowHelper(q);
    }
    html += `</div>`;
  }

  html += `<div class="hint-box" id="hint-box">${q.hint || ''}</div>`;
  html += `<div class="feedback-box" id="feedback-box"></div>`;
  html += `<div style="margin-top:14px;"><input class="answer-input" id="answer-input" type="number" inputmode="numeric" placeholder="Your answer..." autocomplete="off"></div>`;

  document.getElementById('question-area').innerHTML = html;

  const inp = document.getElementById('answer-input');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !state.answered) checkAnswer(); });

  // Action row
  const ar = document.getElementById('action-row');
  ar.innerHTML = '';

  const backBtn = document.createElement('button');
  backBtn.className = 'btn-back';
  backBtn.textContent = '🏠 Home';
  backBtn.onclick = () => showScreen('home-screen');
  ar.appendChild(backBtn);

  if (hintAllowed) {
    const hintBtn = document.createElement('button');
    hintBtn.className = 'btn-hint';
    hintBtn.id = 'hint-btn';
    hintBtn.textContent = '💡 Hint';
    hintBtn.onclick = showHint;
    ar.appendChild(hintBtn);
  }

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn-primary';
  checkBtn.textContent = '✅ Check!';
  checkBtn.onclick = checkAnswer;
  ar.appendChild(checkBtn);

  state.answered = false;
}

function formatEquation(q) {
  const eq = q.equation || q.q;
  return eq.replace('?', '<span class="eq-blank">?</span>');
}

function renderGroupingVisual(q) {
  if (!q.tens) return '';
  let html = '<div class="tens-visual">';
  for (let i = 0; i < q.tens; i++) {
    html += '<div class="ten-group">';
    for (let j = 0; j < 10; j++) html += '<div class="unit-block"></div>';
    html += '</div>';
  }
  if (q.ones > 0) {
    html += '<div class="ones-group">';
    for (let j = 0; j < q.ones; j++) html += '<div class="unit-block one"></div>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderCountingHelper(q) {
  if (q.countDir === 'up') {
    // Show number line from big to big+small
    const start = q.countStart;
    const steps = q.countUp;
    let html = '<div style="text-align:center; margin-top:12px;"><div style="font-size:0.9rem; color:#666; margin-bottom:6px;">Count up from ' + (start+1) + ':</div>';
    html += '<div class="counting-line">';
    html += `<div class="count-num start">${start}</div>`;
    for (let i = 1; i <= steps; i++) {
      html += `<div class="count-num" id="cnum-${i}">${start+i}</div>`;
    }
    html += '</div>';
    html += '<div id="finger-count" style="font-size:0.9rem; color:#666; margin-top:6px;">Tap numbers as you count!</div>';
    html += '</div>';
    // Add tap logic via script
    html += `<script>
      (function(){
        let tapped = 0;
        for(let i=1;i<=${steps};i++){
          document.getElementById('cnum-'+i).onclick = function(){
            if(tapped < i){ tapped=i; this.classList.add('active'); }
          }
        }
      })();
    <\/script>`;
    return html;
  } else {
    const start = q.countStart;
    const end = q.countEnd;
    const diff = end - start;
    let html = '<div style="text-align:center; margin-top:12px;"><div style="font-size:0.9rem; color:#666; margin-bottom:6px;">Count from ' + (start+1) + ' to ' + end + ':</div>';
    html += '<div class="counting-line">';
    for (let i = start+1; i <= end; i++) {
      html += `<div class="count-num" id="cnum-${i-start}">${i}</div>`;
    }
    html += '</div>';
    html += '<div style="margin-top:6px; font-size:0.9rem; color:#666;">Fingers raised = answer 🖐️</div></div>';
    html += `<script>
      (function(){
        let tapped = 0;
        for(let i=1;i<=${diff};i++){
          document.getElementById('cnum-'+i).onclick = function(){
            if(tapped < i){ tapped=i; this.classList.add('active'); }
          }
        }
      })();
    <\/script>`;
    return html;
  }
}

function renderCarryHelper(q) {
  if (!q.a) return '';
  const onesSum = (q.a%10) + (q.b%10);
  const carry = Math.floor(onesSum/10);
  return `<div style="text-align:center;">
    <div class="addition-column">
      <div class="carry-digit" style="text-align:right;">${carry > 0 ? '¹' : '&nbsp;'}</div>
      <div>${q.a}</div>
      <div>+ ${q.b}</div>
      <div class="division-line"></div>
    </div>
  </div>`;
}

function renderBorrowHelper(q) {
  if (!q.a) return '';
  return `<div style="text-align:center;">
    <div class="addition-column">
      <div>${q.a}</div>
      <div>− ${q.b}</div>
      <div class="division-line"></div>
    </div>
    <div style="font-size:0.85rem; color:#666; margin-top:6px;">Do you need to borrow a ten? 🤔</div>
  </div>`;
}

function showHint() {
  state.hintsUsed++;
  document.getElementById('hint-box').classList.add('show');
  const btn = document.getElementById('hint-btn');
  if (btn) btn.disabled = true;
}

function checkAnswer() {
  if (state.answered) return;
  const q = state.questions[state.qIndex];
  const inp = document.getElementById('answer-input');
  const val = parseInt(inp.value);
  if (isNaN(val)) { inp.focus(); return; }

  state.answered = true;
  const correct = val === q.answer;
  const fb = document.getElementById('feedback-box');
  fb.classList.add('show');

  if (correct) {
    inp.classList.add('correct');
    fb.classList.add('correct-fb');
    fb.innerHTML = '🎉 Correct! ' + (q.explanation ? `<br><small>${q.explanation}</small>` : '');
    state.score++;
  } else {
    inp.classList.add('wrong');
    fb.classList.add('wrong-fb');
    fb.innerHTML = `❌ Not quite! You wrote <b>${val}</b> but the answer is <b>${q.answer}</b>.<br>
      <small>${q.explanation || ''}</small>`;
    state.wrong++;
    state.mistakes.push({ q: q.q, yourAnswer: val, correct: q.answer, explanation: q.explanation });
  }

  // Replace action row with Next button
  const ar = document.getElementById('action-row');
  ar.innerHTML = '';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn-primary';
  nextBtn.textContent = state.qIndex + 1 < state.questions.length ? '▶️ Next Question' : '🏁 See Results!';
  nextBtn.onclick = nextQuestion;
  ar.appendChild(nextBtn);
}

function nextQuestion() {
  state.qIndex++;
  if (state.qIndex >= state.questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

// ============================================================
// RESULTS SCREEN
// ============================================================
function showResults() {
  const total = state.questions.length;
  const pct = Math.round((state.score / total) * 100);
  const passed = pct >= 98;

  // Save best score
  const prev = state.completed[state.currentLevel.id] || 0;
  if (pct > prev) state.completed[state.currentLevel.id] = pct;

  document.getElementById('result-emoji').textContent = passed ? '🏆' : (pct >= 80 ? '🌟' : '💪');
  document.getElementById('result-title').textContent = passed ? 'Amazing! You passed!' : (pct >= 80 ? 'Great job!' : 'Keep practicing!');
  document.getElementById('result-score').textContent = `You got ${state.score} out of ${total} correct (${pct}%)`;
  document.getElementById('result-stars').innerHTML = pct >= 98 ? '⭐⭐⭐' : pct >= 80 ? '⭐⭐' : '⭐';

  let msg = '';
  if (passed) {
    msg = '🎉 Fantastic! You got 98% or more — you\'ve mastered this level! You can move on to the next one! 🚀';
  } else {
    msg = `You need 98% to move on. You scored ${pct}%. Let's try again — you can do it! 💪 Review the mistakes below and try the level again.`;
  }
  document.getElementById('result-msg').textContent = msg;

  // Mistakes
  let mistakeHTML = '';
  if (state.mistakes.length > 0) {
    mistakeHTML = '<h3 style="font-family: Fredoka One, cursive; margin-bottom:10px; color:var(--coral)">📝 Let\'s look at your mistakes:</h3>';
    state.mistakes.forEach(m => {
      mistakeHTML += `<div class="mistake-item">
        <div class="mi-q">Question: ${m.q}</div>
        <div class="mi-exp">Your answer: ${m.yourAnswer} ❌ &nbsp;|&nbsp; Correct answer: ${m.correct} ✅</div>
        <div class="mi-exp" style="color:#888">${m.explanation || ''}</div>
      </div>`;
    });
  }
  document.getElementById('mistakes-section').innerHTML = mistakeHTML;

  // Buttons
  document.getElementById('result-retry-btn').onclick = () => startLevel(state.currentLevel);
  document.getElementById('result-home-btn').onclick = () => { renderHome(); showScreen('home-screen'); };

  // Next level button - check if next level exists
  const nextBtn = document.getElementById('result-next-btn');
  if (passed) {
    const idx = LEVELS.findIndex(l => l.id === state.currentLevel.id);
    if (idx < LEVELS.length - 1) {
      nextBtn.style.display = 'inline-block';
      nextBtn.onclick = () => startLevel(LEVELS[idx+1]);
    } else {
      nextBtn.style.display = 'none';
    }
  } else {
    nextBtn.style.display = 'none';
  }

  renderHome();
  showScreen('result-screen');
}

// ============================================================
// INIT
// ============================================================
// Initialize all level scores to 0 if not set
LEVELS.forEach(lv => {
  if (state.completed[lv.id] === undefined) {
    state.completed[lv.id] = 0;
  }
});
renderHome();
updateProgressLabel();
