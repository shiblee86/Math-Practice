<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌈 Math Adventure · simpler hints · 13 + 5</title>
  <style>
    /* same beautiful style – no changes to look & feel */
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
    :root {
      --sky: #6EC6F5; --sun: #FFD93D; --grass: #6BCB77; --coral: #FF6B6B;
      --purple: #C77DFF; --cream: #FFF8EE; --dark: #2D3561; --card: #ffffff;
      --shadow: 0 8px 32px rgba(45,53,97,0.13);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #e0f7fa 0%, #f3e5f5 50%, #fff9c4 100%);
      min-height: 100vh; color: var(--dark);
    }
    h1, h2, h3, .big-num { font-family: 'Fredoka One', cursive; letter-spacing: 1px; }
    #topbar {
      background: var(--dark); color: white; padding: 10px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 3px 12px rgba(0,0,0,0.2);
    }
    .btn-save, .btn-load {
      padding: 7px 18px; border-radius: 20px; border: none;
      font-weight: 800; font-size: 0.9rem; cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-save { background: var(--sun); color: var(--dark); }
    .btn-load { background: var(--grass); color: white; }
    .screen { display: none; padding: 24px 16px; max-width: 700px; margin: 0 auto; }
    .screen.active { display: block; }
    #home-screen { text-align: center; }
    .levels-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px; margin-top: 20px;
    }
    .level-btn {
      background: white; border: 3px solid transparent; border-radius: 20px;
      padding: 18px 10px; cursor: pointer; box-shadow: var(--shadow);
      transition: transform 0.15s;
    }
    .level-btn:hover { transform: translateY(-4px); border-color: var(--sky); }
    .question-card {
      background: white; border-radius: 24px; padding: 28px 24px;
      box-shadow: var(--shadow); margin-bottom: 20px;
    }
    .equation-display {
      font-family: 'Fredoka One', cursive; font-size: 2.8rem;
      text-align: center; color: var(--dark); margin: 16px 0;
    }
    .eq-blank { display: inline-block; min-width: 60px; border-bottom: 4px solid var(--coral); text-align: center; color: var(--coral); }
    
    /* ---------- SIMPLER HINT STYLES (big friendly boxes) ---------- */
    .mini-lesson {
      background: #FFF9E6;
      border-left: 10px solid var(--purple);
      border-radius: 24px;
      padding: 18px 16px;
      margin: 18px 0 12px 0;
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .mini-lesson .emojii { font-size: 1.8rem; margin-right: 8px; }
    .step-hint {
      background: #e6f4ff;
      border-radius: 40px;
      padding: 14px 20px;
      margin: 10px 0;
      font-size: 1.3rem;
      font-weight: 800;
      text-align: center;
      border: 3px solid var(--sky);
    }
    .finger-helper {
      background: #ffefc0;
      border-radius: 30px;
      padding: 15px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      border: 3px dashed var(--sun);
    }
    .tens-visual { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; justify-content: center; }
    .ten-group { display: flex; gap: 3px; background: #e3f2fd; border: 2px solid var(--sky); border-radius: 10px; padding: 6px; }
    .unit-block { width: 22px; height: 22px; background: var(--sky); border-radius: 4px; }
    .ones-group { display: flex; gap: 3px; background: #fff9c4; border: 2px solid var(--sun); border-radius: 10px; padding: 6px; }
    .unit-block.one { background: var(--sun); }
    .carry-helper, .borrow-helper {
      background: #f0e6ff; border: 3px solid var(--purple); border-radius: 28px;
      padding: 16px; font-size: 1.5rem; text-align: center; font-weight: 800;
    }
    .btn-primary, .btn-hint, .btn-back {
      padding: 14px 20px; font-family: 'Fredoka One', cursive;
      border: none; border-radius: 16px; cursor: pointer; transition: transform 0.1s;
    }
    .btn-primary { background: var(--dark); color: white; }
    .btn-hint { background: var(--sun); color: var(--dark); }
    .word-problem-card {
      background: linear-gradient(135deg, #f8e3ff, #ffe6b0);
      border-radius: 24px; padding: 24px; border: 3px solid var(--purple);
    }
    .answer-input {
      width: 100%; padding: 16px; font-size: 2rem; font-family: 'Fredoka One', cursive;
      border: 3px solid #ddd; border-radius: 16px; text-align: center;
    }
    .feedback-box { border-radius: 14px; padding: 14px; margin-top: 14px; font-weight: 700; display: none; }
    .feedback-box.show { display: block; }
    .correct-fb { background: #d4edda; color: #155724; border: 2px solid var(--grass); }
    .wrong-fb { background: #f8d7da; color: #721c24; border: 2px solid var(--coral); }
    .mistake-item { background: #fff5f5; border: 2px solid #ffcdd2; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  </style>
</head>
<body>
<div id="topbar">
  <h1>⭐ Math Adventure</h1>
  <div class="topbar-btns">
    <button class="btn-save" onclick="saveProgress()">💾 Save</button>
    <button class="btn-load" onclick="loadProgress()">📂 Load</button>
  </div>
  <span id="progress-label"></span>
</div>

<!-- HOME -->
<div id="home-screen" class="screen active">
  <div class="home-title">🌟 Math Adventure!</div>
  <div class="home-sub">Pick a level · now 13 fun problems + 5 word puzzles</div>
  <div class="levels-grid" id="levels-grid"></div>
</div>

<!-- QUIZ -->
<div id="quiz-screen" class="screen">
  <div class="quiz-header">
    <div><span class="quiz-level-name" id="quiz-level-name"></span></div>
    <div class="quiz-score-badge" id="quiz-score-badge">0 ✔️ / 0 ❌</div>
  </div>
  <div id="question-area"></div>
  <div class="action-row" id="action-row"></div>
</div>

<!-- RESULT -->
<div id="result-screen" class="screen">
  <div class="result-emoji" id="result-emoji"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-score" id="result-score"></div>
  <div class="result-stars" id="result-stars"></div>
  <div id="mistakes-section"></div>
  <div style="display:flex; gap:12px; justify-content:center; margin-top:20px;">
    <button class="btn-primary" id="result-retry-btn">🔁 Try again</button>
    <button class="btn-primary" id="result-home-btn" style="background:var(--grass);">🏠 Home</button>
    <button class="btn-primary" id="result-next-btn" style="background:var(--purple); display:none;">➡️ Next</button>
  </div>
</div>

<script>
// ==================  LEVELS  (13 problems + 5 word) ==================
const LEVELS = [
  { id:'counting', name:'Counting Up/Down', icon:'🔢', color:'#6EC6F5',
    makeProblems: makeCountingProblems, wordProblems: countingWordProblems },
  { id:'grouping', name:'Tens & Ones', icon:'📦', color:'#FFD93D',
    makeProblems: makeGroupingProblems, wordProblems: groupingWordProblems },
  { id:'missing_add', name:'Missing Number', icon:'❓', color:'#C77DFF',
    makeProblems: makeMissingAddProblems, wordProblems: missingAddWordProblems },
  { id:'simple_sub', name:'Quick Subtraction', icon:'✂️', color:'#FF6B6B',
    makeProblems: makeSimpleSubProblems, wordProblems: simpleSubWordProblems },
  { id:'find_pair', name:'Find the Pair', icon:'👫', color:'#6BCB77',
    makeProblems: makeFindPairProblems, wordProblems: findPairWordProblems },
  { id:'take_two', name:'Take Away Two', icon:'✌️', color:'#FF9F43',
    makeProblems: makeTakeTwoProblems, wordProblems: takeTwoWordProblems },
  { id:'carry_add', name:'Addition with Carry', icon:'➕', color:'#48dbfb',
    makeProblems: makeCarryAddProblems, wordProblems: carryAddWordProblems },
  { id:'borrow_sub', name:'Subtraction with Borrow', icon:'➖', color:'#ff6b81',
    makeProblems: makeBorrowSubProblems, wordProblems: borrowSubWordProblems },
  { id:'add_three', name:'Add Three Numbers', icon:'🔺', color:'#A29BFE',
    makeProblems: makeAddThreeProblems, wordProblems: addThreeWordProblems },
  { id:'sub_two_big', name:'Subtract Two (Big)', icon:'🔻', color:'#fd79a8',
    makeProblems: makeSubTwoBigProblems, wordProblems: subTwoBigWordProblems },
  { id:'combo', name:'Grand Finale! 🏆', icon:'🏆', color:'#F9CA24',
    makeProblems: makeComboProblems, wordProblems: comboWordProblems },
];

let state = { completed:{}, currentLevel:null, questions:[], qIndex:0, score:0, wrong:0, mistakes:[], hintsUsed:0, answered:false };

// ------------------  helpers  ------------------
function rnd(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }
function shuffle(a) { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ---------- each generator now returns 13 problems (instead of 20) ----------
function makeCountingProblems() { let q=[]; for(let i=0;i<13;i++){ if(i%2){ let b=rnd(3,12), s=rnd(1,6); q.push({type:'counting_add', q:`${b} + ${s} = ?`, answer:b+s, hint:'👉 Count UP using your fingers: put up '+s+' fingers after '+b, explanation:`${b}+${s}=${b+s}`}); } else { let b=rnd(5,18), s=rnd(2,7); q.push({type:'counting_sub', q:`${b} - ${s} = ?`, answer:b-s, hint:'👉 Count DOWN: start from '+b+' and take away '+s+' fingers', explanation:`${b}-${s}=${b-s}`}); } } return q; }
function countingWordProblems() { return shuffle([ {q:'Emma has 9 apples, gets 4 more. How many?',a:13}, {q:'14 birds, 6 fly away. Left?',a:8}, {q:'11 fish + 7 fish = ?',a:18}, {q:'15 stickers, give 9. Left?',a:6}, {q:'8 crayons, find 8 more?',a:16} ]).map(o=>({type:'word', q:o.q, answer:o.a, explanation:''})); }

function makeGroupingProblems() { let q=[]; for(let i=0;i<13;i++){ let t=rnd(2,7), o=rnd(0,9), n=t*10+o; if(i<7) q.push({type:'grouping_tens', q:`${n} has how many TENS?`, answer:t, hint:`TENS are the first digit → ${n} = ${t} tens + ${o} ones`, explanation:''}); else q.push({type:'grouping_ones', q:`${n} has how many ONES?`, answer:o, hint:`ONES are the last digit → ${n} = ${t} tens + ${o} ones`, explanation:''}); } return q; }
function groupingWordProblems() { return [ {q:'3 tens + 4 ones = ?',a:34}, {q:'5 packs of ten + 7 loose = ?',a:57}, {q:'How many tens in 47?',a:4}, {q:'How many ones in 62?',a:2}, {q:'2 tens + 9 ones = ?',a:29} ].map(o=>({type:'word', q:o.q, answer:o.a, explanation:''})); }

function makeMissingAddProblems() { let q=[]; for(let i=0;i<13;i++){ let tot=rnd(8,22), a=rnd(2,8), b=rnd(2,8), x=tot-a-b; if(x>0 && i%3) q.push({type:'missing_3', q:`${tot} = ${a} + ${b} + ?`, answer:x, hint:'Step❶ Add '+a+'+'+b+'='+(a+b)+'   Step❷ '+tot+' − '+(a+b)+' = ?'}); else { let aa=rnd(3,12), xx=tot-aa; q.push({type:'missing_2', q:`${tot} = ${aa} + ?`, answer:xx, hint:'Just subtract: '+tot+' − '+aa+' = ?'}); } } return q; }
function missingAddWordProblems() { return [ {q:'Need 12 flowers, have 4 red + 5 yellow. More?',a:3}, {q:'Bag needs 15 books, has 6. More?',a:9}, {q:'20 eggs, have 7+4. Need?',a:9}, {q:'18 puzzle pieces, placed 9+5. Missing?',a:4}, {q:'10 seats, 3 boys + 4 girls. Empty?',a:3} ].map(o=>({type:'word', q:o.q, answer:o.a, explanation:''})); }

function makeSimpleSubProblems() { let q=[]; for(let i=0;i<13;i++){ let a=rnd(7,20), b=rnd(2,9); q.push({type:'sub1', q:`${a} - ${b} = ?`, answer:a-b, hint:'Count up from '+(b+1)+' to '+a+' → that’s '+(a-b)+' steps'}); } return q; }
function simpleSubWordProblems() { return [ {q:'13 cookies, eat 4. Left?',a:9}, {q:'17 grapes, 8 eaten. Left?',a:9}, {q:'20 kids, 7 go home. Still?',a:13}, {q:'15 books, return 6. Left?',a:9}, {q:'18 butterflies, 9 fly away. Left?',a:9} ].map(o=>({type:'word', q:o.q, answer:o.a, explanation:''})); }

function makeFindPairProblems() { let q=[]; for(let i=0;i<13;i++){ let t=rnd(6,20), a=rnd(2,12), b=t-a; q.push({type:'find_pair', q:`${t} = ${a} + ?`, answer:b, hint:t+' − '+a+' = '+b}); } return q; }
function findPairWordProblems() { return [ {q:'Need 15 cookies, have 8. More?',a:7}, {q:'12 passengers, 5 seated. More?',a:7}, {q:'18 flowers, planted 9. More?',a:9}, {q:'20 beads, 13 on. Need?',a:7}, {q:'16 cups flour, have 7. Need?',a:9} ].map(o=>({type:'word', q:o.q, answer:o.a, explanation:''})); }

function makeTakeTwoProblems() { let q=[]; for(let i=0;i<13;i++){ let a=rnd(12,28), b=rnd(2,6), c=rnd(2,6); q.push({type:'take_two', q:`${a} - ${b} - ${c} = ?`, answer:a-b-c, hint:'First: '+a+'−'+b+'='+(a-b)+'  then −'+c+' = ?'}); } return q; }
function takeTwoWordProblems() { return [ {q:'20 marbles, take 4 then 3. Left?',a:13}, {q:'25 stickers, take 7 then 5. Left?',a:13}, {q:'18 books, borrow 5 then 4. Left?',a:9}, {q:'22 muffins, eat 3 then 6. Left?',a:13}, {q:'15 frogs, 4 hop, then 2 hop. Left?',a:9} ].map(o=>({type:'word', q:o.q, answer:o.a, explanation:''})); }

function makeCarryAddProblems() { let q=[]; for(let i=0;i<13;i++){ let a=rnd(15,48), b=rnd(17,46); if((a%10)+(b%10)>9 && a+b<99) q.push({type:'carry_add', q:`${a} + ${b} = ?`, answer:a+b, a,b, hint:'ones: '+a%10+'+'+b%10+'='+((a%10)+(b%10))+' → write '+(a+b)%10+', carry 1'}); else i--; } return q; }
function carryAddWordProblems() { return [ {q:'37 red + 45 blue balls?',a:82}, {q:'48 chickens + 36 ducks?',a:84}, {q:'29 kids + 43 kids?',a:72}, {q:'56 apples + 28 apples?',a:84}, {q:'67 new books + 25 old?',a:92} ].map(o=>({type:'word', q:o.q, answer:o.a, explanation:''})); }

function makeBorrowSubProblems() { let q=[]; for(let i=0;i<13;i++){ let a=rnd(32,81), b=rnd(14,49); if(a%10 < b%10 && a-b>9) q.push({type:'borrow_sub', q:`${a} - ${b} = ?`, answer:a-b, a,b, hint:'Borrow 1 ten: ones: '+(a%10+10)+'−'+b%10+'='+((a%10+10)-b%10)+' , tens: '+(Math.floor(a/10)-1)+'−'+Math.floor(b/10)}); else i--; } return q; }
function borrowSubWordProblems() { return [ {q:'52 crayons, use 27. Left?',a:25}, {q:'71 stickers, give 34. Left?',a:37}, {q:'84 kids, 46 go away. Stay?',a:38}, {q:'60 cookies, eat 38. Left?',a:22}, {q:'93 pages, read 55. Left?',a:38} ].map(o=>({type:'word', q:o.q, answer:o.a, explanation:''})); }

function makeAddThreeProblems() { let q=[]; for(let i=0;i<13;i++){ let a=rnd(5,25), b=rnd(5,25), c=rnd(5,25); if(a+b+c<90) q.push({type:'add_three', q:`${a} + ${b} + ${c} = ?`, answer:a+b+c, hint:'add first two: '+(a+b)+' then +'+c+' = ?'}); else i--; } return q; }
function addThreeWordProblems() { return [ {q:'19 + 21 + 30 toys?',a:70}, {q:'15+23+12 fruits?',a:50}, {q:'24+18+17 students?',a:59}, {q:'13+22+15 roses?',a:50}, {q:'31+28+11 animals?',a:70} ].map(o=>({type:'word', q:o.q, answer:o.a, explanation:''})); }

function makeSubTwoBigProblems() { let q=[]; for(let i=0;i<13;i++){ let a=rnd(40,90), b=rnd(10,25), c=rnd(10,25); if(a-b-c>5) q.push({type:'sub_big2', q:`${a} - ${b} - ${c} = ?`, answer:a-b-c, hint:'First: '+a+'−'+b+'='+(a-b)+' then −'+c+' = ?'}); else i--; } return q; }
function subTwoBigWordProblems() { return [ {q:'50 marbles, take 25 then 15?',a:10}, {q:'80 cans, donate 35 then 20?',a:25}, {q:'65 sunflowers, pick 20 then 18?',a:27}, {q:'90 dollars, spend 40 then 25?',a:25}, {q:'75 chocolates, eat 30 then 15?',a:30} ].map(o=>({type:'word', q:o.q, answer:o.a, explanation:''})); }

function makeComboProblems() { let all=[...makeCountingProblems(),...makeMissingAddProblems(),...makeSimpleSubProblems(),...makeFindPairProblems(),...makeTakeTwoProblems(),...makeCarryAddProblems(),...makeBorrowSubProblems(),...makeAddThreeProblems(),...makeSubTwoBigProblems(),...makeGroupingProblems()]; return shuffle(all).slice(0,13); }
function comboWordProblems() { let all=[...countingWordProblems(),...missingAddWordProblems(),...simpleSubWordProblems(),...findPairWordProblems(),...takeTwoWordProblems(),...carryAddWordProblems(),...borrowSubWordProblems(),...addThreeWordProblems(),...subTwoBigWordProblems(),...groupingWordProblems()]; return shuffle(all).slice(0,5); }

// ----------------  start level  ----------------
function startLevel(lv) {
  state.currentLevel = lv;
  let main = lv.makeProblems();      // now exactly 13
  let words = lv.wordProblems();      // exactly 5 word problems
  state.questions = [...main, ...words];  // 18 total (13+5)
  state.qIndex = 0; state.score = 0; state.wrong = 0; state.mistakes = []; state.hintsUsed = 0; state.answered = false;
  document.getElementById('quiz-level-name').innerHTML = lv.icon + ' ' + lv.name;
  showScreen('quiz-screen'); renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ----------------  render question with SUPER clear hints  ----------------
function renderQuestion() {
  let q = state.questions[state.qIndex];
  let total = state.questions.length;
  document.getElementById('quiz-score-badge').innerHTML = `✅ ${state.score}  ❌ ${state.wrong}`;
  let isWord = q.type === 'word';
  let hintAllowed = state.qIndex < 6 && state.hintsUsed < 2 && !isWord;

  let area = document.getElementById('question-area');
  let html = `<div class="question-card"><div class="question-text">${q.q}</div>`;

  // ----- SIMPLE EXPLANATION / MINI LESSON for each type -----
  if (q.type === 'counting_add' || q.type === 'counting_sub') {
    html += `<div class="finger-helper">✋ FINGER COUNTING: ${q.hint || 'count up or down'}</div>`;
  }
  else if (q.type && q.type.startsWith('grouping')) {
    html += `<div class="mini-lesson"><span class="emojii">📦</span> TENS are groups of 10 · ONES are leftovers. ${q.hint}</div>`;
    if (q.answer !== undefined) { /* visual later */ }
  }
  else if (q.type && (q.type.startsWith('missing') || q.type.startsWith('find'))) {
    html += `<div class="step-hint">✨ ${q.hint || 'Step 1: add what you know · Step 2: subtract from total'}</div>`;
  }
  else if (q.type === 'carry_add') {
    html += `<div class="carry-helper">🔢 ${q.hint}<br> <span style="font-size:1rem;">ones add → carry the ten!</span></div>`;
  }
  else if (q.type === 'borrow_sub') {
    html += `<div class="borrow-helper">🔁 ${q.hint}<br> <span style="font-size:1rem;">borrow from tens, then subtract ones</span></div>`;
  }
  else if (!isWord) {
    html += `<div class="mini-lesson">💡 ${q.hint || 'think step by step'}</div>`;
  }

  // grouping visual
  if (q.type && q.type.startsWith('grouping') && q.answer!==undefined) {
    let t = q.q.match(/\d+/)?.[0] || 0; if(!q.tens && !q.ones){} // skip
  }
  if (q.type==='carry_add' && q.a) {
    let ones = (q.a%10)+(q.b%10); let carry = Math.floor(ones/10);
    html += `<div style="font-size:1.8rem;text-align:center;background:#eee;border-radius:30px;margin-top:10px;"> ${q.a} + ${q.b} = ?<br> <span style="color:red;font-size:1rem;">carry: ${carry>0?'¹':''}</span></div>`;
  }

  if (isWord) {
    html = `<div class="word-problem-card"><span class="wp-badge">📖 word problem</span><div class="question-text">${q.q}</div></div>`;
  }

  html += `<input class="answer-input" id="answer-input" type="number" inputmode="numeric" placeholder="type answer" autocomplete="off">`;
  html += `<div class="hint-box" id="hint-box" style="display:none;">${q.hint || ''}</div>`;
  html += `<div class="feedback-box" id="feedback-box"></div>`;
  html += `</div>`;

  area.innerHTML = html;
  document.getElementById('answer-input').focus();

  // action row
  let ar = document.getElementById('action-row');
  ar.innerHTML = `<button class="btn-back" onclick="showScreen('home-screen')">🏠 Home</button>`;
  if (hintAllowed) {
    ar.innerHTML += `<button class="btn-hint" id="hint-btn" onclick="showHint()">💡 Hint</button>`;
  }
  ar.innerHTML += `<button class="btn-primary" onclick="checkAnswer()">✅ Check</button>`;

  state.answered = false;
}

function showHint() {
  state.hintsUsed++;
  document.getElementById('hint-box').style.display = 'block';
  let btn = document.getElementById('hint-btn'); if(btn) btn.disabled = true;
}

function checkAnswer() {
  if(state.answered) return;
  let q = state.questions[state.qIndex];
  let inp = document.getElementById('answer-input');
  let val = parseInt(inp.value);
  if(isNaN(val)) return;
  state.answered = true;
  let fb = document.getElementById('feedback-box'); fb.classList.add('show');
  let correct = (val === q.answer);
  if(correct) {
    inp.classList.add('correct'); fb.classList.add('correct-fb');
    fb.innerHTML = '✅🎉 Yes! ' + (q.explanation || 'good job!');
    state.score++;
  } else {
    inp.classList.add('wrong'); fb.classList.add('wrong-fb');
    fb.innerHTML = `❌ Your answer ${val} is not correct. The right answer is ${q.answer}. ${q.explanation?('<br>'+q.explanation):''}`;
    state.wrong++; state.mistakes.push({q:q.q, your:val, correct:q.answer});
  }
  let ar = document.getElementById('action-row');
  ar.innerHTML = `<button class="btn-primary" onclick="nextQuestion()">➡️ Next</button>`;
}

function nextQuestion() {
  state.qIndex++;
  if(state.qIndex >= state.questions.length) showResults();
  else renderQuestion();
}

function showResults() {
  let total = state.questions.length, pct = Math.round((state.score/total)*100);
  let prev = state.completed[state.currentLevel.id]||0;
  if(pct>prev) state.completed[state.currentLevel.id] = pct;

  document.getElementById('result-emoji').innerText = pct>=98?'🏆':pct>=70?'🌟':'💪';
  document.getElementById('result-title').innerText = pct>=98?'Amazing!':pct>=70?'Good job!':'Keep trying';
  document.getElementById('result-score').innerText = `${state.score}/${total} correct (${pct}%)`;
  document.getElementById('result-stars').innerHTML = pct>=98?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';

  let mh = '';
  if(state.mistakes.length){
    mh = '<h3>📋 Mistakes:</h3>';
    state.mistakes.forEach(m=>{ mh+=`<div class="mistake-item">❓ ${m.q} → your:${m.your} ✔️ correct:${m.correct}</div>`; });
  }
  document.getElementById('mistakes-section').innerHTML = mh;

  let idx = LEVELS.findIndex(l=>l.id===state.currentLevel.id);
  document.getElementById('result-next-btn').style.display = (pct>=98 && idx<LEVELS.length-1)?'inline-block':'none';
  document.getElementById('result-next-btn').onclick = ()=>startLevel(LEVELS[idx+1]);
  document.getElementById('result-retry-btn').onclick = ()=>startLevel(state.currentLevel);
  document.getElementById('result-home-btn').onclick = ()=>{ renderHome(); showScreen('home-screen'); };

  renderHome();
  showScreen('result-screen');
}

function renderHome() {
  let grid = document.getElementById('levels-grid'); grid.innerHTML = '';
  LEVELS.forEach(lv => {
    if(!state.completed[lv.id]) state.completed[lv.id]=0;
    let s = state.completed[lv.id];
    let stars = s>=98?'⭐⭐⭐': s>=70?'⭐⭐':'⭐';
    let btn = document.createElement('div'); btn.className='level-btn';
    btn.innerHTML = `<div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-stars">${stars}</div>`;
    btn.onclick = ()=>startLevel(lv);
    grid.appendChild(btn);
  });
}
function saveProgress(){ localStorage.setItem('math_save', JSON.stringify(state.completed)); alert('saved!'); }
function loadProgress(){ let d=localStorage.getItem('math_save'); if(d){ state.completed=JSON.parse(d); renderHome(); } else alert('no save'); }
window.onload = ()=>{ renderHome(); };
</script>
</body>
</html>
