<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Math Adventure - Simple Steps</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --bg-dark: #0a0718;
    --card-dark: #1a1530;
    --text-light: #f0ebff;
    --text-soft: #cdc2f0;
    --sky: #6EC6F5;
    --sun: #FFD93D;
    --grass: #6BCB77;
    --coral: #FF6B6B;
    --purple: #C77DFF;
    --border-glow: #433b6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg-dark);
    min-height: 100vh;
    color: var(--text-light);
    padding: 16px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  .topbar {
    background: #1f1a33;
    border-radius: 20px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    border: 1px solid #41386b;
    box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    position: sticky;
    top: 8px;
    z-index: 100;
    backdrop-filter: blur(5px);
  }
  
  .topbar-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--sun);
    text-shadow: 0 0 8px #b8860b;
  }
  
  .topbar-btns {
    display: flex;
    gap: 10px;
  }
  
  .tb-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 30px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform 0.1s;
  }
  
  .tb-btn:hover {
    transform: scale(1.05);
  }
  
  .tb-save {
    background: var(--sun);
    color: #1a0f2a;
  }
  
  .tb-load {
    background: var(--grass);
    color: #0f0a1a;
  }
  
  .tb-lbl {
    font-size: 0.75rem;
    color: #b1a5d9;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* Home screen */
  .home-hero {
    text-align: center;
    padding: 20px 0 10px;
  }
  
  .home-hero h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.4rem;
    background: linear-gradient(135deg, var(--sun), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px #9f7aea;
  }
  
  .home-hero p {
    color: var(--text-soft);
    font-size: 1rem;
    margin-top: 8px;
  }

  /* Level grid */
  .levels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    margin-top: 24px;
  }

  .level-btn {
    background: var(--card-dark);
    border: 2px solid #3d3460;
    border-radius: 24px;
    padding: 20px 10px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    transition: transform 0.15s, border-color 0.15s;
  }
  
  .level-btn:hover {
    transform: translateY(-5px);
    border-color: var(--purple);
  }
  
  .level-icon {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }
  
  .level-name {
    font-weight: 800;
    font-size: 1rem;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  
  .level-desc {
    font-size: 0.75rem;
    color: #b8aae6;
    margin: 5px 0;
    line-height: 1.3;
  }
  
  .level-stars {
    color: var(--sun);
    font-size: 0.9rem;
  }

  /* Progress chart */
  .progress-chart {
    background: #1e1932;
    border-radius: 20px;
    padding: 20px;
    margin-top: 30px;
    border: 1px solid #4f4377;
  }
  
  .progress-bar-cont {
    background: #2f274a;
    border-radius: 12px;
    height: 24px;
    margin: 12px 0 8px;
  }
  
  .progress-bar-fill {
    height: 100%;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--purple), var(--sky));
    width: 0%;
    transition: width 0.4s;
  }

  /* Quiz screen */
  .quiz-head {
    background: #1e1932;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid #5a4c82;
  }
  
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    color: #b7a9e6;
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  
  .quiz-score-row {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  
  .qs-item {
    text-align: center;
    flex: 1;
  }
  
  .qs-label {
    font-size: 0.7rem;
    color: #aea0d9;
  }
  
  .qs-val {
    font-size: 1.5rem;
    font-weight: 900;
    color: white;
  }
  
  .prog-bar {
    background: #2f274a;
    border-radius: 8px;
    height: 10px;
  }
  
  .prog-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--purple), var(--sky));
    transition: width 0.4s;
  }

  /* Question card */
  .q-card {
    background: var(--card-dark);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid #5b4d87;
    border-top: 6px solid var(--purple);
  }
  
  .q-type-badge {
    display: inline-block;
    background: #362d55;
    color: #e4d2ff;
    border-radius: 30px;
    padding: 4px 14px;
    font-size: 0.75rem;
    font-weight: 800;
    margin-bottom: 12px;
  }
  
  .question-text {
    font-size: 1.5rem;
    font-weight: 800;
    color: white;
    margin-bottom: 20px;
    text-align: center;
  }

  /* Three number inputs - EMPTY by default */
  .triple-inputs {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 20px 0;
  }
  
  .input-pair {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #2d2447;
    padding: 15px;
    border-radius: 50px;
    border: 2px solid var(--purple);
  }
  
  .pair-number {
    width: 80px;
    height: 80px;
    background: #1f1937;
    border: 3px solid var(--sun);
    border-radius: 20px;
    color: var(--sun);
    font-size: 2rem;
    font-family: 'Fredoka One', cursive;
    text-align: center;
    padding: 0 10px;
  }
  
  .pair-number:focus {
    outline: none;
    border-color: var(--purple);
  }
  
  .pair-number::placeholder {
    color: #5f4f8a;
    font-size: 1.2rem;
  }
  
  .pair-symbol {
    font-size: 2.5rem;
    color: var(--text-light);
    font-family: 'Fredoka One', cursive;
  }
  
  .pair-equals {
    font-size: 2rem;
    color: var(--text-soft);
    margin: 0 10px;
  }
  
  .pair-result {
    font-size: 2rem;
    color: var(--sun);
    font-family: 'Fredoka One', cursive;
    min-width: 60px;
    text-align: center;
  }
  
  .optional-badge {
    background: #3a2e5a;
    color: var(--text-soft);
    padding: 5px 15px;
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 800;
    margin-left: 15px;
  }

  /* Hint box - CLEAN AND ORGANIZED */
  .hint-box {
    background: #2d2447;
    border: 3px solid var(--purple);
    border-radius: 24px;
    padding: 20px;
    margin: 20px 0;
    display: none;
  }
  
  .hint-box.show {
    display: block;
  }
  
  .hint-title {
    color: var(--sun);
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 15px;
    text-align: center;
  }
  
  .hint-section {
    background: #1e1932;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 15px;
  }
  
  .hint-subtitle {
    color: var(--sky);
    font-size: 1.1rem;
    font-weight: 800;
    margin-bottom: 10px;
  }
  
  .hint-examples {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .hint-example {
    background: #2f274a;
    border-radius: 30px;
    padding: 10px 15px;
    color: var(--text-light);
    font-size: 1.1rem;
  }
  
  .hint-example strong {
    color: var(--sun);
    margin-right: 5px;
  }
  
  .hint-note {
    background: #1e2f47;
    border: 2px solid var(--sky);
    border-radius: 30px;
    padding: 12px 16px;
    color: #b3e0ff;
    font-weight: 800;
    text-align: center;
    margin-top: 10px;
  }

  .feedback {
    border-radius: 12px;
    padding: 14px;
    margin: 10px 0;
    font-weight: 700;
    display: none;
  }
  
  .feedback.show { display: block; }
  .feedback.ok { background: #1d4a2a; color: #c3f0c3; border: 2px solid var(--grass); }
  .feedback.bad { background: #5a2e36; color: #ffcfcf; border: 2px solid var(--coral); }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  
  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 30px;
    font-family: 'Fredoka One', cursive;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.1s;
  }
  
  .btn:hover { transform: translateY(-2px); }
  .btn-check { background: var(--purple); color: white; flex: 1; }
  .btn-next { background: var(--grass); color: #0f0a1a; flex: 1; display: none; }
  .btn-hint { background: var(--sun); color: #1a0f2a; }
  .btn-back { background: #3a3260; color: white; }

  .result-card {
    background: #1e1932;
    border-radius: 28px;
    padding: 28px;
    text-align: center;
    border: 2px solid #6b5b99;
  }
  
  .result-emoji { font-size: 4rem; }
  .result-title { font-size: 2rem; color: var(--sun); }
  .result-pct { font-size: 3rem; font-weight: 900; color: white; }
  .result-stars { font-size: 2rem; color: var(--sun); margin: 10px 0; }

  .mistake-item {
    background: #2f253a;
    border: 2px solid #c45d5d;
    border-radius: 12px;
    padding: 12px;
    margin: 10px 0;
    text-align: left;
  }
  
  .mistake-item strong { color: #ffb3b3; }
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <div class="topbar-title">🌟 Math Adventure - Simple Steps</div>
  <div class="topbar-btns">
    <button class="tb-btn tb-save" onclick="saveProgress()">💾 Save</button>
    <button class="tb-btn tb-load" onclick="loadProgress()">📂 Load</button>
    <input type="file" id="loadFile" accept=".json" style="display:none" onchange="loadFile(event)">
  </div>
  <div class="tb-lbl" id="progressLabel">0/10 mastered</div>
</div>

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen active">
  <div class="home-hero">
    <h1>Math Adventure!</h1>
    <p>10 levels · Simple step-by-step</p>
  </div>
  
  <div class="levels-grid" id="levelsGrid"></div>
  
  <div class="progress-chart" id="progressChart">
    <h3 style="color:#d4c2ff; margin-bottom:10px;">📊 Your Progress</h3>
    <div id="progressStats">0 of 10 levels mastered (0%)</div>
    <div class="progress-bar-cont"><div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div></div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="quizScreen" class="screen">
  <div class="quiz-head">
    <div class="quiz-meta">
      <span id="quizLevelLabel">Level 1</span>
      <span id="quizQCounter">Q1 / 13</span>
    </div>
    <div class="quiz-score-row">
      <div class="qs-item"><div class="qs-label">✅</div><div class="qs-val" id="scoreCorrect">0</div></div>
      <div class="qs-item"><div class="qs-label">❌</div><div class="qs-val" id="scoreWrong">0</div></div>
      <div class="qs-item"><div class="qs-label">%</div><div class="qs-val" id="scorePercent">—</div></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="quizProgressBar" style="width:0%"></div></div>
  </div>
  
  <div class="q-card" id="questionCard"></div>
  <div class="feedback" id="feedback"></div>
  
  <div class="btn-row">
    <button class="btn btn-back" onclick="goHome()">🏠 Home</button>
    <button class="btn btn-hint" id="hintButton" onclick="showHint()">💡 Hint</button>
    <button class="btn btn-check" id="checkButton" onclick="checkAnswer()">✅ Check</button>
    <button class="btn btn-next" id="nextButton" onclick="nextQuestion()">▶ Next</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen" class="screen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title" id="resultTitle">Great job!</div>
    <div class="result-pct" id="resultPercent">0%</div>
    <div class="result-stars" id="resultStars">⭐⭐⭐</div>
    <div id="resultMessage"></div>
    <div id="mistakesList"></div>
    <div class="btn-row" style="justify-content:center; margin-top:20px;">
      <button class="btn btn-back" id="retryButton">🔁 Try Again</button>
      <button class="btn btn-check" onclick="goHome()">🏠 Home</button>
      <button class="btn btn-next" id="nextLevelButton" style="display:none">➡️ Next Level</button>
    </div>
  </div>
</div>

</div>

<script>
// ==================== MATH ADVENTURE - 10 LEVELS ====================
const LEVELS = [
  { id: 'counting', name: 'Level 1 · Counting', icon: '🔢', desc: 'Count up to add, count down to subtract', color: '#6EC6F5' },
  { id: 'grouping', name: 'Level 2 · Tens & Ones', icon: '📦', desc: 'Groups of tens and ones', color: '#FFD93D' },
  { id: 'missing_add', name: 'Level 3 · Missing Number', icon: '❓', desc: 'Find the missing number', color: '#C77DFF' },
  { id: 'carry_add', name: 'Level 4 · Carry Addition', icon: '➕', desc: 'Add with carrying (17+5, 19+3)', color: '#48dbfb' },
  { id: 'borrow_sub', name: 'Level 5 · Borrow Subtraction', icon: '➖', desc: 'Subtract with borrowing (25-8, 52-28)', color: '#ff6b81' },
  { id: 'add_three', name: 'Level 6 · Add Three Numbers', icon: '🔺', desc: 'Add three numbers', color: '#A29BFE' },
  { id: 'sub_three', name: 'Level 7 · Subtract Three Numbers', icon: '🔻', desc: 'Subtract two numbers', color: '#fd79a8' },
  { id: 'compose_add', name: 'Level 8 · Make a Sum', icon: '🧩', desc: 'Find ways to make 12, 15, 20', color: '#F9CA24' },
  { id: 'compose_sub', name: 'Level 9 · Make a Difference', icon: '🔍', desc: 'Find ways to subtract to 8, 10, 12', color: '#6BCB77' },
  { id: 'combo', name: 'Level 10 · Grand Finale', icon: '🏆', desc: 'Mix of everything!', color: '#F9CA24' }
];

let progress = {};
let currentLevel = null;
let questions = [];
let qIndex = 0;
let score = 0;
let wrong = 0;
let mistakes = [];
let hintsUsed = 0;
let answered = false;

LEVELS.forEach(level => {
  if (!progress[level.id]) {
    progress[level.id] = { completed: false, score: 0 };
  }
});

function rnd(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// ==================== LEVEL 1: COUNTING ====================
function generateCountingProblems() {
  let problems = [];
  for (let i = 0; i < 13; i++) {
    if (i % 2 === 0) {
      let a = rnd(3, 12);
      let b = rnd(1, 5);
      problems.push({
        type: 'counting_add',
        question: `${a} + ${b} = ?`,
        answer: a + b,
        hint: `Let's count up! 👆

Start at ${a} and count up ${b} times:
${a} → ${a+1} → ${a+2} → ${a+3}

After ${b} jumps, we get to ${a+b}!

So ${a} + ${b} = ${a+b}`,
        explanation: `${a} + ${b} = ${a+b}`
      });
    } else {
      let a = rnd(5, 15);
      let b = rnd(1, 4);
      problems.push({
        type: 'counting_sub',
        question: `${a} - ${b} = ?`,
        answer: a - b,
        hint: `Let's count down! 👆

Start at ${a} and count down ${b} times:
${a} → ${a-1} → ${a-2} → ${a-3}

After ${b} jumps, we get to ${a-b}!

So ${a} - ${b} = ${a-b}`,
        explanation: `${a} - ${b} = ${a-b}`
      });
    }
  }
  return shuffle(problems);
}

// ==================== LEVEL 2: GROUPING ====================
function generateGroupingProblems() {
  let problems = [];
  for (let i = 0; i < 13; i++) {
    let tens = rnd(1, 5);
    let ones = rnd(0, 9);
    let num = tens * 10 + ones;
    
    if (i < 7) {
      problems.push({
        type: 'grouping_tens',
        question: `${num} has how many TENS?`,
        answer: tens,
        hint: `${num} means:
- The first number (${tens}) is the TENS
- The last number (${ones}) is the ONES

So ${num} has ${tens} tens!`,
        explanation: `${num} = ${tens} tens + ${ones} ones`
      });
    } else {
      problems.push({
        type: 'grouping_ones',
        question: `${num} has how many ONES?`,
        answer: ones,
        hint: `${num} means:
- The first number (${tens}) is the TENS
- The last number (${ones}) is the ONES

So ${num} has ${ones} ones!`,
        explanation: `${num} = ${tens} tens + ${ones} ones`
      });
    }
  }
  return shuffle(problems);
}

// ==================== LEVEL 3: MISSING NUMBER ====================
function generateMissingAddProblems() {
  let problems = [];
  for (let i = 0; i < 13; i++) {
    if (i % 3 === 0) {
      let total = rnd(8, 20);
      let known = rnd(2, total - 2);
      let missing = total - known;
      problems.push({
        type: 'missing_two',
        question: `${total} = ${known} + ?`,
        answer: missing,
        hint: `We have: ${total} = ${known} + ?

Step 1: We know one number is ${known}
Step 2: To find the missing number:
   ${total} - ${known} = ?

Step 3: ${total} - ${known} = ${missing}

Check: ${known} + ${missing} = ${total} ✅`,
        explanation: `${total} - ${known} = ${missing}`
      });
    } else {
      let total = rnd(12, 25);
      let a = rnd(2, 7);
      let b = rnd(2, 7);
      let missing = total - a - b;
      if (missing < 1 || missing > 15) { i--; continue; }
      problems.push({
        type: 'missing_three',
        question: `${total} = ${a} + ${b} + ?`,
        answer: missing,
        hint: `We have: ${total} = ${a} + ${b} + ?

Step 1: Add the numbers we know:
   ${a} + ${b} = ${a + b}

Step 2: Subtract from total:
   ${total} - ${a + b} = ?

Step 3: ${total} - ${a + b} = ${missing}

Check: ${a} + ${b} + ${missing} = ${total} ✅`,
        explanation: `${total} - ${a} - ${b} = ${missing}`
      });
    }
  }
  return shuffle(problems);
}

// ==================== LEVEL 4: CARRY ADDITION ====================
function generateCarryAddProblems() {
  let problems = [];
  
  let pairs = [
    [17, 5], [18, 4], [19, 3], [16, 6], [15, 7], [14, 8], [13, 9],
    [19, 4], [18, 5], [17, 6], [16, 7], [15, 8], [14, 9],
    [27, 5], [28, 4], [29, 3], [26, 6], [25, 7], [24, 8], [23, 9]
  ];
  
  for (let i = 0; i < 13; i++) {
    let [a, b] = shuffle(pairs)[0];
    let onesA = a % 10;
    let onesB = b % 10;
    let answer = a + b;
    
    problems.push({
      type: 'carry_add',
      question: `${a} + ${b} = ?`,
      answer: answer,
      hint: `Let's add like this:

   ${a}
+   ${b}
_____

Step 1: Look at the ONES place (right side):
   ${a} has ${onesA} ones
   ${b} has ${onesB} ones
   ${onesA} + ${onesB} = ${onesA + onesB}

Step 2: The ones place can only have numbers from 0 to 9.
   ${onesA + onesB} is more than 9, so it's too big for just the ones place!
   
Step 3: We write down ${answer % 10} in the ones place,
   and we CARRY the 1 to the tens place.

   1 (carry)
   ${a}
+   ${b}
_____
   ${answer % 10}

Step 4: Now add the TENS place:
   ${Math.floor(a/10)} + ${Math.floor(b/10)} + the carried 1 = ${Math.floor(answer/10)}

Step 5: Write ${Math.floor(answer/10)} in the tens place:

   1 (carry)
   ${a}
+   ${b}
_____
   ${answer}

So ${a} + ${b} = ${answer}! ✅

Remember: The ones place can only hold 0-9. If it's 10 or more, we CARRY the 1!`,
      explanation: `${a} + ${b} = ${answer}`
    });
  }
  return shuffle(problems);
}

// ==================== LEVEL 5: BORROW SUBTRACTION ====================
function generateBorrowSubProblems() {
  let problems = [];
  
  let pairs = [
    [25, 8], [24, 7], [23, 6], [22, 5], [21, 4],
    [52, 28], [51, 27], [53, 29], [42, 18], [41, 17],
    [31, 13], [32, 14], [33, 15], [34, 16], [35, 17]
  ];
  
  for (let i = 0; i < 13; i++) {
    let [a, b] = shuffle(pairs)[0];
    let onesA = a % 10;
    let onesB = b % 10;
    let tensA = Math.floor(a / 10);
    let tensB = Math.floor(b / 10);
    let answer = a - b;
    
    problems.push({
      type: 'borrow_sub',
      question: `${a} - ${b} = ?`,
      answer: answer,
      hint: `Let's subtract like this:

   ${a}
-   ${b}
_____

Step 1: Look at the ONES place (right side):
   ${a} has ${onesA} ones
   ${b} has ${onesB} ones

Step 2: ${onesA} is smaller than ${onesB}, so we can't subtract!
   We need to BORROW 1 ten from the ${tensA} tens.

Step 3: After borrowing:
   The ones become ${onesA + 10}
   The tens become ${tensA - 1}

Step 4: Now subtract the ones:
   ${onesA + 10} - ${onesB} = ${onesA + 10 - onesB}

Step 5: Subtract the tens:
   ${tensA - 1} - ${tensB} = ${tensA - 1 - tensB}

Step 6: Put together: ${tensA - 1 - tensB}${onesA + 10 - onesB} = ${answer}

So ${a} - ${b} = ${answer}! ✅

Remember: If the top ones are smaller, BORROW 1 ten from the tens!`,
      explanation: `${a} - ${b} = ${answer}`
    });
  }
  return shuffle(problems);
}

// ==================== LEVEL 6: ADD THREE NUMBERS ====================
function generateAddThreeProblems() {
  let problems = [];
  for (let i = 0; i < 13; i++) {
    let a = rnd(10, 30);
    let b = rnd(10, 30);
    let c = rnd(10, 30);
    let sum = a + b + c;
    if (sum > 90) { i--; continue; }
    problems.push({
      type: 'add_three',
      question: `${a} + ${b} + ${c} = ?`,
      answer: sum,
      hint: `Add step by step:

Step 1: ${a} + ${b} = ${a + b}
Step 2: ${a + b} + ${c} = ${sum}

So ${a} + ${b} + ${c} = ${sum}! ✅`,
      explanation: `${a} + ${b} + ${c} = ${sum}`
    });
  }
  return shuffle(problems);
}

// ==================== LEVEL 7: SUBTRACT THREE NUMBERS ====================
function generateSubThreeProblems() {
  let problems = [];
  for (let i = 0; i < 13; i++) {
    let total = rnd(50, 90);
    let b = rnd(10, 30);
    let c = rnd(10, 30);
    let result = total - b - c;
    if (result < 5) { i--; continue; }
    problems.push({
      type: 'sub_three',
      question: `${total} - ${b} - ${c} = ?`,
      answer: result,
      hint: `Subtract step by step:

Step 1: ${total} - ${b} = ${total - b}
Step 2: ${total - b} - ${c} = ${result}

So ${total} - ${b} - ${c} = ${result}! ✅`,
      explanation: `${total} - ${b} - ${c} = ${result}`
    });
  }
  return shuffle(problems);
}

// ==================== LEVEL 8: NUMBER COMPOSITION - ADDITION ====================
function generateComposeAddProblems() {
  let problems = [];
  let targets = [10, 12, 15, 18, 20, 24, 25, 30];
  for (let i = 0; i < 13; i++) {
    let target = targets[rnd(0, targets.length - 1)];
    
    problems.push({
      type: 'compose_add',
      question: `Find two numbers that add up to ${target}`,
      target: target,
      hint: `🎯 HOW TO FIND THE NUMBERS:
• Pick any number you like
• Subtract it from ${target}
• The answer is the other number!

For example:
✨ Pick 4: ${target} - 4 = ${target - 4} → 4 + ${target - 4} = ${target}
✨ Pick 7: ${target} - 7 = ${target - 7} → 7 + ${target - 7} = ${target}
✨ Pick 9: ${target} - 9 = ${target - 9} → 9 + ${target - 9} = ${target}

📝 You need to find THREE different pairs!
The third one is optional - you can skip it if you want.

✅ Examples of correct answers:
1 + ${target-1} = ${target}
2 + ${target-2} = ${target}
3 + ${target-3} = ${target}`
    });
  }
  return shuffle(problems);
}

// ==================== LEVEL 9: NUMBER COMPOSITION - SUBTRACTION ====================
function generateComposeSubProblems() {
  let problems = [];
  let diffs = [5, 6, 7, 8, 9, 10, 12, 15];
  for (let i = 0; i < 13; i++) {
    let diff = diffs[rnd(0, diffs.length - 1)];
    
    problems.push({
      type: 'compose_sub',
      question: `Find two numbers with a difference of ${diff}`,
      diff: diff,
      hint: `🎯 HOW TO FIND THE NUMBERS:
• Pick a smaller number
• Add ${diff} to it
• That's your bigger number!

For example:
✨ Pick 3: 3 + ${diff} = ${diff + 3} → ${diff + 3} - 3 = ${diff}
✨ Pick 6: 6 + ${diff} = ${diff + 6} → ${diff + 6} - 6 = ${diff}
✨ Pick 9: 9 + ${diff} = ${diff + 9} → ${diff + 9} - 9 = ${diff}

📝 You need to find THREE different pairs!
The third one is optional - you can skip it if you want.

✅ Examples of correct answers:
${diff+5} - 5 = ${diff}
${diff+8} - 8 = ${diff}
${diff+12} - 12 = ${diff}`
    });
  }
  return shuffle(problems);
}

// ==================== LEVEL 10: GRAND FINALE ====================
function generateComboProblems() {
  let problems = [];
  
  let counting = generateCountingProblems().slice(0, 2);
  let grouping = generateGroupingProblems().slice(0, 1);
  let missing = generateMissingAddProblems().slice(0, 2);
  let carry = generateCarryAddProblems().slice(0, 2);
  let borrow = generateBorrowSubProblems().slice(0, 2);
  let addThree = generateAddThreeProblems().slice(0, 1);
  let subThree = generateSubThreeProblems().slice(0, 1);
  let composeAdd = generateComposeAddProblems().slice(0, 1);
  let composeSub = generateComposeSubProblems().slice(0, 1);
  
  problems = [
    ...counting,
    ...grouping,
    ...missing,
    ...carry,
    ...borrow,
    ...addThree,
    ...subThree,
    ...composeAdd,
    ...composeSub
  ];
  
  return shuffle(problems).slice(0, 13);
}

// ==================== RENDER HOME SCREEN ====================
function renderHome() {
  const grid = document.getElementById('levelsGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  
  LEVELS.forEach(level => {
    const levelData = progress[level.id] || { completed: false, score: 0 };
    const stars = levelData.completed ? (levelData.score >= 90 ? '⭐⭐⭐' : levelData.score >= 70 ? '⭐⭐' : '⭐') : '';
    
    const btn = document.createElement('div');
    btn.className = 'level-btn';
    btn.innerHTML = `
      <div class="level-icon">${level.icon}</div>
      <div class="level-name">${level.name}</div>
      <div class="level-desc">${level.desc}</div>
      <div class="level-stars">${stars}</div>
    `;
    btn.onclick = () => startLevel(level);
    grid.appendChild(btn);
  });
  
  updateProgressStats();
}

function updateProgressStats() {
  let mastered = 0;
  LEVELS.forEach(level => {
    if (progress[level.id]?.completed) mastered++;
  });
  const total = LEVELS.length;
  const pct = Math.round((mastered / total) * 100) || 0;
  
  document.getElementById('progressStats').innerHTML = `${mastered} of ${total} levels mastered (${pct}%)`;
  document.getElementById('progressBarFill').style.width = pct + '%';
  document.getElementById('progressLabel').innerHTML = `${mastered}/${total} mastered`;
}

function startLevel(level) {
  currentLevel = level;
  
  if (level.id === 'counting') questions = generateCountingProblems();
  else if (level.id === 'grouping') questions = generateGroupingProblems();
  else if (level.id === 'missing_add') questions = generateMissingAddProblems();
  else if (level.id === 'carry_add') questions = generateCarryAddProblems();
  else if (level.id === 'borrow_sub') questions = generateBorrowSubProblems();
  else if (level.id === 'add_three') questions = generateAddThreeProblems();
  else if (level.id === 'sub_three') questions = generateSubThreeProblems();
  else if (level.id === 'compose_add') questions = generateComposeAddProblems();
  else if (level.id === 'compose_sub') questions = generateComposeSubProblems();
  else if (level.id === 'combo') questions = generateComboProblems();
  
  qIndex = 0;
  score = 0;
  wrong = 0;
  mistakes = [];
  hintsUsed = 0;
  answered = false;
  
  document.getElementById('quizLevelLabel').innerHTML = `${level.icon} ${level.name}`;
  showScreen('quizScreen');
  renderQuestion();
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function goHome() {
  if (confirm('Leave this level? Progress won\'t be saved.')) {
    renderHome();
    showScreen('homeScreen');
  }
}

function renderQuestion() {
  const q = questions[qIndex];
  const total = questions.length;
  
  document.getElementById('quizQCounter').innerHTML = `Q${qIndex + 1}/${total}`;
  document.getElementById('scoreCorrect').innerHTML = score;
  document.getElementById('scoreWrong').innerHTML = wrong;
  const att = score + wrong;
  document.getElementById('scorePercent').innerHTML = att ? Math.round((score / att) * 100) + '%' : '—';
  document.getElementById('quizProgressBar').style.width = (qIndex / total * 100) + '%';
  
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('checkButton').style.display = 'inline-flex';
  document.getElementById('nextButton').style.display = 'none';
  
  // Hint button should show for all questions, including composition ones
  const hintAllowed = hintsUsed < 2;
  document.getElementById('hintButton').style.display = hintAllowed ? 'inline-flex' : 'none';
  document.getElementById('hintButton').disabled = false;
  
  answered = false;
  
  let typeLabel = {
    'counting_add': '🔢 Counting', 'counting_sub': '🔢 Counting',
    'grouping_tens': '📦 Tens and Ones', 'grouping_ones': '📦 Tens and Ones',
    'missing_two': '❓ Missing Number', 'missing_three': '❓ Missing Number',
    'carry_add': '➕ Carry Addition', 'borrow_sub': '➖ Borrow Subtraction',
    'add_three': '🔺 Add Three Numbers', 'sub_three': '🔻 Subtract Three Numbers',
    'compose_add': '🧩 Make a Sum', 'compose_sub': '🔍 Make a Difference'
  }[q.type] || '🧮 Math';
  
  let html = '';
  
  if (q.type === 'compose_add' || q.type === 'compose_sub') {
    // For composition problems, show three input pairs - EMPTY fields
    let symbol = q.type === 'compose_add' ? '+' : '-';
    let target = q.type === 'compose_add' ? q.target : q.diff;
    
    html = `
      <div class="q-type-badge">${typeLabel}</div>
      <div class="question-text">${q.question}</div>
      
      <div class="triple-inputs">
        <div class="input-pair">
          <input class="pair-number" id="num1a" type="number" placeholder="?" value="">
          <span class="pair-symbol">${symbol}</span>
          <input class="pair-number" id="num1b" type="number" placeholder="?" value="">
          <span class="pair-equals">=</span>
          <span class="pair-result">${target}</span>
        </div>
        
        <div class="input-pair">
          <input class="pair-number" id="num2a" type="number" placeholder="?" value="">
          <span class="pair-symbol">${symbol}</span>
          <input class="pair-number" id="num2b" type="number" placeholder="?" value="">
          <span class="pair-equals">=</span>
          <span class="pair-result">${target}</span>
        </div>
        
        <div class="input-pair">
          <input class="pair-number" id="num3a" type="number" placeholder="?" value="">
          <span class="pair-symbol">${symbol}</span>
          <input class="pair-number" id="num3b" type="number" placeholder="?" value="">
          <span class="pair-equals">=</span>
          <span class="pair-result">${target}</span>
          <span class="optional-badge">Optional</span>
        </div>
      </div>
      
      <div class="hint-box" id="hintDisplay">
        <div class="hint-title">💡 How to Find the Numbers</div>
        <div class="hint-section">
          <div class="hint-subtitle">🎯 Step-by-Step:</div>
          <div class="hint-examples">
            ${q.hint.split('\n').map(line => {
              if (line.trim().startsWith('✨')) {
                return `<div class="hint-example">${line}</div>`;
              } else if (line.trim().startsWith('📝') || line.trim().startsWith('✅')) {
                return `<div class="hint-note">${line}</div>`;
              } else if (line.trim() && !line.trim().startsWith('•')) {
                return `<div class="hint-example"><strong>•</strong> ${line}</div>`;
              } else if (line.trim().startsWith('•')) {
                return `<div class="hint-example">${line}</div>`;
              }
              return '';
            }).join('')}
          </div>
        </div>
      </div>
    `;
  } else {
    // For regular problems, show single input
    html = `
      <div class="q-type-badge">${typeLabel}</div>
      <div class="question-text">${q.question}</div>
      <div class="hint-box" id="hintDisplay">${q.hint}</div>
      <input class="answer-input" id="answerInput" type="text" placeholder="Type answer..." autocomplete="off">
    `;
  }
  
  document.getElementById('questionCard').innerHTML = html;
  
  if (!q.type.includes('compose')) {
    document.getElementById('answerInput')?.focus();
  }
}

function showHint() {
  if (!questions[qIndex]) return;
  hintsUsed++;
  document.getElementById('hintDisplay').style.display = 'block';
  document.getElementById('hintButton').disabled = true;
}

function checkAnswer() {
  if (answered) return;
  
  const q = questions[qIndex];
  
  answered = true;
  let isCorrect = false;
  let correctCount = 0;
  let totalPairs = 0;
  
  if (q.type === 'compose_add' || q.type === 'compose_sub') {
    // Check each pair
    let symbol = q.type === 'compose_add' ? '+' : '-';
    let target = q.type === 'compose_add' ? q.target : q.diff;
    
    // Get values from inputs
    let num1a = parseInt(document.getElementById('num1a')?.value);
    let num1b = parseInt(document.getElementById('num1b')?.value);
    let num2a = parseInt(document.getElementById('num2a')?.value);
    let num2b = parseInt(document.getElementById('num2b')?.value);
    let num3a = parseInt(document.getElementById('num3a')?.value);
    let num3b = parseInt(document.getElementById('num3b')?.value);
    
    // Check first pair (required)
    if (!isNaN(num1a) && !isNaN(num1b)) {
      totalPairs++;
      if (q.type === 'compose_add' && num1a + num1b === target) correctCount++;
      else if (q.type === 'compose_sub' && num1a - num1b === target) correctCount++;
    }
    
    // Check second pair (required)
    if (!isNaN(num2a) && !isNaN(num2b)) {
      totalPairs++;
      if (q.type === 'compose_add' && num2a + num2b === target) correctCount++;
      else if (q.type === 'compose_sub' && num2a - num2b === target) correctCount++;
    }
    
    // Check third pair (optional)
    if (!isNaN(num3a) && !isNaN(num3b)) {
      totalPairs++;
      if (q.type === 'compose_add' && num3a + num3b === target) correctCount++;
      else if (q.type === 'compose_sub' && num3a - num3b === target) correctCount++;
    }
    
    // Need at least first two pairs correct
    isCorrect = (correctCount >= 2);
    
    if (isCorrect) {
      score++;
      let message = `✅ Great! You found ${correctCount} correct pairs!`;
      if (correctCount === 3) message += ' All three pairs are correct! ⭐';
      document.getElementById('feedback').className = 'feedback show ok';
      document.getElementById('feedback').innerHTML = message;
    } else {
      wrong++;
      mistakes.push({
        question: q.question,
        yourAnswer: `${num1a || '?'} ${symbol} ${num1b || '?'}, ${num2a || '?'} ${symbol} ${num2b || '?'}, ${num3a || '?'} ${symbol} ${num3b || '?'}`,
        correct: `Need two correct pairs that make ${target}`,
        explanation: ''
      });
      document.getElementById('feedback').className = 'feedback show bad';
      document.getElementById('feedback').innerHTML = `❌ You got ${correctCount} out of 2 required pairs correct. Keep trying!`;
    }
    
  } else {
    // Regular answer checking
    const input = document.getElementById('answerInput');
    if (!input) return;
    
    const val = input.value.trim();
    if (val === '') {
      answered = false;
      alert('Please enter an answer!');
      return;
    }
    
    isCorrect = (parseInt(val) === q.answer);
    
    if (isCorrect) {
      score++;
      document.getElementById('feedback').className = 'feedback show ok';
      document.getElementById('feedback').innerHTML = '✅ Correct! ' + (q.explanation || '');
    } else {
      wrong++;
      mistakes.push({
        question: q.question,
        yourAnswer: val,
        correct: q.answer,
        explanation: q.explanation || ''
      });
      document.getElementById('feedback').className = 'feedback show bad';
      document.getElementById('feedback').innerHTML = `❌ Not quite. ${q.explanation || 'Try again!'}`;
    }
  }
  
  document.getElementById('scoreCorrect').innerHTML = score;
  document.getElementById('scoreWrong').innerHTML = wrong;
  const att = score + wrong;
  document.getElementById('scorePercent').innerHTML = att ? Math.round((score / att) * 100) + '%' : '—';
  
  document.getElementById('checkButton').style.display = 'none';
  document.getElementById('nextButton').style.display = 'inline-flex';
  document.getElementById('hintButton').style.display = 'none';
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  const passed = pct >= 70;
  
  if (passed) {
    progress[currentLevel.id] = {
      completed: true,
      score: pct
    };
  }
  
  document.getElementById('resultEmoji').innerHTML = pct >= 90 ? '🏆' : pct >= 70 ? '🌟' : '💪';
  document.getElementById('resultTitle').innerHTML = pct >= 90 ? 'Amazing!' : pct >= 70 ? 'Good job!' : 'Keep practicing!';
  document.getElementById('resultPercent').innerHTML = pct + '%';
  document.getElementById('resultStars').innerHTML = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : '⭐';
  document.getElementById('resultMessage').innerHTML = `You got ${score} out of ${total} correct.`;
  
  let mistakesHtml = '';
  if (mistakes.length > 0) {
    mistakesHtml = '<h3 style="color:#ffb3b3; margin:15px 0 8px;">📝 Review mistakes:</h3>';
    mistakes.forEach(m => {
      mistakesHtml += `
        <div class="mistake-item">
          <strong>${m.question}</strong><br>
          Your answer: ${m.yourAnswer} ❌ Correct: ${m.correct}<br>
          <small>${m.explanation || ''}</small>
        </div>
      `;
    });
  }
  document.getElementById('mistakesList').innerHTML = mistakesHtml;
  
  document.getElementById('retryButton').onclick = () => startLevel(currentLevel);
  
  const levelIndex = LEVELS.findIndex(l => l.id === currentLevel.id);
  if (passed && levelIndex < LEVELS.length - 1) {
    document.getElementById('nextLevelButton').style.display = 'inline-flex';
    document.getElementById('nextLevelButton').onclick = () => startLevel(LEVELS[levelIndex + 1]);
  } else {
    document.getElementById('nextLevelButton').style.display = 'none';
  }
  
  renderHome();
  showScreen('resultScreen');
}

function saveProgress() {
  const data = JSON.stringify({ version: 1, progress: progress }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'math-adventure-save.json';
  a.click();
  alert('Progress saved!');
}

function loadProgress() {
  document.getElementById('loadFile').click();
}

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data && data.version === 1 && data.progress) {
        progress = data.progress;
        renderHome();
        alert('Progress loaded!');
      } else {
        alert('Invalid save file');
      }
    } catch (err) {
      alert('Error loading file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

renderHome();
</script>
