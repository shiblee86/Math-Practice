<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Math Adventure - Step by Step Learning</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --bg-dark: #0a0718;
    --card-dark: #1a1530;
    --text-light: #f0ebff;
    --text-soft: #cdc2f0;
    --sky: #6EC6F5;
    --sun: #FFD93D;
    --grass: #6BCB77;
    --coral: #FF6B6B;
    --purple: #C77DFF;
    --border-glow: #433b6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg-dark);
    min-height: 100vh;
    color: var(--text-light);
    padding: 16px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  /* Top bar */
  .topbar {
    background: #1f1a33;
    border-radius: 20px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    border: 1px solid #41386b;
    box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    position: sticky;
    top: 8px;
    z-index: 100;
    backdrop-filter: blur(5px);
  }
  
  .topbar-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--sun);
    text-shadow: 0 0 8px #b8860b;
  }
  
  .topbar-btns {
    display: flex;
    gap: 10px;
  }
  
  .tb-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 30px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform 0.1s;
  }
  
  .tb-btn:hover {
    transform: scale(1.05);
  }
  
  .tb-save {
    background: var(--sun);
    color: #1a0f2a;
  }
  
  .tb-load {
    background: var(--grass);
    color: #0f0a1a;
  }
  
  .tb-lbl {
    font-size: 0.75rem;
    color: #b1a5d9;
  }

  /* Screens */
  .screen {
    display: none;
  }
  
  .screen.active {
    display: block;
  }

  /* Home screen */
  .home-hero {
    text-align: center;
    padding: 20px 0 10px;
  }
  
  .home-hero h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.4rem;
    background: linear-gradient(135deg, var(--sun), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px #9f7aea;
  }
  
  .home-hero p {
    color: var(--text-soft);
    font-size: 1rem;
    margin-top: 8px;
  }

  /* Level grid */
  .levels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    margin-top: 24px;
  }

  .level-btn {
    background: var(--card-dark);
    border: 2px solid #3d3460;
    border-radius: 24px;
    padding: 20px 10px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    transition: transform 0.15s, border-color 0.15s;
  }
  
  .level-btn:hover {
    transform: translateY(-5px);
    border-color: var(--purple);
  }
  
  .level-icon {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }
  
  .level-name {
    font-weight: 800;
    font-size: 1rem;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  
  .level-desc {
    font-size: 0.75rem;
    color: #b8aae6;
    margin: 5px 0;
    line-height: 1.3;
  }
  
  .level-stars {
    color: var(--sun);
    font-size: 0.9rem;
  }

  /* Progress chart */
  .progress-chart {
    background: #1e1932;
    border-radius: 20px;
    padding: 20px;
    margin-top: 30px;
    border: 1px solid #4f4377;
  }
  
  .progress-bar-cont {
    background: #2f274a;
    border-radius: 12px;
    height: 24px;
    margin: 12px 0 8px;
  }
  
  .progress-bar-fill {
    height: 100%;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--purple), var(--sky));
    width: 0%;
    transition: width 0.4s;
  }

  /* Quiz screen */
  .quiz-head {
    background: #1e1932;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid #5a4c82;
  }
  
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    color: #b7a9e6;
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  
  .quiz-score-row {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  
  .qs-item {
    text-align: center;
    flex: 1;
  }
  
  .qs-label {
    font-size: 0.7rem;
    color: #aea0d9;
  }
  
  .qs-val {
    font-size: 1.5rem;
    font-weight: 900;
    color: white;
  }
  
  .prog-bar {
    background: #2f274a;
    border-radius: 8px;
    height: 10px;
  }
  
  .prog-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--purple), var(--sky));
    transition: width 0.4s;
  }

  /* Question card */
  .q-card {
    background: var(--card-dark);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid #5b4d87;
    border-top: 6px solid var(--purple);
  }
  
  .q-type-badge {
    display: inline-block;
    background: #362d55;
    color: #e4d2ff;
    border-radius: 30px;
    padding: 4px 14px;
    font-size: 0.75rem;
    font-weight: 800;
    margin-bottom: 12px;
  }
  
  .question-text {
    font-size: 1.3rem;
    font-weight: 700;
    color: white;
    margin-bottom: 16px;
  }
  
  .equation-display {
    font-family: 'Fredoka One', cursive;
    font-size: 2.5rem;
    text-align: center;
    color: var(--sun);
    margin: 16px 0;
  }
  
  .eq-blank {
    border-bottom: 4px solid var(--coral);
    color: var(--coral);
    min-width: 50px;
    display: inline-block;
  }

  /* Step-by-step hint - CLEAR AND CONVERSATIONAL */
  .step-hint {
    background: #2d2447;
    border-left: 8px solid var(--purple);
    border-radius: 16px;
    padding: 20px;
    margin: 16px 0;
    font-weight: 600;
    color: #e5d5ff;
    line-height: 1.8;
    font-size: 1.1rem;
    white-space: pre-line;
  }
  
  .step-title {
    color: var(--sun);
    font-weight: 800;
    font-size: 1.2rem;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .step-conclusion {
    background: #1e2f47;
    border: 2px solid var(--sky);
    border-radius: 30px;
    padding: 12px 16px;
    margin-top: 12px;
    font-weight: 800;
    text-align: center;
    color: #b3e0ff;
  }

  .answer-input {
    width: 100%;
    padding: 16px;
    font-size: 2rem;
    font-family: 'Fredoka One', cursive;
    background: #1f1937;
    border: 3px solid #4e4280;
    border-radius: 16px;
    color: var(--sun);
    text-align: center;
    margin: 12px 0;
  }
  
  .answer-input:focus {
    border-color: var(--purple);
    outline: none;
  }

  .feedback {
    border-radius: 12px;
    padding: 14px;
    margin: 10px 0;
    font-weight: 700;
    display: none;
  }
  
  .feedback.show { display: block; }
  .feedback.ok { background: #1d4a2a; color: #c3f0c3; border: 2px solid var(--grass); }
  .feedback.bad { background: #5a2e36; color: #ffcfcf; border: 2px solid var(--coral); }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  
  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 30px;
    font-family: 'Fredoka One', cursive;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.1s;
  }
  
  .btn:hover { transform: translateY(-2px); }
  .btn-check { background: var(--purple); color: white; flex: 1; }
  .btn-next { background: var(--grass); color: #0f0a1a; flex: 1; display: none; }
  .btn-hint { background: var(--sun); color: #1a0f2a; }
  .btn-back { background: #3a3260; color: white; }

  /* Result screen */
  .result-card {
    background: #1e1932;
    border-radius: 28px;
    padding: 28px;
    text-align: center;
    border: 2px solid #6b5b99;
  }
  
  .result-emoji { font-size: 4rem; }
  .result-title { font-size: 2rem; color: var(--sun); }
  .result-pct { font-size: 3rem; font-weight: 900; color: white; }
  .result-stars { font-size: 2rem; color: var(--sun); margin: 10px 0; }

  .mistake-item {
    background: #2f253a;
    border: 2px solid #c45d5d;
    border-radius: 12px;
    padding: 12px;
    margin: 10px 0;
    text-align: left;
  }
  
  .mistake-item strong {
    color: #ffb3b3;
  }
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <div class="topbar-title">🌟 Math Adventure - Step by Step</div>
  <div class="topbar-btns">
    <button class="tb-btn tb-save" onclick="saveProgress()">💾 Save</button>
    <button class="tb-btn tb-load" onclick="loadProgress()">📂 Load</button>
    <input type="file" id="loadFile" accept=".json" style="display:none" onchange="loadFile(event)">
  </div>
  <div class="tb-lbl" id="progressLabel">0/8 mastered</div>
</div>

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen active">
  <div class="home-hero">
    <h1>Math Adventure!</h1>
    <p>8 exciting levels · step-by-step hints</p>
  </div>
  
  <!-- LEVELS GRID -->
  <div class="levels-grid" id="levelsGrid"></div>
  
  <div class="progress-chart" id="progressChart">
    <h3 style="color:#d4c2ff; margin-bottom:10px;">📊 Your Progress</h3>
    <div id="progressStats">0 of 8 levels mastered (0%)</div>
    <div class="progress-bar-cont"><div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div></div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="quizScreen" class="screen">
  <div class="quiz-head">
    <div class="quiz-meta">
      <span id="quizLevelLabel">Level 1</span>
      <span id="quizQCounter">Q1 / 13</span>
    </div>
    <div class="quiz-score-row">
      <div class="qs-item"><div class="qs-label">✅</div><div class="qs-val" id="scoreCorrect">0</div></div>
      <div class="qs-item"><div class="qs-label">❌</div><div class="qs-val" id="scoreWrong">0</div></div>
      <div class="qs-item"><div class="qs-label">%</div><div class="qs-val" id="scorePercent">—</div></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="quizProgressBar" style="width:0%"></div></div>
  </div>
  
  <div class="q-card" id="questionCard"></div>
  <div class="feedback" id="feedback"></div>
  
  <div class="btn-row">
    <button class="btn btn-back" onclick="goHome()">🏠 Home</button>
    <button class="btn btn-hint" id="hintButton" onclick="showHint()">💡 Hint</button>
    <button class="btn btn-check" id="checkButton" onclick="checkAnswer()">✅ Check</button>
    <button class="btn btn-next" id="nextButton" onclick="nextQuestion()">▶ Next</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen" class="screen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title" id="resultTitle">Great job!</div>
    <div class="result-pct" id="resultPercent">0%</div>
    <div class="result-stars" id="resultStars">⭐⭐⭐</div>
    <div id="resultMessage"></div>
    <div id="mistakesList"></div>
    <div class="btn-row" style="justify-content:center; margin-top:20px;">
      <button class="btn btn-back" id="retryButton">🔁 Try Again</button>
      <button class="btn btn-check" onclick="goHome()">🏠 Home</button>
      <button class="btn btn-next" id="nextLevelButton" style="display:none">➡️ Next Level</button>
    </div>
  </div>
</div>

</div>

<script>
// ==================== MATH ADVENTURE - 8 LEVELS ====================
const LEVELS = [
  { 
    id: 'counting', 
    name: 'Level 1 · Counting', 
    icon: '🔢', 
    desc: 'Count up to add, count down to subtract',
    color: '#6EC6F5' 
  },
  { 
    id: 'grouping', 
    name: 'Level 2 · Tens & Ones', 
    icon: '📦', 
    desc: 'Groups of tens and ones (e.g. 28 = 2 tens, 8 ones)',
    color: '#FFD93D' 
  },
  { 
    id: 'missing_add', 
    name: 'Level 3 · Missing Number', 
    icon: '❓', 
    desc: 'Find the missing number: 12 = 4 + 5 + ?',
    color: '#C77DFF' 
  },
  { 
    id: 'carry_add', 
    name: 'Level 4 · Carry Addition', 
    icon: '➕', 
    desc: 'Add with carrying (sums up to 20)',
    color: '#48dbfb' 
  },
  { 
    id: 'borrow_sub', 
    name: 'Level 5 · Borrow Subtraction', 
    icon: '➖', 
    desc: 'Subtract with borrowing (up to 20)',
    color: '#ff6b81' 
  },
  { 
    id: 'add_three', 
    name: 'Level 6 · Add Three Numbers', 
    icon: '🔺', 
    desc: 'Add three numbers with carry (sums up to 90)',
    color: '#A29BFE' 
  },
  { 
    id: 'sub_three', 
    name: 'Level 7 · Subtract Three Numbers', 
    icon: '🔻', 
    desc: 'Subtract two numbers from a big one (e.g. 85 - 50 - 30)',
    color: '#fd79a8' 
  },
  { 
    id: 'combo', 
    name: 'Level 8 · Grand Finale', 
    icon: '🏆', 
    desc: 'Mix of everything! Show what you know!',
    color: '#F9CA24' 
  }
];

// Progress tracking
let progress = {};
let currentLevel = null;
let questions = [];
let qIndex = 0;
let score = 0;
let wrong = 0;
let mistakes = [];
let hintsUsed = 0;
let answered = false;

// Initialize progress
LEVELS.forEach(level => {
  if (!progress[level.id]) {
    progress[level.id] = { completed: false, score: 0 };
  }
});

// ==================== HELPER FUNCTIONS ====================
function rnd(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// ==================== LEVEL 1: COUNTING ====================
function generateCountingProblems() {
  let problems = [];
  
  // 13 problems total
  for (let i = 0; i < 13; i++) {
    if (i % 2 === 0) {
      // Addition counting up
      let a = rnd(3, 12);
      let b = rnd(1, 5);
      problems.push({
        type: 'counting_add',
        question: `${a} + ${b} = ?`,
        answer: a + b,
        hint: `Let's count up to find the answer! 🖐️

We have: ${a} + ${b}

What are we trying to do? We start at ${a} and count up ${b} more.

Step 1: Put up ${b} fingers.
Step 2: Start at ${a} and count each finger:
   ${a} + 1 = ${a+1}
   ${a+1} + 1 = ${a+2}
   Keep going until you've counted all ${b} fingers!

Step 3: After counting ${b} times, we land on ${a + b}.

So ${a} + ${b} = ${a + b}! ✅`,
        explanation: `${a} + ${b} = ${a + b}`
      });
    } else {
      // Subtraction counting down
      let a = rnd(5, 15);
      let b = rnd(1, 4);
      problems.push({
        type: 'counting_sub',
        question: `${a} - ${b} = ?`,
        answer: a - b,
        hint: `Let's count down to find the answer! 🖐️

We have: ${a} - ${b}

What are we trying to do? We start at ${a} and count down ${b} steps.

Step 1: Put up ${b} fingers.
Step 2: Start at ${a} and count down for each finger:
   ${a} - 1 = ${a-1}
   ${a-1} - 1 = ${a-2}
   Keep going until you've counted all ${b} fingers!

Step 3: After counting down ${b} times, we land on ${a - b}.

So ${a} - ${b} = ${a - b}! ✅`,
        explanation: `${a} - ${b} = ${a - b}`
      });
    }
  }
  
  return shuffle(problems);
}

// ==================== LEVEL 2: GROUPING (TENS AND ONES) ====================
function generateGroupingProblems() {
  let problems = [];
  
  for (let i = 0; i < 13; i++) {
    let tens = rnd(1, 5);
    let ones = rnd(0, 9);
    let num = tens * 10 + ones;
    
    if (i < 7) {
      // Ask for tens
      problems.push({
        type: 'grouping_tens',
        question: `The number ${num} has how many groups of TENS?`,
        answer: tens,
        hint: `Let's figure out the tens in ${num}! 📦

What are we trying to do? We need to find how many groups of ten are in ${num}.

Step 1: Think of ${num} as tens and ones.
Step 2: The first digit tells us the tens: ${num} has ${tens} tens and ${ones} ones.
Step 3: So ${num} = ${tens} tens + ${ones} ones.

The number of TENS is ${tens}! ✅`,
        explanation: `${num} has ${tens} tens and ${ones} ones`
      });
    } else {
      // Ask for ones
      problems.push({
        type: 'grouping_ones',
        question: `The number ${num} has how many ONES?`,
        answer: ones,
        hint: `Let's figure out the ones in ${num}! 🔢

What are we trying to do? We need to find how many single ones are in ${num}.

Step 1: Think of ${num} as tens and ones.
Step 2: The last digit tells us the ones: ${num} has ${tens} tens and ${ones} ones.
Step 3: So ${num} = ${tens} tens + ${ones} ones.

The number of ONES is ${ones}! ✅`,
        explanation: `${num} has ${tens} tens and ${ones} ones`
      });
    }
  }
  
  return shuffle(problems);
}

// ==================== LEVEL 3: MISSING NUMBER ====================
function generateMissingAddProblems() {
  let problems = [];
  
  for (let i = 0; i < 13; i++) {
    if (i % 3 === 0) {
      // Two-number missing
      let total = rnd(8, 20);
      let known = rnd(2, total - 2);
      let missing = total - known;
      
      problems.push({
        type: 'missing_two',
        question: `${total} = ${known} + ?`,
        answer: missing,
        hint: `Let's figure this out together! 🤔

We have the equation: ${total} = ${known} + ?

What are we trying to do? We need to find the missing number (?) that we add to ${known} to get ${total}.

Step 1: We know one of the numbers is ${known}.
Step 2: To find the missing number, we subtract the number we know from the total:
   ${total} - ${known} = ?

Step 3: ${total} - ${known} = ${missing}

So the missing number is ${missing}! Let's check: ${known} + ${missing} = ${total} ✅`,
        explanation: `${total} - ${known} = ${missing}`
      });
    } else {
      // Three-number missing
      let total = rnd(12, 25);
      let a = rnd(2, 7);
      let b = rnd(2, 7);
      let missing = total - a - b;
      
      if (missing < 1 || missing > 15) {
        i--;
        continue;
      }
      
      problems.push({
        type: 'missing_three',
        question: `${total} = ${a} + ${b} + ?`,
        answer: missing,
        hint: `Let's solve this step by step! 🧩

We have: ${total} = ${a} + ${b} + ?

What does this mean? When we add three numbers (${a}, ${b}, and the mystery number ?), we get ${total}.

Step 1: First, add the two numbers we know:
   ${a} + ${b} = ${a + b}

Step 2: Now we know that ${a + b} + ? = ${total}
   To find the mystery number, subtract what we have from the total:
   ${total} - ${a + b} = ?

Step 3: ${total} - ${a + b} = ${missing}

The missing number is ${missing}! 
Check: ${a} + ${b} + ${missing} = ${total} ✅`,
        explanation: `${total} - ${a} - ${b} = ${missing}`
      });
    }
  }
  
  return shuffle(problems);
}

// ==================== LEVEL 4: CARRY ADDITION (up to 20) ====================
function generateCarryAddProblems() {
  let problems = [];
  
  for (let i = 0; i < 13; i++) {
    // Generate numbers where ones add to 10 or more (carry)
    let a, b;
    do {
      a = rnd(5, 15);
      b = rnd(5, 15);
    } while ((a % 10) + (b % 10) < 10 || a + b > 20);
    
    let onesA = a % 10;
    let onesB = b % 10;
    let tensA = Math.floor(a / 10);
    let tensB = Math.floor(b / 10);
    let onesSum = onesA + onesB;
    let carry = Math.floor(onesSum / 10);
    let onesDigit = onesSum % 10;
    let tensSum = tensA + tensB + carry;
    let answer = a + b;
    
    problems.push({
      type: 'carry_add',
      question: `${a} + ${b} = ?`,
      answer: answer,
      a: a,
      b: b,
      hint: `Let's add with carrying! 🧮

We have: ${a} + ${b}

Step 1: Add the ones digits first:
   ${a} has ${onesA} ones, ${b} has ${onesB} ones
   ${onesA} + ${onesB} = ${onesSum}
   ${onesSum} is 10 or more, so we need to carry!

Step 2: Write down ${onesDigit} in the ones place and carry ${carry} to the tens place.

Step 3: Add the tens digits plus the carry:
   ${a} has ${tensA} ten, ${b} has ${tensB} ten
   ${tensA} + ${tensB} + ${carry} (carry) = ${tensSum}

Step 4: Put it together: ${tensSum} tens and ${onesDigit} ones = ${answer}

So ${a} + ${b} = ${answer}! ✅`,
      explanation: `${a} + ${b} = ${answer}`
    });
  }
  
  return shuffle(problems);
}

// ==================== LEVEL 5: BORROW SUBTRACTION (up to 20) ====================
function generateBorrowSubProblems() {
  let problems = [];
  
  for (let i = 0; i < 13; i++) {
    // Generate numbers where ones need to borrow
    let a, b;
    do {
      a = rnd(11, 20);
      b = rnd(6, a - 1);
    } while ((a % 10) >= (b % 10) || a - b < 2);
    
    let onesA = a % 10;
    let onesB = b % 10;
    let tensA = Math.floor(a / 10);
    let tensB = Math.floor(b / 10);
    
    // After borrowing
    let borrowedOnes = onesA + 10;
    let onesResult = borrowedOnes - onesB;
    let borrowedTens = tensA - 1;
    let tensResult = borrowedTens - tensB;
    let answer = a - b;
    
    problems.push({
      type: 'borrow_sub',
      question: `${a} - ${b} = ?`,
      answer: answer,
      a: a,
      b: b,
      hint: `Let's subtract with borrowing! 🧮

We have: ${a} - ${b}

Step 1: Look at the ones place:
   ${a} has ${onesA} ones, ${b} has ${onesB} ones
   ${onesA} is less than ${onesB}, so we need to borrow from the tens!

Step 2: Borrow 1 ten from the tens place:
   The tens place of ${a} is ${tensA}, so we borrow 1 ten (which is 10 ones).
   Now we have ${tensA - 1} tens and ${onesA + 10} ones.

Step 3: Subtract the ones:
   ${onesA + 10} - ${onesB} = ${onesResult}

Step 4: Subtract the tens:
   ${tensA - 1} - ${tensB} = ${tensResult}

Step 5: Put it together: ${tensResult} tens and ${onesResult} ones = ${answer}

So ${a} - ${b} = ${answer}! ✅`,
      explanation: `${a} - ${b} = ${answer}`
    });
  }
  
  return shuffle(problems);
}

// ==================== LEVEL 6: ADD THREE NUMBERS (up to 90) ====================
function generateAddThreeProblems() {
  let problems = [];
  
  for (let i = 0; i < 13; i++) {
    let a = rnd(10, 30);
    let b = rnd(10, 30);
    let c = rnd(10, 30);
    let sum = a + b + c;
    
    if (sum > 90) {
      i--;
      continue;
    }
    
    problems.push({
      type: 'add_three',
      question: `${a} + ${b} + ${c} = ?`,
      answer: sum,
      a: a,
      b: b,
      c: c,
      hint: `Let's add three numbers step by step! 🔢

We have: ${a} + ${b} + ${c}

Step 1: Add the first two numbers:
   ${a} + ${b} = ${a + b}

Step 2: Now add the third number to that result:
   ${a + b} + ${c} = ?

Step 3: ${a + b} + ${c} = ${sum}

So ${a} + ${b} + ${c} = ${sum}! ✅

Remember: When adding three numbers, you can add them in any order - the answer will be the same!`,
      explanation: `${a} + ${b} + ${c} = ${sum}`
    });
  }
  
  return shuffle(problems);
}

// ==================== LEVEL 7: SUBTRACT THREE NUMBERS ====================
function generateSubThreeProblems() {
  let problems = [];
  
  for (let i = 0; i < 13; i++) {
    let total = rnd(50, 90);
    let b = rnd(10, 30);
    let c = rnd(10, 30);
    let result = total - b - c;
    
    if (result < 5) {
      i--;
      continue;
    }
    
    problems.push({
      type: 'sub_three',
      question: `${total} - ${b} - ${c} = ?`,
      answer: result,
      total: total,
      b: b,
      c: c,
      hint: `Let's subtract two numbers from a big number! 🔢

We have: ${total} - ${b} - ${c}

Step 1: First, subtract the first number:
   ${total} - ${b} = ${total - b}

Step 2: Now subtract the second number from that result:
   ${total - b} - ${c} = ?

Step 3: ${total - b} - ${c} = ${result}

So ${total} - ${b} - ${c} = ${result}! ✅

Think of it as: start with ${total}, take away ${b}, then take away ${c} more.`,
      explanation: `${total} - ${b} - ${c} = ${result}`
    });
  }
  
  return shuffle(problems);
}

// ==================== LEVEL 8: GRAND FINALE (MIX) ====================
function generateComboProblems() {
  let problems = [];
  
  // Mix problems from all levels
  let countingProblems = generateCountingProblems().slice(0, 2);
  let groupingProblems = generateGroupingProblems().slice(0, 2);
  let missingProblems = generateMissingAddProblems().slice(0, 2);
  let carryProblems = generateCarryAddProblems().slice(0, 2);
  let borrowProblems = generateBorrowSubProblems().slice(0, 2);
  let addThreeProblems = generateAddThreeProblems().slice(0, 2);
  let subThreeProblems = generateSubThreeProblems().slice(0, 1);
  
  problems = [
    ...countingProblems,
    ...groupingProblems,
    ...missingProblems,
    ...carryProblems,
    ...borrowProblems,
    ...addThreeProblems,
    ...subThreeProblems
  ];
  
  return shuffle(problems).slice(0, 13);
}

// ==================== RENDER HOME SCREEN ====================
function renderHome() {
  const grid = document.getElementById('levelsGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  
  LEVELS.forEach(level => {
    const levelData = progress[level.id] || { completed: false, score: 0 };
    const stars = levelData.completed ? (levelData.score >= 90 ? '⭐⭐⭐' : levelData.score >= 70 ? '⭐⭐' : '⭐') : '';
    
    const btn = document.createElement('div');
    btn.className = 'level-btn';
    btn.innerHTML = `
      <div class="level-icon">${level.icon}</div>
      <div class="level-name">${level.name}</div>
      <div class="level-desc">${level.desc}</div>
      <div class="level-stars">${stars}</div>
    `;
    btn.onclick = () => startLevel(level);
    grid.appendChild(btn);
  });
  
  updateProgressStats();
}

function updateProgressStats() {
  let mastered = 0;
  LEVELS.forEach(level => {
    if (progress[level.id]?.completed) mastered++;
  });
  const total = LEVELS.length;
  const pct = Math.round((mastered / total) * 100) || 0;
  
  document.getElementById('progressStats').innerHTML = `${mastered} of ${total} levels mastered (${pct}%)`;
  document.getElementById('progressBarFill').style.width = pct + '%';
  document.getElementById('progressLabel').innerHTML = `${mastered}/${total} mastered`;
}

// ==================== START LEVEL ====================
function startLevel(level) {
  currentLevel = level;
  
  // Generate problems based on level
  if (level.id === 'counting') questions = generateCountingProblems();
  else if (level.id === 'grouping') questions = generateGroupingProblems();
  else if (level.id === 'missing_add') questions = generateMissingAddProblems();
  else if (level.id === 'carry_add') questions = generateCarryAddProblems();
  else if (level.id === 'borrow_sub') questions = generateBorrowSubProblems();
  else if (level.id === 'add_three') questions = generateAddThreeProblems();
  else if (level.id === 'sub_three') questions = generateSubThreeProblems();
  else if (level.id === 'combo') questions = generateComboProblems();
  
  qIndex = 0;
  score = 0;
  wrong = 0;
  mistakes = [];
  hintsUsed = 0;
  answered = false;
  
  document.getElementById('quizLevelLabel').innerHTML = `${level.icon} ${level.name}`;
  
  showScreen('quizScreen');
  renderQuestion();
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function goHome() {
  if (confirm('Leave this level? Progress won\'t be saved.')) {
    renderHome();
    showScreen('homeScreen');
  }
}

// ==================== RENDER QUESTION ====================
function renderQuestion() {
  const q = questions[qIndex];
  const total = questions.length;
  
  document.getElementById('quizQCounter').innerHTML = `Q${qIndex + 1}/${total}`;
  document.getElementById('scoreCorrect').innerHTML = score;
  document.getElementById('scoreWrong').innerHTML = wrong;
  const att = score + wrong;
  document.getElementById('scorePercent').innerHTML = att ? Math.round((score / att) * 100) + '%' : '—';
  document.getElementById('quizProgressBar').style.width = (qIndex / total * 100) + '%';
  
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('checkButton').style.display = 'inline-flex';
  document.getElementById('nextButton').style.display = 'none';
  
  const hintAllowed = qIndex < 4 && hintsUsed < 2;
  document.getElementById('hintButton').style.display = hintAllowed ? 'inline-flex' : 'none';
  document.getElementById('hintButton').disabled = false;
  
  answered = false;
  
  // Build question card
  let typeLabel = '';
  if (q.type.includes('counting')) typeLabel = '🔢 Counting';
  else if (q.type.includes('grouping')) typeLabel = '📦 Tens and Ones';
  else if (q.type.includes('missing')) typeLabel = '❓ Missing Number';
  else if (q.type.includes('carry')) typeLabel = '➕ Carry Addition';
  else if (q.type.includes('borrow')) typeLabel = '➖ Borrow Subtraction';
  else if (q.type.includes('add_three')) typeLabel = '🔺 Add Three Numbers';
  else if (q.type.includes('sub_three')) typeLabel = '🔻 Subtract Three Numbers';
  else typeLabel = '🧮 Math';
  
  let html = `
    <div class="q-type-badge">${typeLabel}</div>
    <div class="question-text">${q.question}</div>
  `;
  
  // Add equation display for non-word problems
  if (!q.type.includes('grouping')) {
    html += `<div class="equation-display">${q.question.replace('?', '<span class="eq-blank">?</span>')}</div>`;
  }
  
  // Add step-by-step hint box (initially hidden)
  html += `
    <div class="step-hint" id="hintDisplay" style="display:none;">
      ${q.hint || '💡 Think carefully about what the problem is asking!'}
    </div>
  `;
  
  // Add answer input
  html += `<input class="answer-input" id="answerInput" type="number" inputmode="numeric" placeholder="Type answer..." autocomplete="off">`;
  
  document.getElementById('questionCard').innerHTML = html;
  document.getElementById('answerInput')?.focus();
}

// ==================== SHOW HINT ====================
function showHint() {
  if (!questions[qIndex]) return;
  hintsUsed++;
  document.getElementById('hintDisplay').style.display = 'block';
  document.getElementById('hintButton').disabled = true;
}

// ==================== CHECK ANSWER ====================
function checkAnswer() {
  if (answered) return;
  
  const q = questions[qIndex];
  const input = document.getElementById('answerInput');
  if (!input) return;
  
  const val = parseInt(input.value);
  if (isNaN(val)) {
    alert('Please enter a number!');
    return;
  }
  
  answered = true;
  const isCorrect = (val === q.answer);
  
  if (isCorrect) {
    score++;
    document.getElementById('feedback').className = 'feedback show ok';
    document.getElementById('feedback').innerHTML = '✅ Correct! ' + (q.explanation || '');
  } else {
    wrong++;
    mistakes.push({
      question: q.question,
      yourAnswer: val,
      correct: q.answer,
      explanation: q.explanation || `The correct answer is ${q.answer}`
    });
    document.getElementById('feedback').className = 'feedback show bad';
    document.getElementById('feedback').innerHTML = `❌ Your answer ${val} is wrong. Correct: ${q.answer}.<br>${q.explanation || ''}`;
  }
  
  document.getElementById('scoreCorrect').innerHTML = score;
  document.getElementById('scoreWrong').innerHTML = wrong;
  const att = score + wrong;
  document.getElementById('scorePercent').innerHTML = att ? Math.round((score / att) * 100) + '%' : '—';
  
  document.getElementById('checkButton').style.display = 'none';
  document.getElementById('nextButton').style.display = 'inline-flex';
  document.getElementById('hintButton').style.display = 'none';
}

// ==================== NEXT QUESTION ====================
function nextQuestion() {
  qIndex++;
  if (qIndex >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

// ==================== SHOW RESULTS ====================
function showResults() {
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  const passed = pct >= 70;
  
  if (passed) {
    progress[currentLevel.id] = {
      completed: true,
      score: pct
    };
  }
  
  document.getElementById('resultEmoji').innerHTML = pct >= 90 ? '🏆' : pct >= 70 ? '🌟' : '💪';
  document.getElementById('resultTitle').innerHTML = pct >= 90 ? 'Amazing!' : pct >= 70 ? 'Good job!' : 'Keep practicing!';
  document.getElementById('resultPercent').innerHTML = pct + '%';
  document.getElementById('resultStars').innerHTML = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : '⭐';
  document.getElementById('resultMessage').innerHTML = `You got ${score} out of ${total} correct.`;
  
  // Show mistakes
  let mistakesHtml = '';
  if (mistakes.length > 0) {
    mistakesHtml = '<h3 style="color:#ffb3b3; margin:15px 0 8px;">📝 Review mistakes:</h3>';
    mistakes.forEach(m => {
      mistakesHtml += `
        <div class="mistake-item">
          <strong>${m.question}</strong><br>
          Your answer: ${m.yourAnswer} ❌ Correct: ${m.correct}<br>
          <small>${m.explanation || ''}</small>
        </div>
      `;
    });
  }
  document.getElementById('mistakesList').innerHTML = mistakesHtml;
  
  document.getElementById('retryButton').onclick = () => startLevel(currentLevel);
  
  // Next level button
  const levelIndex = LEVELS.findIndex(l => l.id === currentLevel.id);
  if (passed && levelIndex < LEVELS.length - 1) {
    document.getElementById('nextLevelButton').style.display = 'inline-flex';
    document.getElementById('nextLevelButton').onclick = () => startLevel(LEVELS[levelIndex + 1]);
  } else {
    document.getElementById('nextLevelButton').style.display = 'none';
  }
  
  renderHome();
  showScreen('resultScreen');
}

// ==================== SAVE/LOAD ====================
function saveProgress() {
  const data = JSON.stringify({ version: 1, progress: progress }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'math-adventure-save.json';
  a.click();
  alert('Progress saved!');
}

function loadProgress() {
  document.getElementById('loadFile').click();
}

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data && data.version === 1 && data.progress) {
        progress = data.progress;
        renderHome();
        alert('Progress loaded!');
      } else {
        alert('Invalid save file');
      }
    } catch (err) {
      alert('Error loading file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ==================== INITIALIZE ====================
renderHome();
</script>
</body>
</html>
