<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Math Adventure - Dark Mode (fixed)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --bg-dark: #0a0718;
    --card-dark: #1a1530;
    --text-light: #f0ebff;
    --text-soft: #cdc2f0;
    --sky: #6EC6F5;
    --sun: #FFD93D;
    --grass: #6BCB77;
    --coral: #FF6B6B;
    --purple: #C77DFF;
    --border-glow: #433b6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg-dark);
    min-height: 100vh;
    color: var(--text-light);
    padding: 16px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  /* Top bar */
  .topbar {
    background: #1f1a33;
    border-radius: 20px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    border: 1px solid #41386b;
    box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    position: sticky;
    top: 8px;
    z-index: 100;
    backdrop-filter: blur(5px);
  }
  
  .topbar-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--sun);
    text-shadow: 0 0 8px #b8860b;
  }
  
  .topbar-btns {
    display: flex;
    gap: 10px;
  }
  
  .tb-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 30px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform 0.1s;
  }
  
  .tb-btn:hover {
    transform: scale(1.05);
  }
  
  .tb-save {
    background: var(--sun);
    color: #1a0f2a;
  }
  
  .tb-load {
    background: var(--grass);
    color: #0f0a1a;
  }
  
  .tb-lbl {
    font-size: 0.75rem;
    color: #b1a5d9;
  }

  /* Screens */
  .screen {
    display: none;
  }
  
  .screen.active {
    display: block;
  }

  /* Home screen */
  .home-hero {
    text-align: center;
    padding: 20px 0 10px;
  }
  
  .home-hero h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.4rem;
    background: linear-gradient(135deg, var(--sun), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px #9f7aea;
  }
  
  .home-hero p {
    color: var(--text-soft);
    font-size: 1rem;
    margin-top: 8px;
  }

  /* Level grid - FIXED: now visible */
  .levels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    margin-top: 24px;
  }

  .level-btn {
    background: var(--card-dark);
    border: 2px solid #3d3460;
    border-radius: 24px;
    padding: 20px 10px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    transition: transform 0.15s, border-color 0.15s;
  }
  
  .level-btn:hover {
    transform: translateY(-5px);
    border-color: var(--purple);
  }
  
  .level-icon {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }
  
  .level-name {
    font-weight: 800;
    font-size: 1rem;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  
  .level-stars {
    color: var(--sun);
    font-size: 0.9rem;
  }

  /* Progress chart */
  .progress-chart {
    background: #1e1932;
    border-radius: 20px;
    padding: 20px;
    margin-top: 30px;
    border: 1px solid #4f4377;
  }
  
  .progress-bar-cont {
    background: #2f274a;
    border-radius: 12px;
    height: 24px;
    margin: 12px 0 8px;
  }
  
  .progress-bar-fill {
    height: 100%;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--purple), var(--sky));
    width: 0%;
    transition: width 0.4s;
  }

  /* Quiz screen */
  .quiz-head {
    background: #1e1932;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid #5a4c82;
  }
  
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    color: #b7a9e6;
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  
  .quiz-score-row {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  
  .qs-item {
    text-align: center;
    flex: 1;
  }
  
  .qs-label {
    font-size: 0.7rem;
    color: #aea0d9;
  }
  
  .qs-val {
    font-size: 1.5rem;
    font-weight: 900;
    color: white;
  }
  
  .prog-bar {
    background: #2f274a;
    border-radius: 8px;
    height: 10px;
  }
  
  .prog-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--purple), var(--sky));
    transition: width 0.4s;
  }

  /* Question card */
  .q-card {
    background: var(--card-dark);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid #5b4d87;
    border-top: 6px solid var(--purple);
  }
  
  .q-type-badge {
    display: inline-block;
    background: #362d55;
    color: #e4d2ff;
    border-radius: 30px;
    padding: 4px 14px;
    font-size: 0.75rem;
    font-weight: 800;
    margin-bottom: 12px;
  }
  
  .question-text {
    font-size: 1.3rem;
    font-weight: 700;
    color: white;
    margin-bottom: 16px;
  }
  
  .equation-display {
    font-family: 'Fredoka One', cursive;
    font-size: 2.5rem;
    text-align: center;
    color: var(--sun);
    margin: 16px 0;
  }
  
  .eq-blank {
    border-bottom: 4px solid var(--coral);
    color: var(--coral);
    min-width: 50px;
    display: inline-block;
  }

  /* Hints */
  .mini-lesson {
    background: #2d2447;
    border-left: 8px solid var(--purple);
    border-radius: 16px;
    padding: 16px;
    margin: 16px 0;
    font-weight: 700;
    color: #e5d5ff;
  }
  
  .step-hint {
    background: #1e2f47;
    border: 2px solid var(--sky);
    border-radius: 40px;
    padding: 14px;
    text-align: center;
    font-weight: 800;
    color: #b3e0ff;
  }
  
  .finger-helper {
    background: #3a2e3a;
    border: 3px dashed var(--sun);
    border-radius: 30px;
    padding: 16px;
    text-align: center;
    font-weight: 700;
    color: #ffe6b3;
  }

  .answer-input {
    width: 100%;
    padding: 16px;
    font-size: 2rem;
    font-family: 'Fredoka One', cursive;
    background: #1f1937;
    border: 3px solid #4e4280;
    border-radius: 16px;
    color: var(--sun);
    text-align: center;
    margin: 12px 0;
  }
  
  .answer-input:focus {
    border-color: var(--purple);
    outline: none;
  }

  .feedback {
    border-radius: 12px;
    padding: 14px;
    margin: 10px 0;
    font-weight: 700;
    display: none;
  }
  
  .feedback.show { display: block; }
  .feedback.ok { background: #1d4a2a; color: #c3f0c3; border: 2px solid var(--grass); }
  .feedback.bad { background: #5a2e36; color: #ffcfcf; border: 2px solid var(--coral); }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  
  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 30px;
    font-family: 'Fredoka One', cursive;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.1s;
  }
  
  .btn:hover { transform: translateY(-2px); }
  .btn-check { background: var(--purple); color: white; flex: 1; }
  .btn-next { background: var(--grass); color: #0f0a1a; flex: 1; display: none; }
  .btn-hint { background: var(--sun); color: #1a0f2a; }
  .btn-back { background: #3a3260; color: white; }

  /* Result screen */
  .result-card {
    background: #1e1932;
    border-radius: 28px;
    padding: 28px;
    text-align: center;
    border: 2px solid #6b5b99;
  }
  
  .result-emoji { font-size: 4rem; }
  .result-title { font-size: 2rem; color: var(--sun); }
  .result-pct { font-size: 3rem; font-weight: 900; color: white; }
  .result-stars { font-size: 2rem; color: var(--sun); margin: 10px 0; }

  .mistake-item {
    background: #2f253a;
    border: 2px solid #c45d5d;
    border-radius: 12px;
    padding: 12px;
    margin: 10px 0;
    text-align: left;
  }
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <div class="topbar-title">🌟 Math Adventure (dark)</div>
  <div class="topbar-btns">
    <button class="tb-btn tb-save" onclick="saveProgress()">💾 Save</button>
    <button class="tb-btn tb-load" onclick="loadProgress()">📂 Load</button>
    <input type="file" id="loadFile" accept=".json" style="display:none" onchange="loadFile(event)">
  </div>
  <div class="tb-lbl" id="progressLabel">0/11 mastered</div>
</div>

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen active">
  <div class="home-hero">
    <h1>Math Adventure!</h1>
    <p>Pick a level · 13 problems + 5 word puzzles</p>
  </div>
  
  <!-- LEVELS GRID - FIXED: now visible -->
  <div class="levels-grid" id="levelsGrid"></div>
  
  <div class="progress-chart" id="progressChart">
    <h3 style="color:#d4c2ff; margin-bottom:10px;">📊 Your Progress</h3>
    <div id="progressStats">0 of 11 levels mastered (0%)</div>
    <div class="progress-bar-cont"><div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div></div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="quizScreen" class="screen">
  <div class="quiz-head">
    <div class="quiz-meta">
      <span id="quizLevelLabel">Level 1</span>
      <span id="quizQCounter">Q1 / 18</span>
    </div>
    <div class="quiz-score-row">
      <div class="qs-item"><div class="qs-label">✅</div><div class="qs-val" id="scoreCorrect">0</div></div>
      <div class="qs-item"><div class="qs-label">❌</div><div class="qs-val" id="scoreWrong">0</div></div>
      <div class="qs-item"><div class="qs-label">%</div><div class="qs-val" id="scorePercent">—</div></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="quizProgressBar" style="width:0%"></div></div>
  </div>
  
  <div class="q-card" id="questionCard"></div>
  <div class="feedback" id="feedback"></div>
  
  <div class="btn-row">
    <button class="btn btn-back" onclick="goHome()">🏠 Home</button>
    <button class="btn btn-hint" id="hintButton" onclick="showHint()">💡 Hint</button>
    <button class="btn btn-check" id="checkButton" onclick="checkAnswer()">✅ Check</button>
    <button class="btn btn-next" id="nextButton" onclick="nextQuestion()">▶ Next</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen" class="screen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title" id="resultTitle">Great job!</div>
    <div class="result-pct" id="resultPercent">0%</div>
    <div class="result-stars" id="resultStars">⭐⭐⭐</div>
    <div id="resultMessage"></div>
    <div id="mistakesList"></div>
    <div class="btn-row" style="justify-content:center; margin-top:20px;">
      <button class="btn btn-back" id="retryButton">🔁 Try Again</button>
      <button class="btn btn-check" onclick="goHome()">🏠 Home</button>
      <button class="btn btn-next" id="nextLevelButton" style="display:none">➡️ Next Level</button>
    </div>
  </div>
</div>

</div>

<script>
// ==================== MATH ADVENTURE DATA ====================
const LEVELS = [
  { id: 'counting', name: 'Counting', icon: '🔢', color: '#6EC6F5', level: 1 },
  { id: 'grouping', name: 'Tens & Ones', icon: '📦', color: '#FFD93D', level: 1 },
  { id: 'missing_add', name: 'Missing Number', icon: '❓', color: '#C77DFF', level: 1 },
  { id: 'simple_sub', name: 'Quick Sub', icon: '✂️', color: '#FF6B6B', level: 1 },
  { id: 'find_pair', name: 'Find the Pair', icon: '👫', color: '#6BCB77', level: 1 },
  { id: 'take_two', name: 'Take Away Two', icon: '✌️', color: '#FF9F43', level: 1 },
  { id: 'carry_add', name: 'Carry Addition', icon: '➕', color: '#48dbfb', level: 1 },
  { id: 'borrow_sub', name: 'Borrow Sub', icon: '➖', color: '#ff6b81', level: 1 },
  { id: 'add_three', name: 'Add Three', icon: '🔺', color: '#A29BFE', level: 1 },
  { id: 'sub_two_big', name: 'Subtract Two', icon: '🔻', color: '#fd79a8', level: 1 },
  { id: 'combo', name: 'Grand Finale', icon: '🏆', color: '#F9CA24', level: 1 }
];

// Progress tracking
let progress = {};
let currentLevel = null;
let questions = [];
let qIndex = 0;
let score = 0;
let wrong = 0;
let mistakes = [];
let hintsUsed = 0;
let answered = false;
let currentAnswer = null;

// Initialize progress
LEVELS.forEach(level => {
  if (!progress[level.id]) {
    progress[level.id] = { completed: false, score: 0 };
  }
});

// ==================== HELPER FUNCTIONS ====================
function rnd(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// ==================== PROBLEM GENERATORS ====================
function generateCountingProblems() {
  let problems = [];
  for (let i = 0; i < 13; i++) {
    if (i % 2 === 0) {
      let a = rnd(5, 15);
      let b = rnd(1, 5);
      problems.push({
        type: 'counting_add',
        question: `${a} + ${b} = ?`,
        answer: a + b,
        hint: `Count up from ${a}: ${a+1}, ${a+2}... (${b} times)`,
        explanation: `${a} + ${b} = ${a+b}`
      });
    } else {
      let a = rnd(8, 18);
      let b = rnd(2, 6);
      problems.push({
        type: 'counting_sub',
        question: `${a} - ${b} = ?`,
        answer: a - b,
        hint: `Count down from ${a}: ${a-1}, ${a-2}... (${b} times)`,
        explanation: `${a} - ${b} = ${a-b}`
      });
    }
  }
  return problems;
}

function generateWordProblems() {
  return [
    { type: 'word', question: 'Sara has 8 apples. Mom gives her 5 more. How many apples now?', answer: 13, hint: 'Add 8 + 5', explanation: '8 + 5 = 13' },
    { type: 'word', question: '14 birds on a tree. 6 fly away. How many left?', answer: 8, hint: 'Subtract 14 - 6', explanation: '14 - 6 = 8' },
    { type: 'word', question: 'Tom had 9 crayons. He got 7 more. How many now?', answer: 16, hint: '9 + 7 = ?', explanation: '9 + 7 = 16' },
    { type: 'word', question: 'Lily had 15 stickers. She gave 8 away. How many left?', answer: 7, hint: '15 - 8 = ?', explanation: '15 - 8 = 7' },
    { type: 'word', question: '11 fish in a pond. 4 more swim in. How many now?', answer: 15, hint: '11 + 4 = ?', explanation: '11 + 4 = 15' }
  ];
}

// ==================== RENDER HOME SCREEN (FIXED) ====================
function renderHome() {
  const grid = document.getElementById('levelsGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  
  LEVELS.forEach(level => {
    const levelData = progress[level.id] || { completed: false, score: 0 };
    const stars = levelData.completed ? (levelData.score >= 90 ? '⭐⭐⭐' : levelData.score >= 70 ? '⭐⭐' : '⭐') : '';
    
    const btn = document.createElement('div');
    btn.className = 'level-btn';
    btn.innerHTML = `
      <div class="level-icon">${level.icon}</div>
      <div class="level-name">${level.name}</div>
      <div class="level-stars">${stars}</div>
    `;
    btn.onclick = () => startLevel(level);
    grid.appendChild(btn);
  });
  
  updateProgressStats();
}

function updateProgressStats() {
  let mastered = 0;
  LEVELS.forEach(level => {
    if (progress[level.id]?.completed) mastered++;
  });
  const total = LEVELS.length;
  const pct = Math.round((mastered / total) * 100) || 0;
  
  document.getElementById('progressStats').innerHTML = `${mastered} of ${total} levels mastered (${pct}%)`;
  document.getElementById('progressBarFill').style.width = pct + '%';
  document.getElementById('progressLabel').innerHTML = `${mastered}/${total} mastered`;
}

// ==================== START LEVEL ====================
function startLevel(level) {
  currentLevel = level;
  
  // Generate 13 math problems + 5 word problems
  const mathProblems = generateCountingProblems(); // Using counting as base for now
  const wordProblems = generateWordProblems();
  questions = [...mathProblems, ...wordProblems];
  
  qIndex = 0;
  score = 0;
  wrong = 0;
  mistakes = [];
  hintsUsed = 0;
  answered = false;
  
  document.getElementById('quizLevelLabel').innerHTML = `${level.icon} ${level.name}`;
  
  showScreen('quizScreen');
  renderQuestion();
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function goHome() {
  if (confirm('Leave this level? Progress won\'t be saved.')) {
    renderHome();
    showScreen('homeScreen');
  }
}

// ==================== RENDER QUESTION ====================
function renderQuestion() {
  const q = questions[qIndex];
  const total = questions.length;
  
  document.getElementById('quizQCounter').innerHTML = `Q${qIndex + 1}/${total}`;
  document.getElementById('scoreCorrect').innerHTML = score;
  document.getElementById('scoreWrong').innerHTML = wrong;
  const att = score + wrong;
  document.getElementById('scorePercent').innerHTML = att ? Math.round((score / att) * 100) + '%' : '—';
  document.getElementById('quizProgressBar').style.width = (qIndex / total * 100) + '%';
  
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('checkButton').style.display = 'inline-flex';
  document.getElementById('nextButton').style.display = 'none';
  
  const hintAllowed = qIndex < 4 && hintsUsed < 2 && q.type !== 'word';
  document.getElementById('hintButton').style.display = hintAllowed ? 'inline-flex' : 'none';
  document.getElementById('hintButton').disabled = false;
  
  answered = false;
  
  // Build question card
  let html = '';
  if (q.type === 'word') {
    html = `
      <div class="q-type-badge">📖 Word Problem</div>
      <div class="question-text">${q.question}</div>
    `;
  } else {
    html = `
      <div class="q-type-badge">🧮 Math</div>
      <div class="question-text">${q.question}</div>
      <div class="equation-display">${q.question.replace('?', '<span class="eq-blank">?</span>')}</div>
    `;
  }
  
  // Add hint box
  html += `<div class="mini-lesson" id="hintDisplay" style="display:none">💡 ${q.hint || ''}</div>`;
  
  // Add answer input
  html += `<input class="answer-input" id="answerInput" type="number" inputmode="numeric" placeholder="Type answer..." autocomplete="off">`;
  
  document.getElementById('questionCard').innerHTML = html;
  document.getElementById('answerInput')?.focus();
}

// ==================== SHOW HINT ====================
function showHint() {
  if (!questions[qIndex]) return;
  hintsUsed++;
  document.getElementById('hintDisplay').style.display = 'block';
  document.getElementById('hintButton').disabled = true;
}

// ==================== CHECK ANSWER ====================
function checkAnswer() {
  if (answered) return;
  
  const q = questions[qIndex];
  const input = document.getElementById('answerInput');
  if (!input) return;
  
  const val = parseInt(input.value);
  if (isNaN(val)) {
    alert('Please enter a number!');
    return;
  }
  
  answered = true;
  const isCorrect = (val === q.answer);
  
  if (isCorrect) {
    score++;
    document.getElementById('feedback').className = 'feedback show ok';
    document.getElementById('feedback').innerHTML = '✅ Correct! ' + (q.explanation || '');
  } else {
    wrong++;
    mistakes.push({
      question: q.question,
      yourAnswer: val,
      correct: q.answer,
      explanation: q.explanation
    });
    document.getElementById('feedback').className = 'feedback show bad';
    document.getElementById('feedback').innerHTML = `❌ Your answer ${val} is wrong. Correct: ${q.answer}.<br>${q.explanation || ''}`;
  }
  
  document.getElementById('scoreCorrect').innerHTML = score;
  document.getElementById('scoreWrong').innerHTML = wrong;
  const att = score + wrong;
  document.getElementById('scorePercent').innerHTML = att ? Math.round((score / att) * 100) + '%' : '—';
  
  document.getElementById('checkButton').style.display = 'none';
  document.getElementById('nextButton').style.display = 'inline-flex';
  document.getElementById('hintButton').style.display = 'none';
}

// ==================== NEXT QUESTION ====================
function nextQuestion() {
  qIndex++;
  if (qIndex >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

// ==================== SHOW RESULTS ====================
function showResults() {
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  const passed = pct >= 70;
  
  if (passed) {
    progress[currentLevel.id] = {
      completed: true,
      score: pct
    };
  }
  
  document.getElementById('resultEmoji').innerHTML = pct >= 90 ? '🏆' : pct >= 70 ? '🌟' : '💪';
  document.getElementById('resultTitle').innerHTML = pct >= 90 ? 'Amazing!' : pct >= 70 ? 'Good job!' : 'Keep practicing!';
  document.getElementById('resultPercent').innerHTML = pct + '%';
  document.getElementById('resultStars').innerHTML = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : '⭐';
  document.getElementById('resultMessage').innerHTML = `You got ${score} out of ${total} correct.`;
  
  // Show mistakes
  let mistakesHtml = '';
  if (mistakes.length > 0) {
    mistakesHtml = '<h3 style="color:#ffb3b3; margin:15px 0 8px;">📝 Review mistakes:</h3>';
    mistakes.forEach(m => {
      mistakesHtml += `
        <div class="mistake-item">
          <strong>${m.question}</strong><br>
          Your answer: ${m.yourAnswer} ❌ Correct: ${m.correct}<br>
          <small>${m.explanation || ''}</small>
        </div>
      `;
    });
  }
  document.getElementById('mistakesList').innerHTML = mistakesHtml;
  
  document.getElementById('retryButton').onclick = () => startLevel(currentLevel);
  
  // Next level button
  const levelIndex = LEVELS.findIndex(l => l.id === currentLevel.id);
  if (passed && levelIndex < LEVELS.length - 1) {
    document.getElementById('nextLevelButton').style.display = 'inline-flex';
    document.getElementById('nextLevelButton').onclick = () => startLevel(LEVELS[levelIndex + 1]);
  } else {
    document.getElementById('nextLevelButton').style.display = 'none';
  }
  
  renderHome();
  showScreen('resultScreen');
}

// ==================== SAVE/LOAD ====================
function saveProgress() {
  const data = JSON.stringify({ version: 1, progress: progress }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'math-adventure-save.json';
  a.click();
  alert('Progress saved!');
}

function loadProgress() {
  document.getElementById('loadFile').click();
}

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data && data.version === 1 && data.progress) {
        progress = data.progress;
        renderHome();
        alert('Progress loaded!');
      } else {
        alert('Invalid save file');
      }
    } catch (err) {
      alert('Error loading file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ==================== INITIALIZE ====================
renderHome();
</script>
