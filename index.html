<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>🌟 Safia's Math Adventure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: #0a0718; min-height: 100vh; color: #f0ebff; padding: 10px; }
  .wrap { max-width: 500px; margin: 0 auto; width: 100%; }

  .topbar { background: #1f1a33; border-radius: 40px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; border: 1px solid #41386b; }
  .topbar-title { font-family: 'Fredoka One', cursive; font-size: 1.1rem; color: #FFD93D; }
  .topbar-btns { display: flex; gap: 6px; }
  .tb-btn { padding: 6px 12px; border: none; border-radius: 30px; font-weight: 800; font-size: 0.75rem; cursor: pointer; color: #1a0f2a !important; -webkit-text-fill-color: #1a0f2a !important; background: #FFD93D; }
  .tb-btn.tb-load { background: #6BCB77; }
  .tb-lbl { font-size: 0.65rem; color: #b1a5d9; width: 100%; text-align: center; }

  .screen { display: none; }
  .screen.active { display: block; }

  .home-hero { text-align: center; padding: 15px 0 5px; }
  .home-hero h1 { font-family: 'Fredoka One', cursive; font-size: 1.8rem; background: linear-gradient(135deg, #FFD93D, #FF9FCF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .home-hero p { color: #b1a5d9; margin-top: 4px; font-size: 0.9rem; }

  .levels-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
  .level-btn { background: #1a1530; border: 2px solid #3d3460; border-radius: 20px; padding: 15px 5px; cursor: pointer; text-align: center; transition: border-color 0.2s; }
  .level-btn:hover { border-color: #C77DFF; }
  .level-icon { font-size: 2rem; margin-bottom: 5px; }
  .level-name { font-weight: 800; font-size: 0.85rem; color: #f0ebff; }
  .level-stars { color: #FFD93D; font-size: 0.8rem; min-height: 1.2em; }

  .progress-chart { background: #1e1932; border-radius: 20px; padding: 15px; margin-top: 20px; }
  .progress-bar-cont { background: #2f274a; border-radius: 10px; height: 16px; margin: 8px 0; }
  .progress-bar-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #C77DFF, #FF9FCF); width: 0%; transition: width 0.4s; }

  .quiz-head { background: #1e1932; border-radius: 20px; padding: 12px; margin-bottom: 12px; }
  .quiz-meta { display: flex; justify-content: space-between; color: #b7a9e6; font-size: 0.75rem; margin-bottom: 8px; }
  .quiz-score-row { display: flex; gap: 10px; margin-bottom: 8px; }
  .qs-item { text-align: center; flex: 1; background: #2f274a; border-radius: 30px; padding: 5px; }
  .qs-val { font-size: 1.2rem; font-weight: 900; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; }
  .prog-bar { background: #2f274a; border-radius: 8px; height: 8px; }
  .prog-fill { height: 100%; border-radius: 8px; background: linear-gradient(90deg, #C77DFF, #FF9FCF); transition: width 0.4s; }

  .section-banner { text-align: center; margin-bottom: 10px; min-height: 28px; }
  .section-divider { display: inline-block; font-size: 0.75rem; color: #9e8fc9; background: #2a2244; border-radius: 20px; padding: 5px 14px; }

  .q-card { background: #1a1530; border-radius: 20px; padding: 18px; margin-bottom: 12px; border-top: 5px solid #FF9FCF; }
  .q-card.word-card { border-top-color: #6BCB77; }
  .q-type-badge { display: inline-block; background: #362d55; color: #e4d2ff !important; -webkit-text-fill-color: #e4d2ff !important; border-radius: 30px; padding: 3px 10px; font-size: 0.65rem; font-weight: 800; margin-bottom: 8px; }
  .question-text { font-size: 1.1rem; font-weight: 800; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; margin-bottom: 15px; text-align: center; line-height: 1.55; }

  .answer-input { width: 100%; padding: 12px; font-size: 1.5rem; font-family: 'Fredoka One', cursive; background: #1f1937; border: 2px solid #4e4280; border-radius: 40px; color: #FFD93D !important; -webkit-text-fill-color: #FFD93D !important; text-align: center; margin: 10px 0; outline: none; }
  .answer-input:focus { border-color: #C77DFF; }

  .hint-box { background: #2d2447; border: 2px solid #C77DFF; border-radius: 16px; padding: 14px 16px; margin: 10px 0 0; display: none; font-size: 0.9rem; line-height: 1.6; }
  .hint-box.show { display: block; }
  .hint-col { background: #1e1737; border-radius: 10px; padding: 10px 16px; margin: 8px 0; font-family: 'Courier New', monospace; font-size: 1.05rem; color: #FFD93D !important; -webkit-text-fill-color: #FFD93D !important; line-height: 2; white-space: pre; display: inline-block; min-width: 80px; }
  .hint-table { background: #1e1737; border-radius: 10px; padding: 10px 16px; margin: 8px 0; display: inline-block; font-family: 'Courier New', monospace; font-size: 1.1rem; line-height: 2; }
  .hrow { display: flex; align-items: center; gap: 2px; }
  .hcell { min-width: 28px; text-align: center; color: #FFD93D !important; -webkit-text-fill-color: #FFD93D !important; padding: 0 4px; }
  .hdiv { color: #9e8fc9 !important; -webkit-text-fill-color: #9e8fc9 !important; font-size: 1.2rem; padding: 0 4px; }
  .hline .hcell { color: #9e8fc9 !important; -webkit-text-fill-color: #9e8fc9 !important; }
  .struck { text-decoration: line-through; opacity: 0.45; color: #ff9999 !important; -webkit-text-fill-color: #ff9999 !important; }
  .borrowed { color: #6BCB77 !important; -webkit-text-fill-color: #6BCB77 !important; font-weight: bold; }
  .hint-step { margin: 6px 0; color: #cdc2f0 !important; -webkit-text-fill-color: #cdc2f0 !important; }
  .hint-step strong { color: #FF9FCF !important; -webkit-text-fill-color: #FF9FCF !important; }
  .hint-answer { margin-top: 8px; font-family: 'Courier New', monospace; font-size: 1.05rem; font-weight: 800; color: #6BCB77 !important; -webkit-text-fill-color: #6BCB77 !important; white-space: pre; line-height: 2; }
  .hint-count { color: #FFD93D !important; -webkit-text-fill-color: #FFD93D !important; font-family: 'Courier New', monospace; font-size: 0.9rem; word-break: break-all; margin: 4px 0; }

  .feedback { border-radius: 40px; padding: 12px; margin: 8px 0; font-weight: 700; display: none; text-align: center; }
  .feedback.show { display: block; }
  .feedback.ok { background: #1d4a2a; color: #c3f0c3 !important; -webkit-text-fill-color: #c3f0c3 !important; }
  .feedback.bad { background: #5a2e36; color: #ffcfcf !important; -webkit-text-fill-color: #ffcfcf !important; }

  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn-home, .btn-hint, .btn-check, .btn-next, .btn-retry {
    border: none; border-radius: 40px; padding: 14px 0;
    font-family: 'Fredoka One', cursive; font-size: 1rem; font-weight: 800;
    cursor: pointer; flex: 1; text-align: center;
    -webkit-background-clip: unset !important; background-clip: unset !important;
  }
  .btn-home  { background: #3a3260; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; }
  .btn-hint  { background: #FFD93D; color: #1a0f2a !important; -webkit-text-fill-color: #1a0f2a !important; }
  .btn-check { background: #C77DFF; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; }
  .btn-next  { background: #6BCB77; color: #1a0f2a !important; -webkit-text-fill-color: #1a0f2a !important; display: none; }
  .btn-retry { background: #3a3260; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; }

  .result-card { background: #1e1932; border-radius: 30px; padding: 25px; text-align: center; border: 3px solid #FF9FCF; }
  .result-emoji { font-size: 3.5rem; }
  .result-title { font-size: 2rem; font-family: 'Fredoka One', cursive; color: #FF9FCF !important; -webkit-text-fill-color: #FF9FCF !important; margin: 8px 0; }
  .result-stars { font-size: 2rem; margin-bottom: 10px; }
  .encouragement { background: linear-gradient(135deg, #362d55, #4a3a6e); border-radius: 40px; padding: 15px; margin: 15px 0; font-size: 1.2rem; color: #FF9FCF !important; -webkit-text-fill-color: #FF9FCF !important; border: 2px solid #FF9FCF; }
  .result-message { color: #d4c2ff !important; -webkit-text-fill-color: #d4c2ff !important; margin-bottom: 10px; font-size: 1rem; }
  .mistake-item { background: #2f253a; border: 2px solid #c45d5d; border-radius: 16px; padding: 10px 14px; margin: 8px 0; text-align: left; font-size: 0.85rem; color: #f0ebff !important; -webkit-text-fill-color: #f0ebff !important; line-height: 1.6; }
  .compose-rows { margin: 12px 0; display: flex; flex-direction: column; gap: 10px; }
  .compose-row { display: flex; align-items: center; gap: 8px; }
  .compose-input { width: 56px; padding: 10px 4px; font-size: 1.3rem; font-family: 'Fredoka One', cursive; background: #1f1937; border: 2px solid #4e4280; border-radius: 16px; color: #FFD93D !important; -webkit-text-fill-color: #FFD93D !important; text-align: center; outline: none; -moz-appearance: textfield; }
  .compose-input::-webkit-outer-spin-button, .compose-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .compose-input:focus { border-color: #C77DFF; }
  .compose-sym { font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: #FF9FCF !important; -webkit-text-fill-color: #FF9FCF !important; min-width: 20px; text-align: center; }
  .compose-eq { font-family: 'Fredoka One', cursive; font-size: 1rem; color: #b1a5d9 !important; -webkit-text-fill-color: #b1a5d9 !important; white-space: nowrap; }
  .compose-optional .compose-input { border-style: dashed; opacity: 0.75; }
  .compose-optional .compose-eq { font-size: 0.85rem; }
  .opt-label { font-size: 0.7rem; color: #9e8fc9 !important; -webkit-text-fill-color: #9e8fc9 !important; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">🌟 Safia's Math Adventure</div>

      <button class="tb-btn" onclick="saveProgress()">💾 Save</button>

    <div class="tb-lbl" id="progressLabel">0/10 mastered</div>

// ═══════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════
function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/*
  buildLevel(eqFn, wordPool)
  Produces exactly 15 problems in fixed order:
    Q1–Q7   : equations WITH hint  (dynamic, from eqFn)
    Q8–Q10  : equations NO hint    (dynamic, from eqFn)
    Q11–Q12 : word problems WITH hint (random from pool)
    Q13–Q15 : word problems NO hint   (random from pool)
*/
function buildLevel(eqFn, wordPool) {
  const eqs = [];
  let guard = 0;
  while (eqs.length < 10 && guard++ < 500) {
    const p = eqFn();
    if (p) eqs.push(p);
  }
  const words = shuffle(wordPool).slice(0, 5);
  return [
    ...eqs.slice(0, 7).map(p => ({ ...p, category:'equation', hasHint:true  })),

// Simple addition: count up from the bigger number
function hintAdd(a, b) {
  const big = Math.max(a, b), small = Math.min(a, b), total = a + b;
  const steps = Array.from({length: small}, (_, i) => big + i + 1);
  return `
    <div class="hint-step">Start at the <strong>bigger number (${big})</strong> and count up <strong>${small} fingers</strong>:</div>
    <div class="hint-count">${steps.join(',  ')}</div>
    <div class="hint-answer">That's ${total}! ✅</div>`;
}

// Simple subtraction: count up from the smaller to the bigger
function hintSub(a, b) {
  const diff = a - b;
  const steps = Array.from({length: diff}, (_, i) => b + i + 1);
  return `
    <div class="hint-step">Start counting <strong>after the small number (${b})</strong> and count up to <strong>${a}</strong>:</div>
    <div class="hint-count">${steps.join(',  ')}</div>
    <div class="hint-answer">That's ${diff} fingers → answer is ${diff}! ✅</div>`;
}

// Carry addition — narrated step by step, your teaching method
function hintCarryAdd(a, b) {
  const oA = a % 10, oB = b % 10;
  const tA = Math.floor(a / 10), tB = Math.floor(b / 10);
  const bigO = Math.max(oA, oB), smallO = Math.min(oA, oB);
  const onesTotal = oA + oB, onesWrite = onesTotal % 10, tensTotal = tA + tB + 1;
  // Count up from the bigger ones digit, smallO steps
  const onesSteps = Array.from({length: smallO}, (_, i) => bigO + i + 1);
  return `
    <div class="hint-col">  ${a}\n+ ${b}\n  ————</div>
    <div class="hint-step">We add the <strong>right side (ones)</strong> first: <strong>${oA}</strong> and <strong>${oB}</strong>.</div>
    <div class="hint-step">Start after the bigger number (<strong>${bigO}</strong>) and count up <strong>${smallO}</strong>:</div>
    <div class="hint-count">${onesSteps.join(',  ')}</div>
    <div class="hint-step">We reach <strong>${onesTotal}</strong>. On the right side, the biggest number we can have is <strong>9</strong> — nothing bigger than 9.</div>
    <div class="hint-step">Since <strong>${onesTotal} is bigger than 9</strong>, we only take the <strong>${onesWrite}</strong> and bring the <strong>1</strong> to the top of the left column.</div>
    <div class="hint-col">  1\n  ${a}\n+ ${b}\n  ————\n  ${onesWrite}</div>
    <div class="hint-step">Now on the <strong>left side (tens)</strong>, we add <strong>${tA} + ${tB} + 1</strong> (the one we carried) = <strong>${tensTotal}</strong>.</div>
    <div class="hint-answer">  ${a}\n+ ${b}\n  ————\n  ${a + b} ✅</div>`;
}

}

<div class="hint-col">  ${eg} + ? = ${target}</div>
<div class="hint-step">To find the missing number, we <strong>subtract ${eg} from ${target}</strong>:</div>
${subSteps}
<div class="hint-step" style="margin-top:8px">So <strong>${eg} + ${other} = ${target}</strong> ✅</div>
<div class="hint-step">Now fill in the boxes below with <strong>two different pairs</strong> that add up to ${target}.<br>Try starting with a different small number each time!</div>`;
}

function eqComposeAdd() {
  const targets = [10,12,14,15,16,18,20,22,24,25];
  const target = targets[rnd(0, targets.length-1)];
  return { type:'compose_add', question:`Find TWO ways to make <strong>${target}</strong> by adding two numbers.`, answer:target, target, hint:hintComposeAdd(target) };
}

const wordsComposeAdd = [
  { type:'word_compose', question:"Safia wants exactly <strong>15</strong> books on her shelf in two piles.\nFind TWO different ways to make two piles that add up to 15.", answer:15, target:15, hint:hintComposeAdd(15) },
  { type:'word_compose', question:"A farmer puts exactly <strong>20</strong> seeds into two rows.\nFind TWO different ways to share 20 seeds between two rows.", answer:20, target:20, hint:hintComposeAdd(20) },
  { type:'word_compose', question:"Safia puts <strong>18</strong> biscuits onto two trays.\nFind TWO different ways to share 18 biscuits between two trays.", answer:18, target:18, hint:hintComposeAdd(18) },
  { type:'word_compose', question:"A necklace has <strong>24</strong> beads in two colours.\nFind TWO different ways to split 24 beads into two colour groups.", answer:24, target:24, hint:hintComposeAdd(24) },
  { type:'word_compose', question:"<strong>30</strong> children are split into two teams.\nFind TWO different ways to make two teams from 30 children.", answer:30, target:30, hint:hintComposeAdd(30) },
  { type:'word_compose', question:"Safia needs <strong>16</strong> candles on two birthday cakes.\nFind TWO different ways to put 16 candles onto two cakes.", answer:16, target:16, hint:hintComposeAdd(16) },
  { type:'word_compose', question:"A box has <strong>22</strong> chocolates on two layers.\nFind TWO different ways to arrange 22 chocolates into two layers.", answer:22, target:22, hint:hintComposeAdd(22) }
];

// ═══════════════════════════════════════════════════
//  LEVEL 9 — FIND THE GAP
// ═══════════════════════════════════════════════════

/* Hint: pick any small number, add the diff to find the big number.
   Use carry-add method to show the addition step by step. */
function hintComposeSub(diff) {
  const small = 3; // fixed so the example is always clear
  const big = small + diff;
  let addSteps;
  // If small+diff crosses a ten boundary, use carry hint, else simple add
  const s1 = small % 10, d1 = diff % 10;
  if (s1 + d1 >= 10) {
    addSteps = hintCarryAdd(small, diff);
  } else {
    addSteps = hintAdd(small, diff);
  }
  return `
<div class="hint-step">👉 Start with <strong>any small number</strong>. Let's try <strong>${small}</strong>.</div>
<div class="hint-step">We need to find the big number so that when we subtract ${small} from it, we get ${diff}.</div>
<div class="hint-col">  ? − ${small} = ${diff}</div>
<div class="hint-step">To find the big number, we <strong>add ${small} + ${diff}</strong>:</div>
${addSteps}
<div class="hint-step" style="margin-top:8px">So <strong>${big} − ${small} = ${diff}</strong> ✅</div>
<div class="hint-step">Now fill in the boxes below with <strong>two different pairs</strong> that have a difference of ${diff}.<br>Try starting with a different small number each time!</div>`;
}

function eqComposeSub() {
  const diffs = [4,5,6,7,8,9,10,11,12];
  const diff = diffs[rnd(0, diffs.length-1)];
  return { type:'compose_sub', question:`Find TWO pairs of numbers with a difference of <strong>${diff}</strong>.`, answer:diff, target:diff, hint:hintComposeSub(diff) };
}

const wordsComposeSub = [
  { type:'word_compose_sub', question:"Safia has <strong>8</strong> more stickers than her brother.\nFind TWO different pairs of numbers where the bigger minus the smaller equals 8.", answer:8, target:8, hint:hintComposeSub(8) },
  { type:'word_compose_sub', question:"Two friends stand <strong>10</strong> steps apart on a number line.\nFind TWO different pairs of numbers that are 10 apart.", answer:10, target:10, hint:hintComposeSub(10) },
  { type:'word_compose_sub', question:"Safia's pencil is <strong>12</strong> cm longer than her eraser.\nFind TWO different pairs of lengths with a difference of 12.", answer:12, target:12, hint:hintComposeSub(12) },
  { type:'word_compose_sub', question:"A tall sunflower is <strong>15</strong> cm taller than a short one.\nFind TWO different pairs of heights with a difference of 15.", answer:15, target:15, hint:hintComposeSub(15) },
  { type:'word_compose_sub', question:"One bus has <strong>7</strong> more passengers than another.\nFind TWO different pairs of passenger numbers with a difference of 7.", answer:7, target:7, hint:hintComposeSub(7) },
  { type:'word_compose_sub', question:"Safia's cat weighs <strong>6</strong> kg more than her rabbit.\nFind TWO different pairs of weights with a difference of 6.", answer:6, target:6, hint:hintComposeSub(6) },
  { type:'word_compose_sub', question:"One book has <strong>9</strong> more pages than another.\nFind TWO different pairs of page numbers with a difference of 9.", answer:9, target:9, hint:hintComposeSub(9) }
];

// ═══════════════════════════════════════════════════
//  LEVEL 10 — GRAND FINALE (20 problems, no hints)
//  1 equation + 1 word problem per each of the 9 levels
// ═══════════════════════════════════════════════════
function generateComboProblems() {
  const defs = [
    { eqFn:eqCounting,    pool:wordsCounting   },
    { eqFn:eqGrouping,    pool:wordsGrouping   },
    { eqFn:eqMissingAdd,  pool:wordsMissingAdd },
    { eqFn:eqCarryAdd,    pool:wordsCarryAdd   },
    { eqFn:eqBorrowSub,   pool:wordsBorrowSub  },
    { eqFn:eqAddThree,    pool:wordsAddThree   },
    { eqFn:eqSubThree,    pool:wordsSubThree   },
    { eqFn:eqComposeAdd,  pool:wordsComposeAdd },
    { eqFn:eqComposeSub,  pool:wordsComposeSub }
  ];
  const result = [];
  defs.forEach(({ eqFn, pool }) => {
    let eq = null, g = 0;
    while (!eq && g++ < 100) eq = eqFn();
    if (eq) result.push({ ...eq, category:'equation', hasHint:false });
    const wp = pool[rnd(0, pool.length-1)];
    result.push({ ...wp, category:'word', hasHint:false });
  });
  return shuffle(result); // randomise order for variety
}

// ═══════════════════════════════════════════════════
//  LEVEL DISPATCHER
// ═══════════════════════════════════════════════════
function generateLevel(id) {
  if (id === 'combo') return generateComboProblems();
  const map = {
    counting:    { eqFn:eqCounting,    pool:wordsCounting   },
    grouping:    { eqFn:eqGrouping,    pool:wordsGrouping   },
    missing_add: { eqFn:eqMissingAdd,  pool:wordsMissingAdd },
    carry_add:   { eqFn:eqCarryAdd,    pool:wordsCarryAdd   },
    borrow_sub:  { eqFn:eqBorrowSub,   pool:wordsBorrowSub  },
    add_three:   { eqFn:eqAddThree,    pool:wordsAddThree   },
    sub_three:   { eqFn:eqSubThree,    pool:wordsSubThree   },
    compose_add: { eqFn:eqComposeAdd,  pool:wordsComposeAdd },
    compose_sub: { eqFn:eqComposeSub,  pool:wordsComposeSub }
  };
  const d = map[id];
  return d ? buildLevel(d.eqFn, d.pool) : [];
}

// ═══════════════════════════════════════════════════
//  ANSWER VALIDATION
// ═══════════════════════════════════════════════════
function checkCorrect(q, raw) {
  const v = raw.trim();
  // compose types now handled via multi-row inputs — see checkAnswer()
  if (q.type === 'compose_add' || q.type === 'word_compose') return false; // handled separately
  if (q.type === 'compose_sub' || q.type === 'word_compose_sub') return false; // handled separately
  return parseInt(v) === q.answer;
}
function friendlyAnswer(q) {
  if (q.type === 'compose_add' || q.type === 'word_compose') {
    const a = rnd(1, q.target-1); return `e.g. ${a} + ${q.target-a}  and  ${q.target-a} + ${a}`;
  }
  if (q.type === 'compose_sub' || q.type === 'word_compose_sub') {
    const b = rnd(1,8); return `e.g. ${b+q.target} − ${b}  and  ${b+1+q.target} − ${b+1}`;
  }
  return String(q.answer);
}

// ═══════════════════════════════════════════════════
//  HOME
// ═══════════════════════════════════════════════════
function renderHome() {
  const grid = document.getElementById('levelsGrid');
  grid.innerHTML = '';
  LEVELS.forEach(level => {
    const p = progress[level.id];
    const stars = p.completed ? (p.score>=90?'⭐⭐⭐':p.score>=70?'⭐⭐':'⭐') : '';
    const btn = document.createElement('div');
    btn.className = 'level-btn';
    btn.innerHTML = `<div class="level-icon">${level.icon}</div><div class="level-name">${level.name}</div><div class="level-stars">${stars||'&nbsp;'}</div>`;
    btn.onclick = () => startLevel(level);
    grid.appendChild(btn);
  });
  updateProgressStats();
}
function updateProgressStats() {
  const mastered = LEVELS.filter(l => progress[l.id].completed).length;
  const pct = Math.round(mastered/LEVELS.length*100)||0;
  document.getElementById('progressStats').textContent = `${mastered} of ${LEVELS.length} levels mastered (${pct}%)`;
  document.getElementById('progressBarFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `${mastered}/${LEVELS.length} mastered`;
}

// ═══════════════════════════════════════════════════
//  START LEVEL
// ═══════════════════════════════════════════════════
function startLevel(level) {
  currentLevel = level;
  questions = generateLevel(level.id);
  qIndex=0; score=0; wrong=0; mistakes=[]; answered=false;
  document.getElementById('quizLevelLabel').textContent = `${level.icon} ${level.name}`;
  showScreen('quizScreen');
  renderQuestion();
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() {
  renderHome();
  showScreen('homeScreen');
}

// ═══════════════════════════════════════════════════
//  RENDER QUESTION
// ═══════════════════════════════════════════════════
function renderQuestion() {
  const q = questions[qIndex];
  const total = questions.length;

  document.getElementById('quizQCounter').textContent = `Q${qIndex+1}/${total}`;
  document.getElementById('scoreCorrect').textContent = score;
  document.getElementById('scoreWrong').textContent = wrong;
  document.getElementById('scorePercent').textContent = (score+wrong) ? Math.round(score/(score+wrong)*100)+'%' : '—';
  document.getElementById('quizProgressBar').style.width = (qIndex/total*100)+'%';

  // Section banner
  const banner = document.getElementById('sectionBanner');
  if (currentLevel.id !== 'combo') {
    if (qIndex === 0)  banner.innerHTML = '<span class="section-divider">🔢 Equations — Let\'s go!</span>';
    else if (qIndex === 10) banner.innerHTML = '<span class="section-divider">📖 Word Problems time!</span>';
    else banner.innerHTML = '';
  } else {
    banner.innerHTML = '<span class="section-divider">🏆 Grand Finale — Mix of everything!</span>';
  }

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('checkButton').style.display = 'block';
  document.getElementById('nextButton').style.display = 'none';
  answered = false;

  const hintBtn = document.getElementById('hintButton');
  hintBtn.style.display = q.hasHint ? 'block' : 'none';
  hintBtn.disabled = false;

  const labels = {
    counting_add:'🔢 Counting', counting_sub:'🔢 Counting',
    grouping:'📦 Tens & Ones', missing_add:'❓ Missing Number', missing_sub:'❓ Missing Number',
    carry_add:'➕ Carry Addition', borrow_sub:'➖ Borrow Sub',
    add_three:'🔺 Add Three', sub_three:'🔻 Subtract Three',
    compose_add:'🧩 Make a Sum', compose_sub:'🔍 Find the Gap',
    word:'📖 Word Problem', word_compose:'📖 Word Problem', word_compose_sub:'📖 Word Problem'
  };
  const badge = labels[q.type] || '🧮 Math';
  const isComposeAdd = ['compose_add','word_compose'].includes(q.type);
  const isComposeSub = ['compose_sub','word_compose_sub'].includes(q.type);
  const isCompose = isComposeAdd || isComposeSub;
  const sym = isComposeAdd ? '+' : '−';
  const placeholder = isCompose ? (isComposeAdd ? 'e.g. 7' : 'e.g. 13') : 'Type your answer…';

  const card = document.getElementById('questionCard');
  card.className = 'q-card' + (q.category==='word' ? ' word-card' : '');

  let inputHtml = '';
  if (isCompose) {
    const t = q.target;
    inputHtml = `
      <div class="compose-rows">
        <div class="compose-row">
          <input class="compose-input" id="c1a" type="number" inputmode="numeric" placeholder="?" autocomplete="off">
          <span class="compose-sym">${sym}</span>
          <input class="compose-input" id="c1b" type="number" inputmode="numeric" placeholder="?" autocomplete="off">
          <span class="compose-eq">= ${t}</span>
        </div>
        <div class="compose-row">
          <input class="compose-input" id="c2a" type="number" inputmode="numeric" placeholder="?" autocomplete="off">
          <span class="compose-sym">${sym}</span>
          <input class="compose-input" id="c2b" type="number" inputmode="numeric" placeholder="?" autocomplete="off">
          <span class="compose-eq">= ${t}</span>
        </div>
        <div class="compose-row compose-optional">
          <input class="compose-input" id="c3a" type="number" inputmode="numeric" placeholder="?" autocomplete="off">
          <span class="compose-sym">${sym}</span>
          <input class="compose-input" id="c3b" type="number" inputmode="numeric" placeholder="?" autocomplete="off">
          <span class="compose-eq">= ${t} <span class="opt-label">(optional)</span></span>
        </div>
      </div>`;
  } else {
    inputHtml = `<input class="answer-input" id="answerInput" type="number" inputmode="numeric" placeholder="${placeholder}" autocomplete="off">`;
  }

  card.innerHTML = `
    <div class="q-type-badge">${badge}</div>
    <div class="question-text">${q.question.replace(/\n/g,'<br>')}</div>
    ${inputHtml}
    <div class="hint-box" id="hintDisplay"></div>
  `;
  document.getElementById('hintDisplay').innerHTML = q.hint || '';

  if (isCompose) {
    document.getElementById('c1a').focus();
    ['c1a','c1b','c2a','c2b','c3a','c3b'].forEach(id => {
      document.getElementById(id)?.addEventListener('keydown', e => { if(e.key==='Enter') checkAnswer(); });
    });
  } else {
    const inp = document.getElementById('answerInput');
    if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if(e.key==='Enter') checkAnswer(); }); }
  }
}

// ═══════════════════════════════════════════════════
//  HINT / CHECK / NEXT
// ═══════════════════════════════════════════════════
function showHint() {
  document.getElementById('hintDisplay').classList.add('show');
  document.getElementById('hintButton').disabled = true;
}

function checkAnswer() {
  if (answered) return;
  const q = questions[qIndex];
  const isComposeAdd = ['compose_add','word_compose'].includes(q.type);
  const isComposeSub = ['compose_sub','word_compose_sub'].includes(q.type);
  const isCompose = isComposeAdd || isComposeSub;

  if (isCompose) {
    const getVal = id => { const v = document.getElementById(id)?.value ?? ''; return v.trim() === '' ? NaN : parseInt(v); };
    const rows = [
      { a: getVal('c1a'), b: getVal('c1b'), required: true  },
      { a: getVal('c2a'), b: getVal('c2b'), required: true  },
      { a: getVal('c3a'), b: getVal('c3b'), required: false }
    ];

    const allRequiredFilled = rows.filter(r=>r.required).every(r => !isNaN(r.a) && !isNaN(r.b));
    if (!allRequiredFilled) { alert('Please fill in both rows 1 and 2! ✏️'); return; }

    function rowOk(r) {
      if (isNaN(r.a) || isNaN(r.b)) return null;
      if (isComposeAdd) return r.a > 0 && r.b > 0 && r.a + r.b === q.target;
      return r.a > r.b && r.b >= 0 && r.a - r.b === q.target;
    }

    const r1ok = rowOk(rows[0]), r2ok = rowOk(rows[1]);
    const r3filled = !isNaN(rows[2].a) && !isNaN(rows[2].b);
    const r3ok = r3filled ? rowOk(rows[2]) : true;

    // Row 1 and 2 must be different pairs
    const dup = isComposeAdd
      ? (rows[0].a===rows[1].a && rows[0].b===rows[1].b) || (rows[0].a===rows[1].b && rows[0].b===rows[1].a)
      : (rows[0].a===rows[1].a && rows[0].b===rows[1].b);

    answered = true;
    const correct = r1ok && r2ok && r3ok && !dup;

    // Colour-code borders
    [['c1a','c1b',r1ok],['c2a','c2b',r2ok],r3filled?['c3a','c3b',r3ok]:null].forEach(t => {
      if (!t) return;
      const [idA,idB,ok] = t;
      const col = ok ? '#6BCB77' : '#ff6b6b';
      const eA = document.getElementById(idA), eB = document.getElementById(idB);
      if (eA) eA.style.borderColor = col;
      if (eB) eB.style.borderColor = col;
    });

    if (correct) {
      score++;
      document.getElementById('feedback').className = 'feedback show ok';
      document.getElementById('feedback').textContent = '✅ Amazing! Both pairs are correct, Safia!';
    } else {
      wrong++;
      const dispQ = q.question.replace(/<[^>]+>/g,'');
      const yourAns = `${rows[0].a} ${isComposeAdd?'+':'−'} ${rows[0].b}  /  ${rows[1].a} ${isComposeAdd?'+':'−'} ${rows[1].b}`;
      mistakes.push({ question: dispQ, yourAnswer: yourAns, correct: friendlyAnswer(q) });
      let msg = dup ? '❌ Your two pairs must be different! Try different numbers.'
        : !r1ok ? `❌ Row 1 is not right. ${friendlyAnswer(q)}`
        : !r2ok ? `❌ Row 2 is not right. ${friendlyAnswer(q)}`
        : `❌ Check row 3. ${friendlyAnswer(q)}`;
      document.getElementById('feedback').className = 'feedback show bad';
      document.getElementById('feedback').textContent = msg;
    }

  } else {
    const raw = (document.getElementById('answerInput')?.value || '').trim();
    if (!raw) { alert('Please type your answer first!'); return; }
    answered = true;
    const correct = parseInt(raw) === q.answer;
    if (correct) {
      score++;
      document.getElementById('feedback').className = 'feedback show ok';
      document.getElementById('feedback').textContent = '✅ Correct! Well done, Safia!';
    } else {
      wrong++;
      const dispQ = q.question.replace(/<[^>]+>/g,'');
      mistakes.push({ question: dispQ, yourAnswer: raw, correct: friendlyAnswer(q) });
      document.getElementById('feedback').className = 'feedback show bad';
      document.getElementById('feedback').textContent = `❌ The answer is: ${friendlyAnswer(q)}`;
    }
  }

  document.getElementById('scoreCorrect').textContent = score;
  document.getElementById('scoreWrong').textContent = wrong;
  document.getElementById('scorePercent').textContent = Math.round(score/(score+wrong)*100)+'%';
  document.getElementById('checkButton').style.display = 'none';
  document.getElementById('nextButton').style.display = 'block';
  document.getElementById('hintButton').style.display = 'none';
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= questions.length) showResults();
  else renderQuestion();
}

// ═══════════════════════════════════════════════════
//  RESULTS
// ═══════════════════════════════════════════════════
function showResults() {
  const total = questions.length;
  const pct = Math.round(score/total*100);
  const passed = pct >= 70;
  if (passed) progress[currentLevel.id] = { completed:true, score:pct };

  document.getElementById('resultEmoji').textContent   = pct>=90?'🏆':pct>=70?'🌟':'💪';
  document.getElementById('resultTitle').textContent   = pct>=90?'Amazing!':pct>=70?'Good job!':'Keep practising!';
  document.getElementById('resultStars').textContent   = pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('encouragement').textContent = ENCOURAGEMENTS[rnd(0,ENCOURAGEMENTS.length-1)];
  document.getElementById('resultMessage').textContent = `You got ${score} out of ${total} correct (${pct}%).`;

  let html = '';
  if (mistakes.length > 0) {
    html = '<h3 style="color:#ffb3b3;margin:10px 0 6px;">📝 Review your mistakes:</h3>';
    mistakes.forEach(m => {
      html += `<div class="mistake-item"><span class="mistake-q">${m.question.replace(/\n/g,' ')}</span>Your answer: ${m.yourAnswer} ❌ &nbsp; Correct: ${m.correct} ✅</div>`;
    });
  }
  document.getElementById('mistakesList').innerHTML = html;
  document.getElementById('retryButton').onclick = () => startLevel(currentLevel);

  const idx = LEVELS.findIndex(l=>l.id===currentLevel.id);
  const nb = document.getElementById('nextLevelButton');
  if (passed && idx < LEVELS.length-1) { nb.style.display='block'; nb.onclick=()=>startLevel(LEVELS[idx+1]); }
  else nb.style.display='none';

  renderHome();
  showScreen('resultScreen');
}

// ═══════════════════════════════════════════════════
//  SAVE / LOAD
// ═══════════════════════════════════════════════════
function saveProgress() {
  const blob = new Blob([JSON.stringify(progress)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'safia-progress.json';
  a.click();
}
function loadProgress() { document.getElementById('loadFile').click(); }
function handleLoadFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try { Object.assign(progress, JSON.parse(ev.target.result)); renderHome(); alert('Progress loaded! ✅'); }
    catch { alert('Could not read that file. Please try again.'); }
  };
  r.readAsText(file);
}

renderHome();
</script>
