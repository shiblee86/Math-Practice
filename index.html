<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>🌟 Safia's Math Adventure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    font-family: 'Nunito', sans-serif;
    background: #0a0718;
    min-height: 100vh;
    color: #f0ebff;
    padding: 10px;
  }

  .wrap {
    max-width: 500px;
    margin: 0 auto;
    width: 100%;
  }

  /* Top bar */
  .topbar {
    background: #1f1a33;
    border-radius: 40px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    border: 1px solid #41386b;
  }
  
  .topbar-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    color: #FFD93D;
  }
  
  .topbar-btns {
    display: flex;
    gap: 6px;
  }
  
  .tb-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 30px;
    font-weight: 800;
    font-size: 0.75rem;
    cursor: pointer;
    color: #1a0f2a;
    background: #FFD93D;
  }
  
  .tb-btn.tb-load {
    background: #6BCB77;
  }
  
  .tb-lbl {
    font-size: 0.65rem;
    color: #b1a5d9;
    width: 100%;
    text-align: center;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* Home screen */
  .home-hero {
    text-align: center;
    padding: 15px 0 5px;
  }
  
  .home-hero h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 1.8rem;
    background: linear-gradient(135deg, #FFD93D, #FF9FCF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Level grid */
  .levels-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 15px;
  }

  .level-btn {
    background: #1a1530;
    border: 2px solid #3d3460;
    border-radius: 20px;
    padding: 15px 5px;
    cursor: pointer;
    text-align: center;
  }
  
  .level-icon {
    font-size: 2rem;
    margin-bottom: 5px;
  }
  
  .level-name {
    font-weight: 800;
    font-size: 0.85rem;
    color: #f0ebff;
  }
  
  .level-stars {
    color: #FFD93D;
    font-size: 0.8rem;
  }

  /* Progress chart */
  .progress-chart {
    background: #1e1932;
    border-radius: 20px;
    padding: 15px;
    margin-top: 20px;
  }
  
  .progress-bar-cont {
    background: #2f274a;
    border-radius: 10px;
    height: 16px;
    margin: 8px 0;
  }
  
  .progress-bar-fill {
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg, #C77DFF, #FF9FCF);
    width: 0%;
    transition: width 0.4s;
  }

  /* Quiz screen */
  .quiz-head {
    background: #1e1932;
    border-radius: 20px;
    padding: 12px;
    margin-bottom: 12px;
  }
  
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    color: #b7a9e6;
    font-size: 0.75rem;
    margin-bottom: 8px;
  }
  
  .quiz-score-row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  
  .qs-item {
    text-align: center;
    flex: 1;
    background: #2f274a;
    border-radius: 30px;
    padding: 5px;
  }
  
  .qs-val {
    font-size: 1.2rem;
    font-weight: 900;
    color: white;
  }
  
  .prog-bar {
    background: #2f274a;
    border-radius: 8px;
    height: 8px;
  }
  
  .prog-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, #C77DFF, #FF9FCF);
    transition: width 0.4s;
  }

  /* Question card */
  .q-card {
    background: #1a1530;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 12px;
    border-top: 5px solid #FF9FCF;
  }
  
  .q-type-badge {
    display: inline-block;
    background: #362d55;
    color: #e4d2ff;
    border-radius: 30px;
    padding: 3px 10px;
    font-size: 0.65rem;
    font-weight: 800;
    margin-bottom: 8px;
  }
  
  .question-text {
    font-size: 1.2rem;
    font-weight: 800;
    color: white;
    margin-bottom: 15px;
    text-align: center;
  }

  /* Answer input */
  .answer-input {
    width: 100%;
    padding: 12px;
    font-size: 1.5rem;
    font-family: 'Fredoka One', cursive;
    background: #1f1937;
    border: 2px solid #4e4280;
    border-radius: 40px;
    color: #FFD93D;
    text-align: center;
    margin: 10px 0;
  }

  /* Hint box */
  .hint-box {
    background: #2d2447;
    border: 2px solid #C77DFF;
    border-radius: 20px;
    padding: 12px;
    margin: 15px 0;
    display: none;
    color: #cdc2f0;
  }
  
  .hint-box.show {
    display: block;
  }

  .feedback {
    border-radius: 40px;
    padding: 12px;
    margin: 8px 0;
    font-weight: 700;
    display: none;
    text-align: center;
  }
  
  .feedback.show { display: block; }
  .feedback.ok { background: #1d4a2a; color: #c3f0c3; }
  .feedback.bad { background: #5a2e36; color: #ffcfcf; }

  /* BUTTON STYLES - SIMPLE AND CLEAR */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  
  /* Individual button styles - each with explicit colors */
  .btn-home {
    background: #3a3260;
    color: white;
    border: none;
    border-radius: 40px;
    padding: 14px 0;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    flex: 1;
    text-align: center;
  }
  
  .btn-hint {
    background: #FFD93D;
    color: #1a0f2a;
    border: none;
    border-radius: 40px;
    padding: 14px 0;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    flex: 1;
    text-align: center;
  }
  
  .btn-check {
    background: #C77DFF;
    color: white;
    border: none;
    border-radius: 40px;
    padding: 14px 0;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    flex: 1;
    text-align: center;
  }
  
  .btn-next {
    background: #6BCB77;
    color: #1a0f2a;
    border: none;
    border-radius: 40px;
    padding: 14px 0;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    flex: 1;
    text-align: center;
    display: none;
  }
  
  .btn-retry {
    background: #3a3260;
    color: white;
    border: none;
    border-radius: 40px;
    padding: 14px 0;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    flex: 1;
    text-align: center;
  }

  /* Result screen */
  .result-card {
    background: #1e1932;
    border-radius: 30px;
    padding: 25px;
    text-align: center;
    border: 3px solid #FF9FCF;
  }
  
  .result-emoji { font-size: 3.5rem; }
  .result-title { font-size: 2rem; color: #FF9FCF; }
  .result-stars { font-size: 2rem; color: #FFD93D; }
  
  .encouragement {
    background: linear-gradient(135deg, #362d55, #4a3a6e);
    border-radius: 40px;
    padding: 15px;
    margin: 15px 0;
    font-size: 1.3rem;
    color: #FF9FCF;
    border: 2px solid #FF9FCF;
  }

  .mistake-item {
    background: #2f253a;
    border: 2px solid #c45d5d;
    border-radius: 30px;
    padding: 10px;
    margin: 8px 0;
    text-align: left;
  }
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <div class="topbar-title">🌟 Safia's Math Adventure</div>
  <div class="topbar-btns">
    <button class="tb-btn" onclick="saveProgress()">💾 Save</button>
    <button class="tb-btn tb-load" onclick="loadProgress()">📂 Load</button>
    <input type="file" id="loadFile" accept=".json" style="display:none" onchange="loadFile(event)">
  </div>
  <div class="tb-lbl" id="progressLabel">0/10 mastered</div>
</div>

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen active">
  <div class="home-hero">
    <h1>Safia's Math Adventure!</h1>
    <p>10 levels · 15 problems each</p>
  </div>
  
  <div class="levels-grid" id="levelsGrid"></div>
  
  <div class="progress-chart" id="progressChart">
    <h3 style="color:#d4c2ff; margin-bottom:8px;">📊 Safia's Progress</h3>
    <div id="progressStats">0 of 10 levels mastered (0%)</div>
    <div class="progress-bar-cont"><div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div></div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div id="quizScreen" class="screen">
  <div class="quiz-head">
    <div class="quiz-meta">
      <span id="quizLevelLabel">Level 1</span>
      <span id="quizQCounter">Q1 / 15</span>
    </div>
    <div class="quiz-score-row">
      <div class="qs-item"><div>✅</div><div class="qs-val" id="scoreCorrect">0</div></div>
      <div class="qs-item"><div>❌</div><div class="qs-val" id="scoreWrong">0</div></div>
      <div class="qs-item"><div>%</div><div class="qs-val" id="scorePercent">—</div></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="quizProgressBar" style="width:0%"></div></div>
  </div>
  
  <div class="q-card" id="questionCard"></div>
  <div class="feedback" id="feedback"></div>
  
  <div class="btn-row">
    <button class="btn-home" onclick="goHome()">🏠</button>
    <button class="btn-hint" id="hintButton" onclick="showHint()">💡</button>
    <button class="btn-check" id="checkButton" onclick="checkAnswer()">✅</button>
    <button class="btn-next" id="nextButton" onclick="nextQuestion()">▶</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen" class="screen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title" id="resultTitle">Great job!</div>
    <div class="result-stars" id="resultStars">⭐⭐⭐</div>
    <div class="encouragement" id="encouragement"></div>
    <div id="resultMessage"></div>
    <div id="mistakesList"></div>
    <div class="btn-row">
      <button class="btn-retry" id="retryButton">🔁</button>
      <button class="btn-check" onclick="goHome()">🏠</button>
      <button class="btn-next" id="nextLevelButton" style="display:none">➡️</button>
    </div>
  </div>
</div>

</div>

<script>
// ==================== MATH ADVENTURE - 10 LEVELS ====================
const LEVELS = [
  { id: 'counting', name: 'Counting', icon: '🔢', desc: 'Count up/down' },
  { id: 'grouping', name: 'Tens & Ones', icon: '📦', desc: 'Groups of tens' },
  { id: 'missing_add', name: 'Missing Number', icon: '❓', desc: 'Find the ?' },
  { id: 'carry_add', name: 'Carry Addition', icon: '➕', desc: 'Add with carry' },
  { id: 'borrow_sub', name: 'Borrow Sub', icon: '➖', desc: 'Subtract with borrow' },
  { id: 'add_three', name: 'Add Three', icon: '🔺', desc: 'Add 3 numbers' },
  { id: 'sub_three', name: 'Subtract Three', icon: '🔻', desc: 'Subtract 2 numbers' },
  { id: 'compose_add', name: 'Make a Sum', icon: '🧩', desc: 'Find pairs that add' },
  { id: 'compose_sub', name: 'Find the Gap', icon: '🔍', desc: 'Find the difference' },
  { id: 'combo', name: 'Grand Finale', icon: '🏆', desc: '20 problems - all levels!' }
];

const ENCOURAGEMENTS = [
  "🌟 Safia is amazing!",
  "✨ Great job, Safia!",
  "🎉 You're a math superstar, Safia!",
  "💫 Fantastic work, Safia!",
  "⭐ Safia is on fire!",
  "🌈 You're so smart, Safia!",
  "🏆 Safia is a champion!",
  "🌸 Beautiful work, Safia!",
  "🚀 Safia is reaching for the stars!",
  "🎈 Hooray for Safia!",
  "💖 Safia, you're incredible!"
];

let progress = {};
let currentLevel = null;
let questions = [];
let qIndex = 0;
let score = 0;
let wrong = 0;
let mistakes = [];
let equationHintsUsed = 0;
let wordHintsUsed = 0;
let answered = false;

LEVELS.forEach(level => {
  if (!progress[level.id]) {
    progress[level.id] = { completed: false, score: 0 };
  }
});

function rnd(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// ==================== LEVEL 1: COUNTING ====================
function generateCountingProblems() {
  let problems = [];
  
  for (let i = 0; i < 7; i++) {
    let a = rnd(3, 12);
    let b = rnd(1, 5);
    problems.push({
      type: 'counting_add',
      question: `${a} + ${b} = ?`,
      answer: a + b,
      hint: `Start at ${a} and count up ${b} times: You get ${a+b}!`,
      explanation: `${a} + ${b} = ${a+b}`,
      category: 'equation'
    });
  }
  
  for (let i = 0; i < 3; i++) {
    let a = rnd(5, 15);
    let b = rnd(1, 4);
    problems.push({
      type: 'counting_sub',
      question: `${a} - ${b} = ?`,
      answer: a - b,
      explanation: `${a} - ${b} = ${a-b}`,
      category: 'equation',
      noHint: true
    });
  }
  
  let wordProbs = [
    { q: 'Sara has 8 apples. Mom gives her 5 more. How many now?', a: 13, hint: 'Add 8 + 5 = ?' },
    { q: '14 birds on a tree. 6 fly away. How many left?', a: 8, hint: 'Subtract 14 - 6 = ?' },
    { q: 'Tom had 9 crayons. He got 7 more. How many now?', a: 16, hint: '' },
    { q: 'Lily had 15 stickers. She gave 8 away. How many left?', a: 7, hint: '' },
    { q: '11 fish in a pond. 4 more swim in. How many now?', a: 15, hint: '' }
  ];
  
  wordProbs.forEach((wp, i) => {
    problems.push({
      type: 'word',
      question: wp.q,
      answer: wp.a,
      hint: wp.hint,
      category: 'word',
      hasHint: i < 2
    });
  });
  
  return problems;
}

// ==================== LEVEL 4: CARRY ADDITION ====================
function generateCarryAddProblems() {
  let problems = [];
  let pairs = [[17,5], [18,4], [19,3], [16,6], [15,7], [14,8], [13,9]];
  
  for (let i = 0; i < 7; i++) {
    let [a, b] = pairs[i % pairs.length];
    problems.push({
      type: 'carry_add',
      question: `${a} + ${b} = ?`,
      answer: a + b,
      hint: `Add ones: ${a%10}+${b%10}=${(a%10)+(b%10)}, carry 1. Tens: ${Math.floor(a/10)}+${Math.floor(b/10)}+1=${Math.floor((a+b)/10)}`,
      explanation: `${a} + ${b} = ${a+b}`,
      category: 'equation'
    });
  }
  
  for (let i = 0; i < 3; i++) {
    let [a, b] = shuffle(pairs)[0];
    problems.push({
      type: 'carry_add',
      question: `${a} + ${b} = ?`,
      answer: a + b,
      explanation: `${a} + ${b} = ${a+b}`,
      category: 'equation',
      noHint: true
    });
  }
  
  let wordProbs = [
    { q: '37 red + 45 blue balls?', a: 82, hint: 'Add 37+45, carry the 1' },
    { q: '48 chickens + 36 ducks?', a: 84, hint: '48+36, 8+6=14, carry 1' },
    { q: '29 kids + 43 kids?', a: 72, hint: '' },
    { q: '56 apples + 28 apples?', a: 84, hint: '' },
    { q: '67 new books + 25 old?', a: 92, hint: '' }
  ];
  
  wordProbs.forEach((wp, i) => {
    problems.push({
      type: 'word',
      question: wp.q,
      answer: wp.a,
      hint: wp.hint,
      category: 'word',
      hasHint: i < 2
    });
  });
  
  return problems;
}

// ==================== LEVEL 5: BORROW SUBTRACTION ====================
function generateBorrowSubProblems() {
  let problems = [];
  let pairs = [[25,8], [24,7], [23,6], [22,5], [21,4], [52,28], [51,27]];
  
  for (let i = 0; i < 7; i++) {
    let [a, b] = pairs[i % pairs.length];
    problems.push({
      type: 'borrow_sub',
      question: `${a} - ${b} = ?`,
      answer: a - b,
      hint: `${a%10} < ${b%10}, borrow 1 ten: ${a%10+10}-${b%10}=${(a%10+10)-b%10}, tens: ${Math.floor(a/10)-1}-${Math.floor(b/10)}=${Math.floor((a-b)/10)}`,
      explanation: `${a} - ${b} = ${a-b}`,
      category: 'equation'
    });
  }
  
  for (let i = 0; i < 3; i++) {
    let [a, b] = shuffle(pairs)[0];
    problems.push({
      type: 'borrow_sub',
      question: `${a} - ${b} = ?`,
      answer: a - b,
      explanation: `${a} - ${b} = ${a-b}`,
      category: 'equation',
      noHint: true
    });
  }
  
  let wordProbs = [
    { q: '52 crayons, use 27. Left?', a: 25, hint: '52-27, borrow from tens' },
    { q: '71 stickers, give 34. Left?', a: 37, hint: '71-34, borrow' },
    { q: '84 kids, 46 go away. Stay?', a: 38, hint: '' },
    { q: '60 cookies, eat 38. Left?', a: 22, hint: '' },
    { q: '93 pages, read 55. Left?', a: 38, hint: '' }
  ];
  
  wordProbs.forEach((wp, i) => {
    problems.push({
      type: 'word',
      question: wp.q,
      answer: wp.a,
      hint: wp.hint,
      category: 'word',
      hasHint: i < 2
    });
  });
  
  return problems;
}

// ==================== LEVEL 6: ADD THREE NUMBERS ====================
function generateAddThreeProblems() {
  let problems = [];
  
  for (let i = 0; i < 7; i++) {
    let a = rnd(10, 30);
    let b = rnd(10, 30);
    let c = rnd(10, 30);
    let sum = a + b + c;
    if (sum < 90) {
      problems.push({
        type: 'add_three',
        question: `${a} + ${b} + ${c} = ?`,
        answer: sum,
        hint: `First add ${a}+${b}=${a+b}, then +${c}=${sum}`,
        explanation: `${a}+${b}+${c}=${sum}`,
        category: 'equation'
      });
    } else { i--; }
  }
  
  for (let i = 0; i < 3; i++) {
    let a = rnd(10, 30);
    let b = rnd(10, 30);
    let c = rnd(10, 30);
    let sum = a + b + c;
    if (sum < 90) {
      problems.push({
        type: 'add_three',
        question: `${a} + ${b} + ${c} = ?`,
        answer: sum,
        explanation: `${a}+${b}+${c}=${sum}`,
        category: 'equation',
        noHint: true
      });
    } else { i--; }
  }
  
  let wordProbs = [
    { q: '19 + 21 + 30 toys?', a: 70, hint: 'Add 19+21=40, +30=70' },
    { q: '15+23+12 fruits?', a: 50, hint: '15+23=38, +12=50' },
    { q: '24+18+17 students?', a: 59, hint: '' },
    { q: '13+22+15 roses?', a: 50, hint: '' },
    { q: '31+28+11 animals?', a: 70, hint: '' }
  ];
  
  wordProbs.forEach((wp, i) => {
    problems.push({
      type: 'word',
      question: wp.q,
      answer: wp.a,
      hint: wp.hint,
      category: 'word',
      hasHint: i < 2
    });
  });
  
  return problems;
}

// ==================== LEVEL 7: SUBTRACT THREE NUMBERS ====================
function generateSubThreeProblems() {
  let problems = [];
  
  for (let i = 0; i < 7; i++) {
    let total = rnd(50, 80);
    let b = rnd(10, 25);
    let c = rnd(10, 25);
    let result = total - b - c;
    if (result > 5) {
      problems.push({
        type: 'sub_three',
        question: `${total} - ${b} - ${c} = ?`,
        answer: result,
        hint: `First ${total}-${b}=${total-b}, then -${c}=${result}`,
        explanation: `${total}-${b}-${c}=${result}`,
        category: 'equation'
      });
    } else { i--; }
  }
  
  for (let i = 0; i < 3; i++) {
    let total = rnd(50, 80);
    let b = rnd(10, 25);
    let c = rnd(10, 25);
    let result = total - b - c;
    if (result > 5) {
      problems.push({
        type: 'sub_three',
        question: `${total} - ${b} - ${c} = ?`,
        answer: result,
        explanation: `${total}-${b}-${c}=${result}`,
        category: 'equation',
        noHint: true
      });
    } else { i--; }
  }
  
  let wordProbs = [
    { q: '50 marbles, take 25 then 15?', a: 10, hint: '50-25=25, -15=10' },
    { q: '80 cans, donate 35 then 20?', a: 25, hint: '80-35=45, -20=25' },
    { q: '65 flowers, pick 20 then 18?', a: 27, hint: '' },
    { q: '90 dollars, spend 40 then 25?', a: 25, hint: '' },
    { q: '75 chocolates, eat 30 then 15?', a: 30, hint: '' }
  ];
  
  wordProbs.forEach((wp, i) => {
    problems.push({
      type: 'word',
      question: wp.q,
      answer: wp.a,
      hint: wp.hint,
      category: 'word',
      hasHint: i < 2
    });
  });
  
  return problems;
}

// ==================== LEVEL 8: MAKE A SUM ====================
function generateComposeAddProblems() {
  let problems = [];
  let targets = [10, 12, 15, 18, 20];
  
  for (let i = 0; i < 7; i++) {
    let target = targets[i % targets.length];
    let a = rnd(1, target-1);
    problems.push({
      type: 'compose_add',
      question: `Find two numbers that add to ${target}`,
      answer: `${a} + ${target-a}`,
      target: target,
      hint: `Pick ${a}, then ${target} - ${a} = ${target-a}`,
      category: 'equation'
    });
  }
  
  for (let i = 0; i < 3; i++) {
    let target = targets[rnd(0, targets.length-1)];
    let a = rnd(1, target-1);
    problems.push({
      type: 'compose_add',
      question: `Find two numbers that add to ${target}`,
      answer: `${a} + ${target-a}`,
      target: target,
      category: 'equation',
      noHint: true
    });
  }
  
  let wordProbs = [
    { q: 'Find two numbers that make 15', a: '7 + 8', target: 15, hint: 'Try 7 + 8 = 15' },
    { q: 'Find two numbers that make 20', a: '12 + 8', target: 20, hint: '12 + 8 = 20' },
    { q: 'Find two numbers that make 18', a: '9 + 9', target: 18, hint: '' },
    { q: 'Find two numbers that make 24', a: '12 + 12', target: 24, hint: '' },
    { q: 'Find two numbers that make 30', a: '15 + 15', target: 30, hint: '' }
  ];
  
  wordProbs.forEach((wp, i) => {
    problems.push({
      type: 'word_compose',
      question: wp.q,
      answer: wp.a,
      target: wp.target,
      hint: wp.hint,
      category: 'word',
      hasHint: i < 2
    });
  });
  
  return problems;
}

// ==================== LEVEL 9: FIND THE GAP ====================
function generateComposeSubProblems() {
  let problems = [];
  let diffs = [5, 6, 7, 8, 9];
  
  for (let i = 0; i < 7; i++) {
    let diff = diffs[i % diffs.length];
    let b = rnd(3, 10);
    problems.push({
      type: 'compose_sub',
      question: `Find two numbers with a gap of ${diff}`,
      answer: `${b+diff} - ${b}`,
      target: diff,
      hint: `Pick ${b}, then ${b}+${diff}=${b+diff}`,
      category: 'equation'
    });
  }
  
  for (let i = 0; i < 3; i++) {
    let diff = diffs[rnd(0, diffs.length-1)];
    let b = rnd(3, 10);
    problems.push({
      type: 'compose_sub',
      question: `Find two numbers with a gap of ${diff}`,
      answer: `${b+diff} - ${b}`,
      target: diff,
      category: 'equation',
      noHint: true
    });
  }
  
  let wordProbs = [
    { q: 'Find two numbers with a gap of 8', a: '13 - 5', target: 8, hint: '13 - 5 = 8' },
    { q: 'Find two numbers with a gap of 10', a: '15 - 5', target: 10, hint: '15 - 5 = 10' },
    { q: 'Find two numbers with a gap of 12', a: '20 - 8', target: 12, hint: '' },
    { q: 'Find two numbers with a gap of 15', a: '25 - 10', target: 15, hint: '' },
    { q: 'Find two numbers with a gap of 7', a: '12 - 5', target: 7, hint: '' }
  ];
  
  wordProbs.forEach((wp, i) => {
    problems.push({
      type: 'word_compose',
      question: wp.q,
      answer: wp.a,
      target: wp.target,
      hint: wp.hint,
      category: 'word',
      hasHint: i < 2
    });
  });
  
  return problems;
}

// ==================== LEVEL 10: GRAND FINALE ====================
function generateComboProblems() {
  let problems = [];
  
  problems.push({
    type: 'missing_two',
    question: '16 = 9 + ?',
    answer: 7,
    category: 'equation',
    noHint: true
  });
  
  problems.push({
    type: 'word',
    question: 'Sarah has 25 stickers. She gives 12 to Tom and 8 to Lisa. How many left?',
    answer: 5,
    category: 'word',
    hasHint: false
  });
  
  return problems;
}

// ==================== RENDER FUNCTIONS ====================
function renderHome() {
  const grid = document.getElementById('levelsGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  
  LEVELS.forEach(level => {
    const levelData = progress[level.id] || { completed: false, score: 0 };
    const stars = levelData.completed ? (levelData.score >= 90 ? '⭐⭐⭐' : levelData.score >= 70 ? '⭐⭐' : '⭐') : '';
    
    const btn = document.createElement('div');
    btn.className = 'level-btn';
    btn.innerHTML = `
      <div class="level-icon">${level.icon}</div>
      <div class="level-name">${level.name}</div>
      <div class="level-stars">${stars}</div>
    `;
    btn.onclick = () => startLevel(level);
    grid.appendChild(btn);
  });
  
  updateProgressStats();
}

function updateProgressStats() {
  let mastered = 0;
  LEVELS.forEach(level => {
    if (progress[level.id]?.completed) mastered++;
  });
  const total = LEVELS.length;
  const pct = Math.round((mastered / total) * 100) || 0;
  
  document.getElementById('progressStats').innerHTML = `${mastered} of ${total} levels mastered (${pct}%)`;
  document.getElementById('progressBarFill').style.width = pct + '%';
  document.getElementById('progressLabel').innerHTML = `${mastered}/${total} mastered`;
}

function startLevel(level) {
  currentLevel = level;
  
  equationHintsUsed = 0;
  wordHintsUsed = 0;
  
  if (level.id === 'counting') questions = generateCountingProblems();
  else if (level.id === 'carry_add') questions = generateCarryAddProblems();
  else if (level.id === 'borrow_sub') questions = generateBorrowSubProblems();
  else if (level.id === 'add_three') questions = generateAddThreeProblems();
  else if (level.id === 'sub_three') questions = generateSubThreeProblems();
  else if (level.id === 'compose_add') questions = generateComposeAddProblems();
  else if (level.id === 'compose_sub') questions = generateComposeSubProblems();
  else if (level.id === 'combo') questions = generateComboProblems();
  
  qIndex = 0;
  score = 0;
  wrong = 0;
  mistakes = [];
  answered = false;
  
  document.getElementById('quizLevelLabel').innerHTML = `${level.icon} ${level.name}`;
  document.getElementById('quizQCounter').innerHTML = `Q1 / ${questions.length}`;
  
  showScreen('quizScreen');
  renderQuestion();
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function goHome() {
  if (confirm('Leave this level?')) {
    renderHome();
    showScreen('homeScreen');
  }
}

function renderQuestion() {
  const q = questions[qIndex];
  const total = questions.length;
  
  document.getElementById('quizQCounter').innerHTML = `Q${qIndex + 1}/${total}`;
  document.getElementById('scoreCorrect').innerHTML = score;
  document.getElementById('scoreWrong').innerHTML = wrong;
  document.getElementById('scorePercent').innerHTML = score + wrong ? Math.round((score / (score + wrong)) * 100) + '%' : '—';
  document.getElementById('quizProgressBar').style.width = (qIndex / total * 100) + '%';
  
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('checkButton').style.display = 'block';
  document.getElementById('nextButton').style.display = 'none';
  
  let hintAvailable = false;
  if (currentLevel.id !== 'combo') {
    if (q.category === 'equation' && !q.noHint) {
      hintAvailable = equationHintsUsed < 7;
    } else if (q.category === 'word' && q.hasHint) {
      hintAvailable = wordHintsUsed < 2;
    }
  }
  
  document.getElementById('hintButton').style.display = hintAvailable ? 'block' : 'none';
  document.getElementById('hintButton').disabled = false;
  
  answered = false;
  
  let typeLabel = {
    'counting_add': '🔢 Counting', 'counting_sub': '🔢 Counting',
    'carry_add': '➕ Carry', 'borrow_sub': '➖ Borrow',
    'add_three': '🔺 Add 3', 'sub_three': '🔻 Sub 3',
    'compose_add': '🧩 Make Sum', 'compose_sub': '🔍 Find Gap',
    'word': '📖 Word', 'word_compose': '📖 Word',
    'missing_two': '❓ Missing +', 'missing_three': '❓ Missing +'
  }[q.type] || '🧮 Math';
  
  let html = '';
  
  if (q.type === 'compose_add' || q.type === 'compose_sub' || q.type === 'word_compose') {
    html = `
      <div class="q-type-badge">${typeLabel}</div>
      <div class="question-text">${q.question}</div>
      <input class="answer-input" id="answerInput" type="text" placeholder="e.g. 8 + 4" autocomplete="off">
    `;
  } else {
    html = `
      <div class="q-type-badge">${typeLabel}</div>
      <div class="question-text">${q.question}</div>
      <input class="answer-input" id="answerInput" type="number" inputmode="numeric" placeholder="Type answer..." autocomplete="off">
    `;
  }
  
  html += `<div class="hint-box" id="hintDisplay">${q.hint || ''}</div>`;
  
  document.getElementById('questionCard').innerHTML = html;
  document.getElementById('answerInput')?.focus();
}

function showHint() {
  if (!questions[qIndex]) return;
  
  const q = questions[qIndex];
  
  if (q.category === 'equation') equationHintsUsed++;
  else if (q.category === 'word') wordHintsUsed++;
  
  document.getElementById('hintDisplay').style.display = 'block';
  document.getElementById('hintButton').disabled = true;
}

function checkAnswer() {
  if (answered) return;
  
  const q = questions[qIndex];
  const input = document.getElementById('answerInput');
  if (!input) return;
  
  const val = input.value.trim();
  if (val === '') {
    alert('Please enter an answer!');
    return;
  }
  
  answered = true;
  let isCorrect = false;
  
  if (q.type === 'compose_add' || q.type === 'word_compose') {
    let parts = val.split('+').map(p => parseInt(p.trim()));
    if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
      isCorrect = (parts[0] + parts[1] === q.target);
    }
  } else if (q.type === 'compose_sub') {
    let parts = val.split('-').map(p => parseInt(p.trim()));
    if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
      isCorrect = (parts[0] - parts[1] === q.target);
    }
  } else {
    isCorrect = (parseInt(val) === q.answer);
  }
  
  if (isCorrect) {
    score++;
    document.getElementById('feedback').className = 'feedback show ok';
    document.getElementById('feedback').innerHTML = '✅ Correct!';
  } else {
    wrong++;
    mistakes.push({
      question: q.question,
      yourAnswer: val,
      correct: q.answer
    });
    document.getElementById('feedback').className = 'feedback show bad';
    document.getElementById('feedback').innerHTML = `❌ Correct: ${q.answer}`;
  }
  
  document.getElementById('scoreCorrect').innerHTML = score;
  document.getElementById('scoreWrong').innerHTML = wrong;
  document.getElementById('scorePercent').innerHTML = Math.round((score / (score + wrong)) * 100) + '%';
  
  document.getElementById('checkButton').style.display = 'none';
  document.getElementById('nextButton').style.display = 'block';
  document.getElementById('hintButton').style.display = 'none';
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  const passed = pct >= 70;
  
  if (passed) {
    progress[currentLevel.id] = {
      completed: true,
      score: pct
    };
  }
  
  const encouragement = ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)];
  
  document.getElementById('resultEmoji').innerHTML = pct >= 90 ? '🏆' : pct >= 70 ? '🌟' : '💪';
  document.getElementById('resultTitle').innerHTML = pct >= 90 ? 'Amazing!' : pct >= 70 ? 'Good job!' : 'Keep practicing!';
  document.getElementById('resultStars').innerHTML = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : '⭐';
  document.getElementById('encouragement').innerHTML = encouragement;
  document.getElementById('resultMessage').innerHTML = `You got ${score} out of ${total} correct.`;
  
  let mistakesHtml = '';
  if (mistakes.length > 0) {
    mistakesHtml = '<h3 style="color:#ffb3b3; margin:10px 0;">📝 Review:</h3>';
    mistakes.forEach(m => {
      mistakesHtml += `
        <div class="mistake-item">
          <strong>${m.question}</strong><br>
          Your: ${m.yourAnswer} ❌ Correct: ${m.correct}
        </div>
      `;
    });
  }
  document.getElementById('mistakesList').innerHTML = mistakesHtml;
  
  document.getElementById('retryButton').onclick = () => startLevel(currentLevel);
  
  const levelIndex = LEVELS.findIndex(l => l.id === currentLevel.id);
  if (passed && levelIndex < LEVELS.length - 1) {
    document.getElementById('nextLevelButton').style.display = 'block';
    document.getElementById('nextLevelButton').onclick = () => startLevel(LEVELS[levelIndex + 1]);
  } else {
    document.getElementById('nextLevelButton').style.display = 'none';
  }
  
  renderHome();
  showScreen('resultScreen');
}

function saveProgress() {
  alert('Progress saved!');
}

function loadProgress() {
  alert('Progress loaded!');
}

renderHome();
</script>
</body>
</html>
